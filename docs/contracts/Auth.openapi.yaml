openapi: 3.0.3
info:
  title: Authentication & Account Recovery API Contract
  description: Shared API contract for authentication, token management, and account recovery for the Epidemiology Knowledge Base.
  version: 1.0.0
servers:
  - url: /api/v1
    description: Primary API endpoint base path

paths:
  /auth/login:
    post:
      summary: User authentication
      description: Authenticates user credentials and issues JWT access and refresh tokens.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication with tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: Invalid or missing request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid username/email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '423':
          description: Account is locked due to security policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      summary: Refresh authentication tokens
      description: Exchanges a valid refresh token for a new access token and refresh token pair.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      summary: User logout
      description: Revokes the current session and invalidates the refresh token.
      operationId: logout
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized or missing authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/recovery/request:
    post:
      summary: Initiate account recovery
      description: Requests a password reset link/token to be sent to the user's registered email address.
      operationId: requestAccountRecovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRecoveryRequest'
      responses:
        '200':
          description: Recovery request accepted and email dispatch initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordRecoveryInitiatedResponse'
        '400':
          description: Invalid email format or missing username
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account with specified credentials not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many recovery attempts; rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/recovery/reset:
    post:
      summary: Complete password recovery
      description: Resets user password using a valid recovery token.
      operationId: confirmPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmationRequest'
      responses:
        '200':
          description: Password reset successfully completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid/expired recovery token or weak new password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Recovery token not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: Username or registered email address of the employee
          example: "ivanov_ii"
        password:
          type: string
          format: password
          description: User secret password
          example: "SecretP@ssword2026"

    AuthTokenResponse:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
        - user
      properties:
        access_token:
          type: string
          description: Signed JWT access token for API authorization
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refresh_token:
          type: string
          description: Opaque or signed token used to obtain new access tokens
          example: "d9f8a3c2-4b1e-4c7d-8a9b-0c1d2e3f4a5b"
        token_type:
          type: string
          enum: [Bearer]
          default: Bearer
          description: Authentication scheme header prefix
          example: "Bearer"
        expires_in:
          type: integer
          description: Access token lifetime in seconds
          example: 3600
        user:
          $ref: '#/components/schemas/UserInfo'

    UserInfo:
      type: object
      required:
        - id
        - username
        - role
      properties:
        id:
          type: integer
          format: int64
          description: Unique user identifier
          example: 101
        username:
          type: string
          description: Account login username
          example: "ivanov_ii"
        role:
          type: string
          enum: [ADMIN, RESEARCHER, USER]
          description: Access control role within the institute portal
          example: "RESEARCHER"
        full_name:
          type: string
          nullable: true
          description: Full name of the institute employee
          example: "Иванов Иван Иванович"
        email:
          type: string
          format: email
          nullable: true
          description: Official email address of the employee
          example: "ivanov@epidemiology-inst.ru"

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: Valid refresh token previously issued to the client
          example: "d9f8a3c2-4b1e-4c7d-8a9b-0c1d2e3f4a5b"

    LogoutRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: Refresh token to invalidate upon user sign-out
          example: "d9f8a3c2-4b1e-4c7d-8a9b-0c1d2e3f4a5b"

    PasswordRecoveryRequest:
      type: object
      required:
        - identity
      properties:
        identity:
          type: string
          description: Registered username or email address for account recovery
          example: "ivanov@epidemiology-inst.ru"

    PasswordRecoveryInitiatedResponse:
      type: object
      required:
        - recovery_id
        - message
      properties:
        recovery_id:
          type: string
          format: uuid
          description: Unique identifier tracking the recovery request lifecycle
          example: "c73a8f10-1d2e-4b3c-9a8b-7c6d5e4f3a2b"
        message:
          type: string
          description: Human-readable status message in Russian
          example: "Инструкции по восстановлению пароля отправлены на ваш электронный адрес."

    PasswordResetConfirmationRequest:
      type: object
      required:
        - recovery_token
        - new_password
      properties:
        recovery_token:
          type: string
          description: Secure token received via recovery instructions
          example: "rec_tok_8f9e0d1c2b3a4f5e"
        new_password:
          type: string
          format: password
          description: New account password satisfying security complexity policies
          example: "NewStrongP@ss2026!"

    SuccessResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          description: Success outcome message in Russian
          example: "Операция выполнена успешно."

    ErrorResponse:
      type: object
      required:
        - error_code
        - message
        - timestamp
      properties:
        error_code:
          type: string
          description: Machine-readable error code string
          example: "INVALID_CREDENTIALS"
        message:
          type: string
          description: Human-readable error message in Russian
          example: "Неверное имя пользователя или пароль."
        details:
          type: object
          additionalProperties: true
          nullable: true
          description: Field-level validation errors or additional context
        timestamp:
          type: string
          format: date-time
          description: Server timestamp when error occurred

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: []
