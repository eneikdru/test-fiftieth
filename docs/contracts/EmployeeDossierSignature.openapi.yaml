openapi: 3.0.3
info:
  title: API Подписи Сводного Досье Сотрудника
  description: Контракт API для подписания сгенерированных отчетов и досье сотрудников.
  version: 1.0.0
servers:
  - url: /api/v1
    description: Основной сервер API
paths:
  /dossier/reports/{id}/sign:
    post:
      summary: Подписание сгенерированной сводной справки досье
      description: Эпидемиолог или администратор может подписать сгенерированную справку досье сотрудника.
      operationId: signDossierReport
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Уникальный идентификатор отчета
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - signature
              properties:
                signature:
                  type: string
                  description: Цифровая подпись / текстовое заверение отчета
                  example: "Подписано: Старший научный сотрудник Иванов И.И."
      responses:
        '200':
          description: Справка успешно подписана
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  employee_id:
                    type: string
                  template_type:
                    type: string
                  status:
                    type: string
                  is_signed:
                    type: boolean
                  signature:
                    type: string
        '400':
          description: Ошибка валидации данных (отсутствует подпись)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Доступ запрещен (недостаточно прав для подписания)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Справка не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Конфликт состояния (справка еще не завершена или уже подписана)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - error_code
        - message
      properties:
        error_code:
          type: string
          example: "VALIDATION_ERROR"
        message:
          type: string
          example: "Не указан обязательный параметр signature."

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
