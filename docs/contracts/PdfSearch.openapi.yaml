openapi: 3.0.3
info:
  title: API Полнотекстового Поиска PDF Документов
  description: Контракт API для полнотекстового поиска внутри PDF-файлов и документов (приказы, выписки из ученого совета, отчеты, результаты экзаменов).
  version: 1.0.0
servers:
  - url: /api/v1
    description: Основной сервер API
paths:
  /documents/search:
    get:
      summary: Полнотекстовый поиск внутри PDF-файлов и документов
      description: Производит полнотекстовый поиск по содержимому загруженных PDF-файлов и документов (приказы, выписки с ученого совета, отчеты и результаты экзаменов). Возвращает структурированный список совпадений с фрагментами найденного текста и подсвеченными вхождениями.
      operationId: searchPdfDocuments
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          description: Текст поискового запроса (например, фамилия для приказов, выписок или отчетов)
          required: true
          schema:
            type: string
            example: "Иванов"
        - name: doc_type
          in: query
          description: Фильтр по типу документа (например, ORDER, COUNCIL_EXTRACT, REPORT, EXAM_RESULT)
          required: false
          schema:
            type: string
            example: "ORDER"
        - name: from_date
          in: query
          description: Начальная дата периода издания документа
          required: false
          schema:
            type: string
            format: date
            example: "2023-01-01"
        - name: to_date
          in: query
          description: Конечная дата периода издания документа
          required: false
          schema:
            type: string
            format: date
            example: "2023-12-31"
        - name: page
          in: query
          description: Номер страницы результатов поиска (начиная с 0)
          required: false
          schema:
            type: integer
            default: 0
            example: 0
        - name: size
          in: query
          description: Количество результатов на странице
          required: false
          schema:
            type: integer
            default: 20
            example: 20
      responses:
        '200':
          description: Успешный результат полнотекстового поиска
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdfSearchResultResponse'
        '400':
          description: Некорректные параметры запроса или отсутствующий поисковый запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Пользователь не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера при выполнении полнотекстового поиска
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    PdfSearchResultResponse:
      type: object
      required:
        - items
        - total_elements
        - page
        - size
      properties:
        items:
          type: array
          description: Список найденных совпадений в документах
          items:
            $ref: '#/components/schemas/PdfSearchMatchItem'
        total_elements:
          type: integer
          format: int64
          description: Общее количество найденных совпадений
          example: 42
        page:
          type: integer
          description: Текущий номер страницы результатов (начиная с 0)
          example: 0
        size:
          type: integer
          description: Размер страницы результатов
          example: 20

    PdfSearchMatchItem:
      type: object
      required:
        - document_id
        - title
        - doc_type
        - highlights
      properties:
        document_id:
          type: integer
          format: int64
          description: Уникальный идентификатор документа
          example: 15
        title:
          type: string
          description: Название документа
          example: "Приказ о результатах квалификационного экзамена"
        doc_type:
          type: string
          description: Тип документа (например, ORDER, COUNCIL_EXTRACT, REPORT, EXAM_RESULT)
          example: "EXAM_RESULT"
        author_organization:
          type: string
          nullable: true
          description: Организация-автор документа
          example: "Ученый совет НИИ"
        publication_date:
          type: string
          format: date
          nullable: true
          description: Дата публикации или издания документа
          example: "2023-05-20"
        highlights:
          type: array
          items:
            type: string
          description: Фрагменты содержимого документа с подсвеченными совпадениями поискового запроса
          example:
            - "По результатам проверки служащий <em>Иванов</em> И.И. сдал экзамен на отлично."
        matched_pages:
          type: array
          items:
            type: integer
          nullable: true
          description: Номера страниц внутри PDF-файла, на которых обнаружен искомый текст
          example: [2, 5]
        relevance_score:
          type: number
          format: float
          nullable: true
          description: Оценка релевантности совпадения
          example: 0.95

    ErrorResponse:
      type: object
      required:
        - error_code
        - message
        - timestamp
      properties:
        error_code:
          type: string
          description: Машинно-читаемый код ошибки
          example: "INVALID_SEARCH_QUERY"
        message:
          type: string
          description: Человекочитаемое сообщение об ошибке на русском языке
          example: "Поисковый запрос не должен быть пустым."
        details:
          type: object
          additionalProperties: true
          nullable: true
          description: Детальная информация об ошибке
        timestamp:
          type: string
          format: date-time
          description: Временная метка ошибки

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
