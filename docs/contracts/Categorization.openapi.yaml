openapi: 3.0.1
info:
  title: Root Cause Categorization API
  version: "1.0"
paths:
  /api/v1/categorization/coverage:
    get:
      summary: Get categorization coverage rate telemetry
      operationId: getCategorizationCoverage
      tags:
        - Categorization
      parameters:
        - name: streamName
          in: query
          required: false
          schema:
            type: string
            default: reviewConcerns
          description: The name of the stream to measure coverage for
      responses:
        '200':
          description: Categorization coverage retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorizationCoverageResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
  /api/v1/categorization/{streamName}:
    post:
      summary: Categorize defect events
      operationId: categorizeStream
      tags:
        - Categorization
      parameters:
        - name: streamName
          in: path
          required: true
          schema:
            type: string
          description: The name of the stream to categorize (e.g., reviewConcerns)
      responses:
        '200':
          description: Categorization successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorizationResult'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
components:
  schemas:
    CategorizationResult:
      type: object
      properties:
        categorizedCount:
          type: integer
          description: The number of defect events successfully categorized
    CategorizationCoverageResponse:
      type: object
      properties:
        streamName:
          type: string
          description: The name of the stream
        totalConcerns:
          type: integer
          format: int64
          description: Total number of concerns
        categorizedConcerns:
          type: integer
          format: int64
          description: Number of categorized concerns with non-null rootCausePatternId
        coverageRate:
          type: number
          format: double
          description: Percentage of concerns with non-null rootCausePatternId (0.0 to 100.0)
