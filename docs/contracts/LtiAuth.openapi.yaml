openapi: 3.0.3
info:
  title: Moodle LTI SSO API Contract
  description: API contract for Moodle LTI (Learning Tools Interoperability) launch parameter authentication, role and department synchronization, and session token generation.
  version: 1.0.0
servers:
  - url: /api/v1
    description: Primary API endpoint base path

paths:
  /auth/lti/launch:
    post:
      summary: Process Moodle LTI launch request and authenticate user
      description: Validates LTI launch parameters and OAuth HMAC-SHA1 signature from Moodle LMS, synchronizes user role and department, and returns a valid session JWT token pair.
      operationId: processLtiLaunch
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LtiLaunchRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/LtiLaunchRequest'
      responses:
        '200':
          description: Successful LTI launch authentication with synced user profile and JWT token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: Missing required launch parameters or invalid request format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid OAuth signature or unauthorized LTI launch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    LtiLaunchRequest:
      type: object
      properties:
        user_id:
          type: string
          description: Unique user identifier in Moodle
          example: "moodle_lti_user_01"
        ext_user_username:
          type: string
          description: External username in Moodle
          example: "moodle_lti_user"
        username:
          type: string
          description: Alternative user account login username
          example: "moodle_lti_user"
        lis_person_name_full:
          type: string
          description: Full name of the user passed by LMS
          example: "Петров Петр Петрович"
        full_name:
          type: string
          description: Alternative full name property
          example: "Петров Петр Петрович"
        lis_person_contact_email_primary:
          type: string
          format: email
          description: Primary email address of the user
          example: "lti_user@epidemiology-inst.ru"
        email:
          type: string
          format: email
          description: Alternative email property
          example: "lti_user@epidemiology-inst.ru"
        roles:
          type: string
          description: LTI roles string passed from LMS
          example: "Instructor,urn:lti:sysrole:ims/lis/Administrator"
        moodle_role:
          type: string
          description: Alternative Moodle role string
          example: "Старший научный сотрудник"
        custom_department:
          type: string
          description: Custom department parameter passed from Moodle
          example: "Вирусология"
        department:
          type: string
          description: Department or кафедра
          example: "Вирусология"
        custom_courses:
          type: string
          description: Enrolled courses list
          example: "EPI-101,VIR-202"
        courses:
          type: string
          description: Alternative courses string
          example: "EPI-101,VIR-202"
        lti_message_type:
          type: string
          default: "basic-lti-launch-request"
          example: "basic-lti-launch-request"
        lti_version:
          type: string
          default: "LTI-1p0"
          example: "LTI-1p0"
        oauth_consumer_key:
          type: string
          description: OAuth consumer key configured for Moodle LTI integration
          example: "moodle_lti_key"
        oauth_signature_method:
          type: string
          default: "HMAC-SHA1"
          example: "HMAC-SHA1"
        oauth_timestamp:
          type: string
          description: Epoch timestamp of the launch request
          example: "1757126400"
        oauth_nonce:
          type: string
          description: Unique nonce string to prevent replay attacks
          example: "nonce_abc123"
        oauth_signature:
          type: string
          description: OAuth HMAC-SHA1 signature generated by LMS
          example: "vS2J8xM9p1K..."

    AuthTokenResponse:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
        - user
      properties:
        access_token:
          type: string
          description: Signed JWT access token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refresh_token:
          type: string
          description: Opaque refresh token
          example: "ref_moodle_lti_user_1757126400000"
        token_type:
          type: string
          enum: [Bearer]
          default: Bearer
          example: "Bearer"
        expires_in:
          type: integer
          example: 3600
        user:
          $ref: '#/components/schemas/UserInfo'

    UserInfo:
      type: object
      required:
        - id
        - username
        - role
      properties:
        id:
          type: integer
          format: int64
          example: 102
        username:
          type: string
          example: "moodle_lti_user"
        role:
          type: string
          enum: [ADMIN, EPIDEMIOLOGIST, RESEARCHER, USER]
          example: "EPIDEMIOLOGIST"
        full_name:
          type: string
          nullable: true
          example: "Петров Петр Петрович"
        email:
          type: string
          format: email
          nullable: true
          example: "lti_user@epidemiology-inst.ru"
        department:
          type: string
          nullable: true
          example: "Вирусология"
        courses:
          type: string
          nullable: true
          example: "EPI-101,VIR-202"
        moodle_id:
          type: string
          nullable: true
          example: "moodle_lti_user_01"

    ErrorResponse:
      type: object
      required:
        - error_code
        - message
        - timestamp
      properties:
        error_code:
          type: string
          example: "INVALID_LTI_SIGNATURE"
        message:
          type: string
          example: "Недействительная подпись LTI запроса."
        timestamp:
          type: string
          format: date-time
          example: "2026-09-06T10:00:00Z"
