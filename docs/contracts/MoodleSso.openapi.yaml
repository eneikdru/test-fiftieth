openapi: 3.0.3
info:
  title: Moodle Single Sign-On (SSO) API Contract
  description: Shared API contract between backend and frontend for Moodle OAuth2/OIDC SSO integration, role and department synchronization, and autonomous fallback authentication.
  version: 1.0.0
servers:
  - url: /api/v1
    description: Primary API endpoint base path

paths:
  /auth/moodle/config:
    get:
      summary: Get Moodle SSO configuration
      description: Returns the OAuth2 login URL for initiating SSO authentication with Moodle.
      operationId: getMoodleConfig
      responses:
        '200':
          description: Moodle SSO configuration returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoodleConfigResponse'
        '500':
          description: Internal server error or configuration unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/moodle/callback:
    post:
      summary: Moodle OAuth2 callback and role synchronization
      description: Receives the authorization code from Moodle, exchanges it for user credentials, synchronizes department/course-based roles, and issues session JWT tokens.
      operationId: moodleCallback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoodleCallbackRequest'
      responses:
        '200':
          description: Successful Moodle SSO authentication with synced user profile and JWT token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: Invalid authorization code or missing request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed or invalid Moodle state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: External Moodle LMS server unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/sso/moodle:
    post:
      summary: Moodle SSO token exchange with local fallback
      description: Authenticates user via Moodle SSO token. If external LMS is offline, supports local fallback authentication using saved credentials.
      operationId: moodleSsoTokenLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoodleSsoRequest'
      responses:
        '200':
          description: Successful SSO token login or fallback authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: Invalid request payload or missing parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: SSO token invalid and fallback password incorrect or absent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    MoodleConfigResponse:
      type: object
      required:
        - login_url
        - auth_url
      properties:
        login_url:
          type: string
          format: uri
          description: OAuth2 authorization URL for Moodle
          example: "https://moodle.epidemiology-inst.ru/oauth2/authorize?client_id=archive_app"
        auth_url:
          type: string
          format: uri
          description: Alias authorization URL for frontend compatibility
          example: "https://moodle.epidemiology-inst.ru/oauth2/authorize?client_id=archive_app"

    MoodleCallbackRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: Authorization code received from Moodle OAuth2 provider
          example: "splxlOBeZQQYbYS6WxSbIA"
        state:
          type: string
          description: CSRF validation state token
          example: "xyz123"

    MoodleSsoRequest:
      type: object
      required:
        - username
        - moodle_token
      properties:
        username:
          type: string
          description: Username or email associated with Moodle account
          example: "moodle_user"
        moodle_token:
          type: string
          description: SSO authentication token from Moodle
          example: "mock_valid_moodle_token"
        fallback_password:
          type: string
          format: password
          nullable: true
          description: Optional local fallback password used when external Moodle LMS is offline
          example: "MySecureFallback!"

    AuthTokenResponse:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
        - user
      properties:
        access_token:
          type: string
          description: Signed JWT access token for authorization header
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refresh_token:
          type: string
          description: Opaque refresh token to obtain new access tokens
          example: "d9f8a3c2-4b1e-4c7d-8a9b-0c1d2e3f4a5b"
        token_type:
          type: string
          enum: [Bearer]
          default: Bearer
          description: Authentication header scheme
          example: "Bearer"
        expires_in:
          type: integer
          description: Access token TTL in seconds
          example: 3600
        user:
          $ref: '#/components/schemas/UserInfo'

    UserInfo:
      type: object
      required:
        - id
        - username
        - role
      properties:
        id:
          type: integer
          format: int64
          description: Unique user identifier
          example: 101
        username:
          type: string
          description: Account login username
          example: "moodle_user"
        role:
          type: string
          enum: [ADMIN, EPIDEMIOLOGIST, RESEARCHER, USER]
          description: Internal archive role mapped from Moodle role hierarchy (Администратор -> ADMIN, Старший научный сотрудник / Эпидемиолог -> EPIDEMIOLOGIST, Исследователь / Аспирант -> RESEARCHER, Пользователь -> USER)
          example: "EPIDEMIOLOGIST"
        full_name:
          type: string
          nullable: true
          description: Full name of the institute employee
          example: "Иванов Иван Иванович"
        email:
          type: string
          format: email
          nullable: true
          description: Official email address of the employee
          example: "moodle@epidemiology-inst.ru"
        department:
          type: string
          nullable: true
          description: Moodle department / кафедра for access restriction
          example: "Эпидемиология"
        courses:
          type: string
          nullable: true
          description: Moodle enrolled courses list for access restriction
          example: "BIO-101,EPI-202"
        moodle_id:
          type: string
          nullable: true
          description: External Moodle user identifier
          example: "moodle_user_101"

    ErrorResponse:
      type: object
      required:
        - error_code
        - message
        - timestamp
      properties:
        error_code:
          type: string
          description: Machine-readable error code string
          example: "MOODLE_AUTH_FAILED"
        message:
          type: string
          description: Human-readable error message in Russian
          example: "Ошибка аутентификации через систему Moodle."
        details:
          type: object
          additionalProperties: true
          nullable: true
          description: Validation error details or additional context
        timestamp:
          type: string
          format: date-time
          description: Server timestamp when error occurred
