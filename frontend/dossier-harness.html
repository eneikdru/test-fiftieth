<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск досье сотрудника</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://unpkg.com/svelte@3.59.2/compiler.js"></script>
    <style>
        body { background-color: #f7f9fb; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import * as svelteInternal from 'https://unpkg.com/svelte@3.59.2/internal/index.mjs';

        async function loadComponent() {
            try {
                const response = await fetch('http://localhost/src/components/DossierSearch.svelte');
                const source = await response.text();

                const { js } = window.svelte.compile(source, {
                    format: 'esm',
                    name: 'DossierSearch',
                    sveltePath: 'svelte'
                });

                const codeWithMjs = js.code.replace(/from "svelte\/internal"/g, `from "https://unpkg.com/svelte@3.59.2/internal/index.mjs"`);

                const blob = new Blob([codeWithMjs], { type: 'application/javascript' });
                const blobUrl = URL.createObjectURL(blob);

                const module = await import(blobUrl);
                const DossierSearch = module.default;

                new DossierSearch({
                    target: document.getElementById('app'),
                    props: { apiBaseUrl: 'http://localhost/api/v1/dossier' }
                });
            } catch (err) {
                console.error('Error loading DossierSearch component:', err);
                document.getElementById('app').innerHTML = `<h1 class="error">Error loading component: ${err.message}</h1>`;
            }
        }
        loadComponent();
    </script>
</body>
</html>
