<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dossier Search Mock</title>
    <style>
        .dossier-container { padding: 20px; font-family: sans-serif; color: #333; }
        .search-section { margin-bottom: 20px; display: flex; gap: 10px; }
        input { padding: 8px; flex-grow: 1; border: 1px solid #767676; border-radius: 4px; color: #111; }
        input:focus { outline: 2px solid #0056b3; outline-offset: 2px; }
        button { padding: 8px 16px; background-color: #0056b3; color: #ffffff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #004494; }
        button:focus { outline: 2px solid #0056b3; outline-offset: 2px; }
        button:disabled { background-color: #6c757d; color: #e9ecef; cursor: not-allowed; }
        .document-list { list-style: none; padding: 0; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; }
        .document-list li { padding: 12px; border-bottom: 1px solid #eee; }
        .document-list li:last-child { border-bottom: none; }
        .pagination-controls { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .page-indicator { font-weight: bold; }
        .report-section { display: flex; align-items: center; margin-bottom: 20px; }
        .feedback-notice { margin-top: 15px; padding: 10px; background-color: #e2e3e5; color: #383d41; border-radius: 4px; font-size: 14px; border: 1px solid #d6d8db; }
        .dossier-footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #ccc; text-align: center; font-size: 12px; color: #555; display: flex; justify-content: space-between; align-items: center; }
        .imprint-btn { background: none; border: none; color: #0056b3; text-decoration: underline; cursor: pointer; padding: 0; font-weight: normal; }
        .imprint-btn:hover { background: none; }
    </style>
</head>
<body>
    <div id="app">
        <div class="dossier-container">
            <div class="search-section">
                <input type="text" id="search-query-input" placeholder="Фамилия сотрудника" aria-label="Поиск по фамилии сотрудника" />
                <button id="search-button" aria-label="Искать документы">Поиск</button>
            </div>
            <div id="results-container" style="display: none;">
                <ul class="document-list" id="document-list" aria-label="Список документов"></ul>

                <div class="pagination-controls" aria-label="Управление страницами">
                    <button id="prev-page-button" aria-label="Предыдущая страница" disabled>Назад</button>
                    <span class="page-indicator" id="page-indicator" aria-live="polite">Страница 1</span>
                    <button id="next-page-button" aria-label="Следующая страница">Вперёд</button>
                </div>

                <div class="report-section">
                    <button id="generate-report-button" aria-label="Сформировать итоговую справку">Сформировать итоговую справку</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const searchButton = document.getElementById('search-button');
        const searchInput = document.getElementById('search-query-input');
        const resultsContainer = document.getElementById('results-container');
        const documentList = document.getElementById('document-list');
        const generateReportButton = document.getElementById('generate-report-button');
        const prevPageButton = document.getElementById('prev-page-button');
        const nextPageButton = document.getElementById('next-page-button');
        const pageIndicator = document.getElementById('page-indicator');

        let currentPage = 0;
        const pageSize = 10;
        let currentQuery = '';

        async function fetchDocs(page) {
            try {
                const response = await fetch(`/api/v1/dossier/documents?query=${encodeURIComponent(currentQuery)}&page=${page}&size=${pageSize}`);
                if (response.ok) {
                    const data = await response.json();
                    documentList.innerHTML = '';
                    data.forEach(doc => {
                        const li = document.createElement('li');
                        li.innerText = doc.title;
                        documentList.appendChild(li);
                    });

                    currentPage = page;
                    pageIndicator.innerText = `Страница ${currentPage + 1}`;
                    prevPageButton.disabled = currentPage === 0;
                    nextPageButton.disabled = data.length < pageSize;

                    resultsContainer.style.display = 'block';
                }
            } catch (e) {
                console.error(e);
            }
        }

        searchButton.addEventListener('click', () => {
            currentQuery = searchInput.value.trim();
            if (!currentQuery) return;
            fetchDocs(0);
        });

        nextPageButton.addEventListener('click', () => {
            fetchDocs(currentPage + 1);
        });

        prevPageButton.addEventListener('click', () => {
            if (currentPage > 0) fetchDocs(currentPage - 1);
        });

        generateReportButton.addEventListener('click', () => {
            generateReportButton.disabled = true;
            generateReportButton.innerHTML = '<span id="loading-spinner">Загрузка...</span>';
            setTimeout(() => {
                generateReportButton.disabled = false;
                generateReportButton.innerHTML = 'Сформировать итоговую справку';
                const notice = document.createElement('div');
                notice.setAttribute('role', 'status');
                notice.setAttribute('aria-live', 'polite');
                notice.style.cssText = 'margin-top: 15px; padding: 10px; background-color: #e2e3e5; color: #383d41; border-radius: 4px; font-size: 14px; border: 1px solid #d6d8db;';
                notice.innerText = '✓ Итоговая справка успешно сформирована.';
                resultsContainer.appendChild(notice);
            }, 1000);
        });
    </script>

    <footer style="margin-top: 40px; padding-top: 20px; border-top: 1px solid #ccc; text-align: center; font-size: 12px; color: #555; display: flex; justify-content: space-between; align-items: center;">
        <span>Российский научно-исследовательский институт эпидемиологии</span>
        <button onclick="alert('Выходные данные (Imprint / Impressum):\nФБУН «НИИ Эпидемиологии»\nг. Москва, ул. Новогиреевская, 3А\nТел: +7 (495) 123-45-67')" style="background: none; border: none; color: #0056b3; text-decoration: underline; cursor: pointer; padding: 0; font-weight: normal;">
            Выходные данные (Imprint / Impressum)
        </button>
    </footer>
</body>
</html>
