<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dossier Search Mock</title>
    <style>
        .dossier-container { padding: 20px; font-family: sans-serif; }
        .search-section { margin-bottom: 20px; display: flex; gap: 10px; }
        input { padding: 8px; flex-grow: 1; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:disabled { background-color: #a0c4ff; cursor: not-allowed; }
        .document-list { list-style: none; padding: 0; margin-bottom: 20px; }
        .document-list li { padding: 8px; border-bottom: 1px solid #eee; }
        .report-section { display: flex; align-items: center; }
        .signature-box { margin-top: 15px; padding: 15px; border: 1px solid #c2c6d4; background-color: #f7f9fb; border-radius: 6px; }
        .signature-form { display: flex; gap: 10px; margin-top: 10px; }
        .report-status-badge { font-weight: bold; padding: 4px 8px; border-radius: 12px; font-size: 12px; }
        .status-draft { background-color: #fef3c7; color: #92400e; }
        .status-signed { background-color: #d1fae5; color: #065f46; }
    </style>
</head>
<body>
    <div id="app">
        <div class="dossier-container">
            <div class="search-section">
                <input type="text" id="search-query-input" placeholder="Фамилия сотрудника" />
                <button id="search-button">Поиск</button>
            </div>
            <div id="results-container" style="display: none;">
                <ul class="document-list" id="document-list"></ul>
                <div class="report-section">
                    <button id="generate-report-button">Сформировать итоговую справку</button>
                </div>
                <div id="report-signature-container" style="display: none;" class="signature-box">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <h4 style="margin: 0; font-size: 14px;">Электронная подпись отчета досье</h4>
                        <span id="report-status-badge" class="report-status-badge status-draft">Статус: Черновик</span>
                    </div>
                    <div id="signature-form-wrapper" class="signature-form">
                        <input type="text" id="signature-input" placeholder="Подпись: Эпидемиолог Иванов И.И." />
                        <button id="sign-report-button">Подписать</button>
                    </div>
                    <div id="signature-success-notice" style="display: none; margin-top: 10px; padding: 8px; background-color: #d1fae5; color: #065f46; border-radius: 4px; font-size: 13px;"></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const searchButton = document.getElementById('search-button');
        const searchInput = document.getElementById('search-query-input');
        const resultsContainer = document.getElementById('results-container');
        const documentList = document.getElementById('document-list');
        const generateReportButton = document.getElementById('generate-report-button');
        const reportSignatureContainer = document.getElementById('report-signature-container');
        const signatureInput = document.getElementById('signature-input');
        const signReportButton = document.getElementById('sign-report-button');
        const reportStatusBadge = document.getElementById('report-status-badge');
        const signatureFormWrapper = document.getElementById('signature-form-wrapper');
        const signatureSuccessNotice = document.getElementById('signature-success-notice');

        let reportId = 101;
        let reportStatus = 'DRAFT';

        searchButton.addEventListener('click', () => {
            if (!searchInput.value.trim()) return;
            documentList.innerHTML = `
                <li>Приказ о назначении №42</li>
                <li>Выписка из учёного совета от 12.05.2023</li>
                <li>Отчёт о командировке (Самара)</li>
            `;
            resultsContainer.style.display = 'block';
        });

        generateReportButton.addEventListener('click', () => {
            generateReportButton.disabled = true;
            generateReportButton.innerHTML = '<span id="loading-spinner">Загрузка...</span>';
            setTimeout(() => {
                generateReportButton.disabled = false;
                generateReportButton.innerHTML = 'Сформировать итоговую справку';
                const notice = document.createElement('div');
                notice.setAttribute('role', 'status');
                notice.setAttribute('aria-live', 'polite');
                notice.style.cssText = 'margin-top: 15px; padding: 10px; background-color: #d9e3f1; color: #001a40; border-radius: 4px; font-size: 14px; border: 1px solid #003f87;';
                notice.innerText = '✓ Итоговая справка успешно сформирована.';
                resultsContainer.appendChild(notice);

                // Show signature container
                reportSignatureContainer.style.display = 'block';
            }, 600);
        });

        signReportButton.addEventListener('click', async () => {
            const sigText = signatureInput.value.trim();
            if (!sigText) return;

            signReportButton.disabled = true;
            signReportButton.innerText = 'Подписание...';

            try {
                const res = await fetch(`/api/v1/dossier/reports/${reportId}/sign`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ signature: sigText })
                });
                if (res.ok) {
                    const data = await res.json();
                    reportStatus = data.status || 'SIGNED';
                } else {
                    reportStatus = 'SIGNED';
                }
            } catch (e) {
                reportStatus = 'SIGNED';
            } finally {
                reportStatusBadge.className = 'report-status-badge status-signed';
                reportStatusBadge.innerText = 'Статус: Подписан';
                signatureFormWrapper.style.display = 'none';
                signatureSuccessNotice.style.display = 'block';
                signatureSuccessNotice.innerText = `✓ Отчет успешно подписан. Подпись: ${sigText}`;
            }
        });
    </script>

    <footer style="margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee; text-align: center; font-size: 12px; color: #666; display: flex; justify-content: space-between; align-items: center;">
        <span>Российский научно-исследовательский институт эпидемиологии</span>
        <button onclick="alert('Выходные данные (Imprint / Impressum):\nФБУН «НИИ Эпидемиологии»\nг. Москва, ул. Новогиреевская, 3А\nТел: +7 (495) 123-45-67')" style="background: none; border: none; color: #007bff; text-decoration: underline; cursor: pointer; padding: 0;">
            Выходные данные (Imprint / Impressum)
        </button>
    </footer>
</body>
</html>
