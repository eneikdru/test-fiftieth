<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dossier Search Mock</title>
    <style>
        .dossier-container { padding: 20px; font-family: sans-serif; color: #191c1e; }
        .search-section { margin-bottom: 20px; display: flex; gap: 10px; }
        input { padding: 8px; flex-grow: 1; border: 1px solid #767676; border-radius: 4px; color: #191c1e; }
        input:focus { outline: 2px solid #005fcc; outline-offset: 2px; }
        button { padding: 8px 16px; background-color: #003f87; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
        button:focus { outline: 2px solid #005fcc; outline-offset: 2px; }
        button:disabled { background-color: #99c2ff; cursor: not-allowed; color: #191c1e; }
        .document-list { list-style: none; padding: 0; margin-bottom: 20px; }
        .document-list li { padding: 8px; border-bottom: 1px solid #c2c6d4; }
        .report-section { display: flex; align-items: center; }
        .notice-box { margin-bottom: 20px; padding: 12px 16px; border-radius: 4px; }
        .error-notice { background-color: #ffdad6; color: #93000a; border: 1px solid #ba1a1a; }
        .empty-notice { background-color: #eceef0; color: #191c1e; border: 1px solid #c2c6d4; text-align: center; }
        .loading-notice { text-align: center; color: #003f87; }
    </style>
</head>
<body>
    <div id="app">
        <div class="dossier-container">
            <div class="search-section">
                <input type="text" id="search-query-input" placeholder="Фамилия сотрудника" aria-label="Фамилия сотрудника" />
                <button id="search-button" aria-label="Поиск">Поиск</button>
            </div>

            <div id="state-container">
                <div id="loading-state" class="notice-box loading-notice" style="display: none;" role="status" aria-live="polite">
                    <span id="dossier-loading-spinner">Загрузка...</span>
                </div>
                <div id="error-state" class="notice-box error-notice" style="display: none;" role="alert">
                    <span id="error-message">Ошибка подключения к серверу. Досье недоступно.</span>
                </div>
                <div id="empty-state" class="notice-box empty-notice" style="display: none;" role="status">
                    <h3>нет материалов</h3>
                    <p>По вашему запросу документы досье не найдены.</p>
                </div>
                <div id="results-container" style="display: none;">
                    <ul class="document-list" id="document-list"></ul>
                    <div class="report-section">
                        <button id="generate-report-button">Сформировать итоговую справку</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const searchButton = document.getElementById('search-button');
        const searchInput = document.getElementById('search-query-input');
        const loadingState = document.getElementById('loading-state');
        const errorState = document.getElementById('error-state');
        const emptyState = document.getElementById('empty-state');
        const resultsContainer = document.getElementById('results-container');
        const documentList = document.getElementById('document-list');
        const generateReportButton = document.getElementById('generate-report-button');

        function hideAllStates() {
            loadingState.style.display = 'none';
            errorState.style.display = 'none';
            emptyState.style.display = 'none';
            resultsContainer.style.display = 'none';
        }

        async function searchDossier() {
            const query = searchInput.value.trim();
            if (!query) return;

            hideAllStates();
            loadingState.style.display = 'block';

            try {
                const res = await fetch(`/api/v1/dossier/documents?employee_surname=${encodeURIComponent(query)}`);
                hideAllStates();
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) {
                        documentList.innerHTML = data.map(doc => `<li>${doc.title || doc.name}</li>`).join('');
                        resultsContainer.style.display = 'block';
                    } else {
                        emptyState.style.display = 'block';
                    }
                } else {
                    errorState.style.display = 'block';
                }
            } catch (err) {
                hideAllStates();
                errorState.style.display = 'block';
            }
        }

        searchButton.addEventListener('click', searchDossier);

        generateReportButton.addEventListener('click', () => {
            generateReportButton.disabled = true;
            generateReportButton.innerHTML = '<span id="loading-spinner">Загрузка...</span>';
            setTimeout(() => {
                generateReportButton.disabled = false;
                generateReportButton.innerHTML = 'Сформировать итоговую справку';
                const notice = document.createElement('div');
                notice.setAttribute('role', 'status');
                notice.setAttribute('aria-live', 'polite');
                notice.style.cssText = 'margin-top: 15px; padding: 10px; background-color: #d9e3f1; color: #001a40; border-radius: 4px; font-size: 14px; border: 1px solid #003f87;';
                notice.innerText = '✓ Итоговая справка успешно сформирована.';
                resultsContainer.appendChild(notice);
            }, 1000);
        });
    </script>

    <footer style="margin-top: 40px; padding-top: 20px; border-top: 1px solid #c2c6d4; text-align: center; font-size: 12px; color: #424752; display: flex; justify-content: space-between; align-items: center;">
        <span>Российский научно-исследовательский институт эпидемиологии</span>
        <button onclick="alert('Выходные данные (Imprint / Impressum):\nФБУН «НИИ Эпидемиологии»\nг. Москва, ул. Новогиреевская, 3А\nТел: +7 (495) 123-45-67')" style="background: none; border: none; color: #003f87; text-decoration: underline; cursor: pointer; padding: 0;">
            Выходные данные (Imprint / Impressum)
        </button>
    </footer>
</body>
</html>
