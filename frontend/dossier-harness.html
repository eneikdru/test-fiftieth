<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dossier Search Mock</title>
    <!-- Add Material Symbols Outlined font -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <style>
        .dossier-container { padding: 1.25rem; font-family: sans-serif; }

        .search-section {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.625rem;
        }

        @media (min-width: 768px) {
            .search-section {
                flex-direction: row;
            }
        }

        input, select { padding: 0.5rem; border: 1px solid #ccc; border-radius: 0.25rem; }
        input { flex-grow: 1; }

        button { padding: 0.5rem 1rem; background-color: #007bff; color: white; border: none; border-radius: 0.25rem; cursor: pointer; }
        button:disabled { background-color: #a0c4ff; cursor: not-allowed; }

        .document-list { list-style: none; padding: 0; margin-bottom: 1.25rem; }
        .document-list li { padding: 0.5rem; border-bottom: 1px solid #eee; }

        .report-section { display: flex; align-items: center; justify-content: flex-end; }

        .export-button {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: bold;
        }

        .export-button .icon {
            font-size: 1.2em;
        }

        @media (max-width: 767px) {
            .report-section {
                justify-content: center;
                position: fixed;
                bottom: 1.5rem;
                right: 1.5rem;
                z-index: 50;
            }

            .export-button {
                width: 3.5rem;
                height: 3.5rem;
                border-radius: 50%;
                padding: 0;
                justify-content: center;
                box-shadow: 0 0.25rem 0.375rem rgba(0,0,0,0.3);
            }

            .export-button .icon {
                font-size: 1.5rem;
            }

            .export-button span:not(.icon) {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="dossier-container">
            <div class="search-section">
                <input type="text" id="search-query-input" placeholder="Фамилия сотрудника" />
                <select id="filter-period" aria-label="Период">
                    <option value="all">За все время</option>
                    <option value="last_month">Конкретный месяц</option>
                    <option value="last_3_months">Несколько месяцев (3)</option>
                    <option value="last_year">Полный календарный год</option>
                </select>
                <select id="filter-direction" aria-label="Научное направление">
                    <option value="all">Все направления</option>
                    <option value="virology">Вирусология</option>
                    <option value="bacteriology">Бактериология</option>
                    <option value="epidemiology">Эпиднадзор</option>
                    <option value="vaccinology">Вакцинопрофилактика</option>
                </select>
                <button id="search-button">Поиск</button>
            </div>
            <div id="results-container" style="display: none;">
                <ul class="document-list" id="document-list"></ul>
                <div class="report-section">
                    <button id="generate-report-button" class="export-button">
                        <span class="material-symbols-outlined icon">download</span>
                        <span>Сформировать итоговую справку</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const searchButton = document.getElementById('search-button');
        const searchInput = document.getElementById('search-query-input');
        const filterPeriod = document.getElementById('filter-period');

        const resultsContainer = document.getElementById('results-container');
        const documentList = document.getElementById('document-list');
        const generateReportButton = document.getElementById('generate-report-button');

        searchButton.addEventListener('click', () => {
            if (!searchInput.value.trim()) return;

            const directionText = filterDirection.options[filterDirection.selectedIndex].text;
            const periodText = filterPeriod.options[filterPeriod.selectedIndex].text;

            documentList.innerHTML = `
                <li>Приказ о назначении №42 (${directionText}, ${periodText})</li>
                <li>Выписка из учёного совета от 12.05.2023</li>
                <li>Отчёт о командировке (Самара)</li>

            resultsContainer.style.display = 'block';

</html>
