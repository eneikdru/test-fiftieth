<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consent Banner Harness</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/svelte@3.59.2/compiler.js"></script>
</head>
<body class="bg-white min-h-screen">
  <div id="app"></div>
  <script type="module">
    async function loadComponent() {
      try {
        const response = await fetch('./src/components/ConsentBanner.svelte');
        const source = await response.text();
        const { js } = window.svelte.compile(source, { format: 'esm', name: 'ConsentBanner' });
        let codeWithMjs = js.code.replace(/from "svelte\/internal"/g, `from "https://unpkg.com/svelte@3.59.2/internal/index.mjs"`);
        codeWithMjs = codeWithMjs.replace(/from "svelte"/g, `from "https://unpkg.com/svelte@3.59.2/index.mjs"`);
        const blob = new Blob([codeWithMjs], { type: 'application/javascript' });
        const module = await import(URL.createObjectURL(blob));
        new module.default({ target: document.getElementById('app') });
      } catch (e) { console.error(e); }
    }
    loadComponent();
  </script>
</body>
</html>
