<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>База знаний по эпидемиологии — Каталог документов</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#003f87",
            "on-primary": "#ffffff",
            "background": "#f7f9fb",
            "on-surface": "#191c1e",
            "on-surface-variant": "#424752",
            "outline": "#727784",
            "outline-variant": "#c2c6d4",
            "surface-container-lowest": "#ffffff",
            "surface-container": "#eceef0",
            "surface-variant": "#e0e3e5",
            "error": "#ba1a1a",
            "error-container": "#ffdad6",
            "on-error-container": "#93000a"
          },
          fontFamily: {
            "sans": ["Inter", "sans-serif"],
            "heading": ["Manrope", "sans-serif"]
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #f7f9fb;
    }
  </style>
</head>
<body class="bg-[#f7f9fb] min-h-screen text-[#191c1e] antialiased font-sans">
  <div id="app"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const initialMode = urlParams.get('mode') || 'catalog';

    const defaultSampleDocuments = [
      {
        id: '1',
        title: 'Протокол эпидемиологического расследования вспышки сальмонеллеза',
        author: 'НИИ Эпидемиологии',
        authorOrganization: 'НИИ Эпидемиологии',
        year: 2023,
        publicationYear: 2023,
        docType: 'Протокол расследования',
        fileName: 'salmonella_outbreak.pdf',
        filePath: '/data/docs/2023/salmonella_outbreak.pdf',
        fileSize: '2.4 МБ',
        description: 'Оперативный отчет и результаты бактериологического исследования.'
      },
      {
        id: '2',
        title: 'Отчет эпиднадзора по гриппу и ОРВИ за сезон 2022-2023',
        author: 'Центр мониторинга инфекций',
        authorOrganization: 'Центр мониторинга инфекций',
        year: 2023,
        publicationYear: 2023,
        docType: 'Отчёт эпиднадзора',
        fileName: 'flu_surveillance.pdf',
        filePath: '/data/docs/2023/flu_surveillance.pdf',
        fileSize: '4.1 МБ',
        description: 'Статистика заболеваемости и результаты лабораторного мониторинга.'
      },
      {
        id: '3',
        title: 'Методические рекомендации по профилактике кори',
        author: 'Министерство здравоохранения РФ',
        authorOrganization: 'Министерство здравоохранения РФ',
        year: 2021,
        publicationYear: 2021,
        docType: 'Методическое руководство',
        fileName: 'measles_prevention.docx',
        filePath: '/data/docs/2021/measles_prevention.docx',
        fileSize: '1.8 МБ',
        description: 'Инструкции для медицинского персонала по вакцинопрофилактике.'
      }
    ];

    let state = {
      mode: initialMode, // 'catalog' | 'login' | 'recovery' | 'set_password'
      currentUser: {
        id: 101,
        username: 'admin_user',
        role: 'ADMIN', // 'ADMIN' | 'RESEARCHER'
        full_name: 'Иванов И.И. (Администратор)',
        email: 'ivanov@epidemiology-inst.ru'
      },

      // Auth form state
      loginUsername: '',
      loginPassword: '',
      recoveryIdentity: '',
      recoverySent: false,
      newPassword: '',
      confirmPassword: '',
      fieldErrors: {},

      // Search filter states
      searchQuery: '',
      selectedAuthor: '',
      selectedYear: '',

      // API Data View States: empty, loading, error, present
      documents: [...defaultSampleDocuments],
      isLoading: false,
      searchError: '',
      backendStopped: false, // Simulator flag for testing backend stopped AC

      // Upload modal states
      isUploadModalOpen: false,
      uploadTitle: '',
      uploadAuthor: '',
      uploadYear: '2024',
      uploadDocType: 'Протокол расследования',
      uploadDescription: '',
      uploadFileName: '',
      simulateNetworkError: false,
      isUploading: false,
      uploadError: '',
      uploadSuccess: ''
    };

    async function fetchDocuments() {
      state.isLoading = true;
      state.searchError = '';
      render();

      if (state.backendStopped) {
        setTimeout(() => {
          state.isLoading = false;
          state.documents = [];
          state.searchError = 'Ошибка подключения к серверу (Backend stopped). Каталог недоступен.';
          render();
        }, 150);
        return;
      }

      try {
        const params = new URLSearchParams();
        if (state.searchQuery.trim()) params.append('query', state.searchQuery.trim());
        if (state.selectedAuthor.trim()) params.append('author', state.selectedAuthor.trim());
        if (state.selectedYear.trim()) params.append('year', state.selectedYear.trim());

        const response = await fetch('/api/v1/documents/search?' + params.toString());
        if (!response.ok) {
          throw new Error('Ошибка сервера при поиске.');
        }
        const data = await response.json();
        if (Array.isArray(data)) {
          state.documents = data;
        } else if (data && Array.isArray(data.results)) {
          state.documents = data.results;
        } else {
          state.documents = [];
        }
      } catch (e) {
        // Standalone file:// or backend unavailable local filter
        let filtered = [...state.documents];
        if (filtered.length === 0 && !state.searchQuery.trim() && !state.selectedAuthor.trim() && !state.selectedYear.trim()) {
          filtered = [...defaultSampleDocuments];
        }
        if (state.searchQuery.trim()) {
          const q = state.searchQuery.trim().toLowerCase();
          filtered = filtered.filter(d =>
            (d.title && d.title.toLowerCase().includes(q)) ||
            (d.description && d.description.toLowerCase().includes(q))
          );
        }
        if (state.selectedAuthor.trim()) {
          const a = state.selectedAuthor.trim().toLowerCase();
          filtered = filtered.filter(d =>
            (d.author && d.author.toLowerCase().includes(a)) ||
            (d.authorOrganization && d.authorOrganization.toLowerCase().includes(a)) ||
            (d.author_organization && d.author_organization.toLowerCase().includes(a))
          );
        }
        if (state.selectedYear.trim()) {
          const y = parseInt(state.selectedYear.trim(), 10);
          filtered = filtered.filter(d => d.year === y || d.publicationYear === y || d.publication_year === y);
        }
        state.documents = filtered;
      } finally {
        state.isLoading = false;
        render();
      }
    }

    function render() {
      const app = document.getElementById('app');
      const isAdmin = state.currentUser && state.currentUser.role === 'ADMIN';

      if (state.mode === 'login') {
        app.innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-4">
            <div class="bg-white p-8 rounded-xl border border-[#e0e3e5] shadow-lg max-w-md w-full">
              <h2 class="text-2xl font-bold text-[#003f87] mb-6">Вход в систему</h2>
              <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                <div>
                  <label class="block text-xs font-semibold text-[#191c1e] mb-1">Имя пользователя</label>
                  <input
                    id="username-input"
                    type="text"
                    value="${state.loginUsername}"
                    oninput="state.loginUsername = this.value"
                    required
                    class="w-full h-10 px-3 bg-[#f7f9fb] border border-[#c2c6d4] rounded-md text-sm text-[#191c1e]"
                  />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-[#191c1e] mb-1">Пароль</label>
                  <input
                    id="password-input"
                    type="password"
                    value="${state.loginPassword}"
                    oninput="state.loginPassword = this.value"
                    required
                    class="w-full h-10 px-3 bg-[#f7f9fb] border border-[#c2c6d4] rounded-md text-sm text-[#191c1e]"
                  />
                </div>
                <div class="flex items-center justify-between pt-2">
                  <a id="forgot-password-link" href="#" onclick="event.preventDefault(); state.mode = 'recovery'; state.fieldErrors = {}; render();" class="text-xs text-[#003f87] hover:underline">
                    Забыли пароль?
                  </a>
                </div>
                <button
                  type="submit"
                  class="w-full h-10 bg-[#003f87] text-white font-medium text-sm rounded-md transition-colors"
                >
                  Войти
                </button>
              </form>
            </div>
          </div>
        `;
        return;
      }

      if (state.mode === 'recovery') {
        app.innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-4">
            <div class="bg-white p-8 rounded-xl border border-[#e0e3e5] shadow-lg max-w-md w-full">
              ${!state.recoverySent ? `
                <h2 class="text-2xl font-bold text-[#003f87] mb-6">Забыли пароль?</h2>
                <form onsubmit="handleRecoverySubmit(event)" class="space-y-4">
                  <div>
                    <label class="block text-xs font-semibold text-[#191c1e] mb-1">Электронная почта / Логин *</label>
                    <input
                      id="recovery-identity-input"
                      type="text"
                      value="${state.recoveryIdentity}"
                      oninput="state.recoveryIdentity = this.value"
                      required
                      aria-required="true"
                      aria-invalid="${state.fieldErrors.recoveryIdentity ? 'true' : 'false'}"
                      class="w-full h-10 px-3 bg-[#f7f9fb] border ${state.fieldErrors.recoveryIdentity ? 'border-[#ba1a1a]' : 'border-[#c2c6d4]'} rounded-md text-sm text-[#191c1e]"
                    />
                    ${state.fieldErrors.recoveryIdentity ? `
                      <p id="recovery-identity-error" class="text-xs text-[#ba1a1a] mt-1 font-medium">⚠ ${state.fieldErrors.recoveryIdentity}</p>
                    ` : ''}
                  </div>
                  <button
                    type="submit"
                    id="recovery-submit-btn"
                    class="w-full h-10 bg-[#003f87] text-white font-medium text-sm rounded-md transition-colors"
                  >
                    Восстановить
                  </button>
                  <div class="pt-2 text-center">
                    <button
                      type="button"
                      onclick="state.mode = 'set_password'; state.fieldErrors = {}; render();"
                      class="text-xs text-[#003f87] hover:underline"
                    >
                      Есть токен восстановления? Установить новый пароль
                    </button>
                  </div>
                </form>
              ` : `
                <main>
                  <h3 class="text-xl font-bold text-[#003f87] mb-4">Инструкции отправлены</h3>
                  <p class="text-sm text-[#424752] mb-6">Инструкции по восстановлению пароля отправлены на ваш электронный адрес.</p>
                </main>
                <div class="flex flex-col gap-2">
                  <button
                    type="button"
                    onclick="state.mode = 'set_password'; state.fieldErrors = {}; render();"
                    class="w-full h-10 bg-[#003f87] text-white font-medium text-sm rounded-md transition-colors"
                  >
                    Перейти к установке нового пароля
                  </button>
                  <button
                    type="button"
                    onclick="state.mode = 'login'; state.recoverySent = false; state.fieldErrors = {}; render();"
                    class="w-full h-10 border border-[#c2c6d4] text-[#191c1e] font-medium text-sm rounded-md hover:bg-[#eceef0] transition-colors"
                  >
                    Вернуться ко входу
                  </button>
                </div>
              `}
            </div>
          </div>
        `;
        return;
      }

      if (state.mode === 'set_password') {
        app.innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-4">
            <div class="bg-white p-8 rounded-xl border border-[#e0e3e5] shadow-lg max-w-md w-full">
              <h2 class="text-2xl font-bold text-[#003f87] mb-6">Установка нового пароля</h2>

              ${state.fieldErrors.summary ? `
                <div id="set-password-error-summary" role="alert" class="mb-4 p-3 bg-[#ffdad6] text-[#93000a] text-xs font-semibold rounded-md border border-[#ba1a1a]/30">
                  ⚠ ${state.fieldErrors.summary}
                </div>
              ` : ''}

              <form onsubmit="handleSetPasswordSubmit(event)" class="space-y-4" novalidate>
                <div>
                  <label for="new-password-input" class="block text-xs font-semibold text-[#191c1e] mb-1">
                    Новый пароль *
                  </label>
                  <input
                    id="new-password-input"
                    type="password"
                    value="${state.newPassword}"
                    oninput="state.newPassword = this.value"
                    required
                    aria-required="true"
                    aria-invalid="${state.fieldErrors.newPassword ? 'true' : 'false'}"
                    aria-describedby="${state.fieldErrors.newPassword ? 'new-password-error' : ''}"
                    class="w-full h-10 px-3 bg-[#f7f9fb] border ${state.fieldErrors.newPassword ? 'border-[#ba1a1a]' : 'border-[#c2c6d4]'} rounded-md text-sm text-[#191c1e]"
                  />
                  ${state.fieldErrors.newPassword ? `
                    <p id="new-password-error" class="text-xs text-[#ba1a1a] mt-1 font-medium">⚠ ${state.fieldErrors.newPassword}</p>
                  ` : ''}
                </div>

                <div>
                  <label for="confirm-password-input" class="block text-xs font-semibold text-[#191c1e] mb-1">
                    Подтвердите новый пароль *
                  </label>
                  <input
                    id="confirm-password-input"
                    type="password"
                    value="${state.confirmPassword}"
                    oninput="state.confirmPassword = this.value"
                    required
                    aria-required="true"
                    aria-invalid="${state.fieldErrors.confirmPassword ? 'true' : 'false'}"
                    aria-describedby="${state.fieldErrors.confirmPassword ? 'confirm-password-error' : ''}"
                    class="w-full h-10 px-3 bg-[#f7f9fb] border ${state.fieldErrors.confirmPassword ? 'border-[#ba1a1a]' : 'border-[#c2c6d4]'} rounded-md text-sm text-[#191c1e]"
                  />
                  ${state.fieldErrors.confirmPassword ? `
                    <p id="confirm-password-error" class="text-xs text-[#ba1a1a] mt-1 font-medium">⚠ ${state.fieldErrors.confirmPassword}</p>
                  ` : ''}
                </div>

                <button
                  type="submit"
                  id="set-password-submit-btn"
                  class="w-full h-10 bg-[#003f87] text-white font-medium text-sm rounded-md transition-colors"
                >
                  Сохранить новый пароль
                </button>

                <div class="pt-2 text-center">
                  <button
                    type="button"
                    onclick="state.mode = 'login'; state.fieldErrors = {}; render();"
                    class="text-xs text-[#003f87] hover:underline"
                  >
                    Вернуться ко входу
                  </button>
                </div>
              </form>
            </div>
          </div>
        `;
        return;
      }

      if (state.mode === 'catalog') {
        app.innerHTML = `
          <main class="catalog-container max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 py-6 font-sans text-[#191c1e] bg-[#f7f9fb] min-h-screen">
            <!-- Top Navigation & Header -->
            <header class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-[#c2c6d4] pb-5">
              <div>
                <div class="flex items-center gap-2 mb-1">
                  <span class="text-xs font-semibold uppercase text-[#424752] tracking-wider">Каталог материалов</span>
                </div>
                <h1 class="text-2xl md:text-3xl font-bold text-[#003f87]">
                  База знаний по эпидемиологии
                </h1>
                <p class="text-sm text-[#424752] mt-1">
                  Поиск и управление эпидемиологическими протоколами, отчётами и руководствами
                </p>
              </div>

              <!-- Admin / User Status Bar -->
              <div class="flex items-center gap-3 bg-white p-3 rounded-lg border border-[#e0e3e5] shadow-sm self-start md:self-auto">
                <div class="w-9 h-9 rounded-full bg-[#003f87] text-white flex items-center justify-center font-bold text-sm">
                  ${(state.currentUser?.full_name || state.currentUser?.username || 'С')[0]}
                </div>
                <div>
                  <div class="text-xs font-medium text-[#191c1e]">${state.currentUser?.full_name || state.currentUser?.username}</div>
                  <div class="text-[11px] text-[#424752]">
                    Роль: <span class="font-semibold text-[#003f87]">${isAdmin ? 'Администратор' : 'RESEARCHER'}</span>
                  </div>
                </div>

                <div class="ml-2 flex items-center gap-2">
                  ${isAdmin ? `
                    <button
                      id="open-upload-modal-btn"
                      type="button"
                      onclick="openUploadModal()"
                      class="px-3 py-2 bg-[#003f87] hover:bg-[#002b5e] focus:ring-2 focus:ring-[#003f87]/50 focus:outline-none text-white rounded-md text-xs font-medium transition-colors flex items-center gap-1.5 shadow-sm"
                    >
                      <span>+ Загрузить документ</span>
                    </button>
                  ` : ''}
                  <button
                    id="switch-role-btn"
                    type="button"
                    onclick="toggleRole()"
                    class="px-2.5 py-1.5 border border-[#c2c6d4] text-[#424752] hover:bg-[#eceef0] focus:ring-2 focus:ring-[#003f87]/50 focus:outline-none rounded-md text-[11px] font-medium"
                  >
                    ${isAdmin ? 'Сменить на Сотрудник' : 'Сменить на Админ'}
                  </button>
                  <button id="logout-btn" type="button" onclick="handleLogout()" class="px-2.5 py-1.5 border border-[#c2c6d4] text-[#424752] hover:bg-[#eceef0] focus:ring-2 focus:ring-[#003f87]/50 focus:outline-none rounded-md text-[11px] font-medium ml-2">
                    Выйти из системы
                  </button>
                </div>
              </div>
            </header>

            ${!isAdmin ? `
              <div id="employee-message" class="mb-6 p-4 rounded-xl bg-[#d9e3f1] text-[#001a40] text-xs font-medium border border-[#003f87]/30 flex items-center justify-between">
                <span>Просмотр и поиск доступен всем сотрудникам, но загрузка и удаление ограничены администратором института.</span>
              </div>
            ` : ''}

            <!-- Search & Filter Controls -->
            <section class="bg-white p-5 rounded-xl border border-[#e0e3e5] shadow-sm mb-8">
              <h2 class="text-lg font-bold text-[#191c1e] mb-4 flex items-center gap-2">
                <span>🔍 Поиск документов</span>
              </h2>

              <form onsubmit="handleSearchSubmit(event)" class="grid grid-cols-1 md:grid-cols-12 gap-4">
                <!-- Query Input -->
                <div class="md:col-span-5">
                  <label for="search-query-input" class="block text-xs font-semibold text-[#191c1e] mb-1">
                    Название или ключевое слово
                  </label>
                  <input
                    id="search-query-input"
                    type="text"
                    value="${state.searchQuery}"
                    oninput="state.searchQuery = this.value"
                    placeholder="Например: грипп, протокол, генотипирование..."
                    class="w-full h-11 px-3.5 bg-[#f7f9fb] border border-[#c2c6d4] rounded-lg text-sm text-[#191c1e] focus:outline-none focus:ring-2 focus:ring-[#003f87]/50 focus:border-[#003f87]"
                  />
                </div>

                <!-- Author / Organization Filter -->
                <div class="md:col-span-3">
                  <label for="search-author-input" class="block text-xs font-semibold text-[#191c1e] mb-1">
                    Автор / Организация
                  </label>
                  <input
                    id="search-author-input"
                    type="text"
                    value="${state.selectedAuthor}"
                    oninput="state.selectedAuthor = this.value"
                    placeholder="НИИ Эпидемиологии"
                    class="w-full h-11 px-3.5 bg-[#f7f9fb] border border-[#c2c6d4] rounded-lg text-sm text-[#191c1e] focus:outline-none focus:ring-2 focus:ring-[#003f87]/50 focus:border-[#003f87]"
                  />
                </div>

                <!-- Year Filter -->
                <div class="md:col-span-2">
                  <label for="search-year-input" class="block text-xs font-semibold text-[#191c1e] mb-1">
                    Год публикации
                  </label>
                  <select
                    id="search-year-input"
                    onchange="state.selectedYear = this.value"
                    class="w-full h-11 px-3 bg-[#f7f9fb] border border-[#c2c6d4] rounded-lg text-sm text-[#191c1e] focus:outline-none focus:ring-2 focus:ring-[#003f87]/50 focus:border-[#003f87]"
                  >
                    <option value="" ${state.selectedYear === '' ? 'selected' : ''}>Все года</option>
                    <option value="2024" ${state.selectedYear === '2024' ? 'selected' : ''}>2024</option>
                    <option value="2023" ${state.selectedYear === '2023' ? 'selected' : ''}>2023</option>
                    <option value="2022" ${state.selectedYear === '2022' ? 'selected' : ''}>2022</option>
                    <option value="2021" ${state.selectedYear === '2021' ? 'selected' : ''}>2021</option>
                    <option value="2020" ${state.selectedYear === '2020' ? 'selected' : ''}>2020</option>
                  </select>
                </div>

                <!-- Action Buttons -->
                <div class="md:col-span-2 flex items-end gap-2">
                  <button
                    type="submit"
                    id="search-submit-btn"
                    class="flex-1 h-11 bg-[#003f87] hover:bg-[#002b5e] focus:ring-2 focus:ring-[#003f87]/50 focus:outline-none text-white font-medium text-sm rounded-lg transition-colors flex items-center justify-center shadow-sm"
                  >
                    Найти
                  </button>
                  ${(state.searchQuery || state.selectedAuthor || state.selectedYear) ? `
                    <button
                      type="button"
                      id="search-reset-btn"
                      onclick="handleResetSearch()"
                      class="h-11 px-3 border border-[#c2c6d4] text-[#424752] hover:bg-[#eceef0] focus:ring-2 focus:ring-[#003f87]/50 focus:outline-none text-xs font-medium rounded-lg transition-colors"
                      title="Сбросить фильтры"
                    >
                      Сброс
                    </button>
                  ` : ''}
                </div>
              </form>

              <!-- Harness Testing Toggle for Backend Stopped Simulation -->
              <div class="mt-3 pt-3 border-t border-[#f2f4f6]">
                <label class="flex items-center gap-2 text-xs text-[#424752] cursor-pointer">
                  <input
                    id="simulate-backend-stopped-checkbox"
                    type="checkbox"
                    ${state.backendStopped ? 'checked' : ''}
                    onchange="state.backendStopped = this.checked; fetchDocuments();"
                    class="rounded border-[#c2c6d4] text-[#003f87] focus:ring-[#003f87]"
                  />
                  <span>Симулировать остановленный бэкенд (Backend Stopped Error State)</span>
                </label>
              </div>
            </section>

            <!-- Document List Section -->
            <section>
              <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold text-[#191c1e]">
                  Результаты поиска <span id="catalog-count" class="text-sm font-normal text-[#424752]">(${state.documents.length})</span>
                </h2>
              </div>

              <!-- State 1: Loading State -->
              ${state.isLoading ? `
                <div id="catalog-loading-state" role="status" class="bg-white border border-[#e0e3e5] rounded-xl p-8 text-center space-y-3 shadow-sm my-6">
                  <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-[#003f87] border-t-transparent"></div>
                  <p class="text-sm text-[#424752] font-medium">Загрузка данных каталога...</p>
                </div>
              ` : state.searchError ? `
                <!-- State 2: Error State (Backend Stopped) -->
                <div id="catalog-error-state" role="alert" class="bg-[#ffdad6] border border-[#ba1a1a]/30 rounded-xl p-8 text-center space-y-3 shadow-sm my-6">
                  <div class="w-12 h-12 bg-[#ffb4ab] rounded-full flex items-center justify-center mx-auto text-[#93000a] text-xl font-bold">
                    ⚠️
                  </div>
                  <h3 class="text-lg font-bold text-[#93000a]">Ошибка загрузки данных</h3>
                  <p class="text-sm text-[#93000a]/80 max-w-md mx-auto">
                    ${state.searchError}
                  </p>
                  <button
                    type="button"
                    onclick="fetchDocuments()"
                    class="px-4 py-2 bg-[#ba1a1a] hover:bg-[#93000a] focus:ring-2 focus:ring-[#ba1a1a]/50 focus:outline-none text-white rounded-lg text-xs font-semibold transition-colors mt-2"
                  >
                    Повторить попытку
                  </button>
                </div>
              ` : state.documents.length === 0 ? `
                <!-- State 3: Explicit Empty State Message AC Required -->
                <div
                  id="empty-catalog-message"
                  role="status"
                  class="bg-white border border-[#e0e3e5] rounded-xl p-8 text-center space-y-3 shadow-sm my-6"
                >
                  <div class="w-12 h-12 bg-[#eceef0] rounded-full flex items-center justify-center mx-auto text-[#727784] text-xl font-bold">
                    📄
                  </div>
                  <h3 class="text-lg font-bold text-[#191c1e]">нет материалов</h3>
                  <p class="text-sm text-[#424752] max-w-md mx-auto">
                    По вашему запросу не найдено ни одного документа. Проверьте правильность фильтров или сбросьте параметры поиска.
                  </p>
                  <button
                    type="button"
                    onclick="handleResetSearch()"
                    class="px-4 py-2 border border-[#003f87] text-[#003f87] hover:bg-[#003f87]/5 focus:ring-2 focus:ring-[#003f87]/50 focus:outline-none rounded-lg text-xs font-semibold transition-colors mt-2"
                  >
                    Показать все материалы
                  </button>
                </div>
              ` : `
                <!-- State 4: Present State -->
                <div id="document-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                  ${state.documents.map(doc => `
                    <article data-doc-id="${doc.id}" class="document-card bg-white border border-[#e0e3e5] rounded-xl p-5 shadow-sm hover:shadow-md transition-shadow flex flex-col justify-between">
                      <div>
                        <div class="flex items-start justify-between gap-2 mb-2">
                          <span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-[#d9e3f1] text-[#131c26]">
                            ${doc.docType || doc.doc_type || 'Документ'}
                          </span>
                          <span class="text-xs text-[#727784] font-medium">${doc.year || doc.publicationYear || doc.publication_year || '—'} г.</span>
                        </div>

                        <h3 class="text-base font-bold text-[#191c1e] mb-2 line-clamp-2 leading-snug doc-title">
                          ${doc.title}
                        </h3>

                        <p class="text-xs text-[#424752] mb-3 line-clamp-3 leading-relaxed">
                          ${doc.description || 'Описание отсутствует'}
                        </p>

                        <div class="text-xs text-[#727784] mb-4 space-y-1 border-t border-[#f2f4f6] pt-3">
                          <div class="flex items-center justify-between">
                            <span>Организация:</span>
                            <span class="font-medium text-[#191c1e]">${doc.author || doc.authorOrganization || doc.author_organization || '—'}</span>
                          </div>
                          <div class="flex items-center justify-between">
                            <span>Файл:</span>
                            <span class="font-medium text-[#191c1e]">${doc.fileName || doc.filePath || doc.file_path || 'document.pdf'} ${doc.fileSize ? `(${doc.fileSize})` : ''}</span>
                          </div>
                        </div>
                      </div>

                      <div class="flex items-center justify-between gap-2 pt-3 border-t border-[#e0e3e5]">
                        <button
                          type="button"
                          id="download-btn-${doc.id}"
                          onclick="handleDownloadDocument('${doc.id}')"
                          class="download-btn flex-1 py-2 px-3 bg-[#003f87] hover:bg-[#002b5e] focus:ring-2 focus:ring-[#003f87]/50 focus:outline-none text-white text-xs font-medium rounded-md transition-colors flex items-center justify-center gap-1 shadow-sm"
                        >
                          <span>Скачать</span>
                        </button>

                        ${isAdmin ? `
                          <button
                            type="button"
                            id="delete-btn-${doc.id}"
                            onclick="handleDeleteDocument('${doc.id}')"
                            class="delete-btn py-2 px-3 border border-[#ba1a1a] text-[#ba1a1a] hover:bg-[#ffdad6] focus:ring-2 focus:ring-[#ba1a1a]/50 focus:outline-none text-xs font-medium rounded-md transition-colors"
                            title="Удалить документ"
                          >
                            Удалить
                          </button>
                        ` : ''}
                      </div>
                    </article>
                  `).join('')}
                </div>
              `}
            </section>

            <!-- Admin Upload Modal -->
            ${state.isUploadModalOpen ? `
              <div id="upload-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
                <div class="bg-white rounded-xl border border-[#e0e3e5] max-w-lg w-full p-6 shadow-xl my-8">
                  <div class="flex items-center justify-between pb-3 border-b border-[#e0e3e5] mb-4">
                    <h3 class="text-lg font-bold text-[#191c1e]">Загрузка документа в каталог</h3>
                    <button
                      type="button"
                      onclick="closeUploadModal()"
                      class="text-[#727784] hover:text-[#191c1e] text-xl font-bold p-1 rounded-full focus:ring-2 focus:ring-[#003f87]/50 focus:outline-none"
                    >
                      ✕
                    </button>
                  </div>

                  ${state.uploadError ? `
                    <div id="upload-error-alert" role="alert" class="mb-4 p-3.5 rounded-lg bg-[#ffdad6] text-[#93000a] text-xs font-medium border border-[#ba1a1a]/30">
                      ⚠ ${state.uploadError}
                    </div>
                  ` : ''}

                  ${state.uploadSuccess ? `
                    <div id="upload-success-alert" role="status" class="mb-4 p-3.5 rounded-lg bg-[#d9e3f1] text-[#001a40] text-xs font-medium border border-[#003f87]/30">
                      ✓ ${state.uploadSuccess}
                    </div>
                  ` : ''}

                  <form id="upload-document-form" onsubmit="handleUploadSubmit(event)" class="space-y-4" novalidate>
                    <div>
                      <label for="upload-title-input" class="block text-xs font-semibold text-[#191c1e] mb-1">
                        Название документа *
                      </label>
                      <input
                        id="upload-title-input"
                        type="text"
                        value="${state.uploadTitle}"
                        oninput="state.uploadTitle = this.value"
                        placeholder="Введите полное название"
                        required
                        class="w-full h-10 px-3 bg-[#f7f9fb] border border-[#c2c6d4] rounded-md text-sm text-[#191c1e] focus:outline-none focus:ring-2 focus:ring-[#003f87]/50 focus:border-[#003f87]"
                      />
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                      <div>
                        <label for="upload-author-input" class="block text-xs font-semibold text-[#191c1e] mb-1">
                          Автор / Организация *
                        </label>
                        <input
                          id="upload-author-input"
                          type="text"
                          value="${state.uploadAuthor}"
                          oninput="state.uploadAuthor = this.value"
                          placeholder="НИИ Эпидемиологии"
                          required
                          class="w-full h-10 px-3 bg-[#f7f9fb] border border-[#c2c6d4] rounded-md text-sm text-[#191c1e] focus:outline-none focus:ring-2 focus:ring-[#003f87]/50 focus:border-[#003f87]"
                        />
                      </div>

                      <div>
                        <label for="upload-year-input" class="block text-xs font-semibold text-[#191c1e] mb-1">
                          Год публикации *
                        </label>
                        <input
                          id="upload-year-input"
                          type="number"
                          value="${state.uploadYear}"
                          oninput="state.uploadYear = this.value"
                          min="1990"
                          max="2030"
                          required
                          class="w-full h-10 px-3 bg-[#f7f9fb] border border-[#c2c6d4] rounded-md text-sm text-[#191c1e] focus:outline-none focus:ring-2 focus:ring-[#003f87]/50 focus:border-[#003f87]"
                        />
                      </div>
                    </div>

                    <div>
                      <label for="upload-doctype-select" class="block text-xs font-semibold text-[#191c1e] mb-1">
                        Тип документа
                      </label>
                      <select
                        id="upload-doctype-select"
                        onchange="state.uploadDocType = this.value"
                        class="w-full h-10 px-3 bg-[#f7f9fb] border border-[#c2c6d4] rounded-md text-sm text-[#191c1e] focus:outline-none focus:ring-2 focus:ring-[#003f87]/50 focus:border-[#003f87]"
                      >
                        <option value="Протокол расследования" ${state.uploadDocType === 'Протокол расследования' ? 'selected' : ''}>Протокол расследования</option>
                        <option value="Отчёт эпиднадзора" ${state.uploadDocType === 'Отчёт эпиднадзора' ? 'selected' : ''}>Отчёт эпиднадзора</option>
                        <option value="Набор данных" ${state.uploadDocType === 'Набор данных' ? 'selected' : ''}>Набор данных</option>
                        <option value="Методическое руководство" ${state.uploadDocType === 'Методическое руководство' ? 'selected' : ''}>Методическое руководство</option>
                      </select>
                    </div>

                    <div>
                      <label for="upload-description-input" class="block text-xs font-semibold text-[#191c1e] mb-1">
                        Описание
                      </label>
                      <textarea
                        id="upload-description-input"
                        oninput="state.uploadDescription = this.value"
                        rows="3"
                        placeholder="Краткая аннотация или описание документа"
                        class="w-full p-3 bg-[#f7f9fb] border border-[#c2c6d4] rounded-md text-sm text-[#191c1e] focus:outline-none focus:ring-2 focus:ring-[#003f87]/50 focus:border-[#003f87]"
                      >${state.uploadDescription}</textarea>
                    </div>

                    <div>
                      <label for="upload-file-input" class="block text-xs font-semibold text-[#191c1e] mb-1">
                        Файл (PDF, DOCX)
                      </label>
                      <input
                        id="upload-file-input"
                        type="file"
                        onchange="handleFileSelect(event)"
                        accept=".pdf,.doc,.docx,.xlsx"
                        class="w-full text-xs text-[#424752] file:mr-3 file:py-2 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-[#d9e3f1] file:text-[#003f87] hover:file:bg-[#003f87]/10 focus:ring-2 focus:ring-[#003f87]/50 focus:outline-none"
                      />
                    </div>

                    <!-- Switch for simulating network error -->
                    <div class="pt-2 border-t border-[#f2f4f6]">
                      <label class="flex items-center gap-2 text-xs text-[#424752] cursor-pointer">
                        <input
                          id="simulate-network-error-checkbox"
                          type="checkbox"
                          ${state.simulateNetworkError ? 'checked' : ''}
                          onchange="state.simulateNetworkError = this.checked"
                          class="rounded border-[#c2c6d4] text-[#003f87] focus:ring-[#003f87]"
                        />
                        <span>Симулировать сбой сети при отправке</span>
                      </label>
                    </div>

                    <div class="flex items-center justify-end gap-3 pt-4 border-t border-[#e0e3e5]">
                      <button
                        type="button"
                        onclick="closeUploadModal()"
                        class="px-4 py-2 border border-[#c2c6d4] text-[#424752] hover:bg-[#eceef0] focus:ring-2 focus:ring-[#003f87]/50 focus:outline-none text-xs font-medium rounded-md transition-colors"
                      >
                        Отмена
                      </button>
                      <button
                        type="submit"
                        id="upload-submit-btn"
                        ${state.isUploading ? 'disabled' : ''}
                        class="px-4 py-2 bg-[#003f87] hover:bg-[#002b5e] focus:ring-2 focus:ring-[#003f87]/50 focus:outline-none text-white text-xs font-medium rounded-md transition-colors disabled:opacity-60 shadow-sm"
                      >
                        ${state.isUploading ? 'Загрузка...' : 'Сохранить и загрузить'}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            ` : ''}

            <!-- Footer -->
            <footer class="w-full py-6 mt-12 text-center text-xs text-[#727784] border-t border-[#e0e3e5] flex flex-col sm:flex-row items-center justify-between gap-2">
              <p>Российский научно-исследовательский институт эпидемиологии</p>
              <div>
                <button
                  type="button"
                  id="imprint-link-harness"
                  onclick="alert('Выходные данные (Imprint / Impressum):\nФБУН «НИИ Эпидемиологии»\nг. Москва, ул. Новогиреевская, 3А\nТел: +7 (495) 123-45-67\nEmail: info@epidemiology-inst.ru')"
                  class="text-[#003f87] hover:underline focus:outline-none focus:ring-2 focus:ring-[#003f87]/50 rounded px-1 font-semibold"
                >
                  Выходные данные (Imprint / Impressum)
                </button>
              </div>
            </footer>
          </main>
        `;
      }
    }

    function handleLoginSubmit(event) {
      if (event) event.preventDefault();
      if (state.loginUsername === 'employee_user') {
        state.currentUser.role = 'RESEARCHER';
        state.currentUser.full_name = 'Петров П.П. (Сотрудник)';
      } else {
        state.currentUser.role = 'ADMIN';
        state.currentUser.full_name = 'Иванов И.И. (Администратор)';
      }
      state.mode = 'catalog';
      fetchDocuments();
    }

    function handleLogout() {
      state.mode = "login";
      state.loginUsername = "";
      state.loginPassword = "";
      state.currentUser = { id: null, username: "", role: "", full_name: "", email: "" };
      render();
    }

    function handleRecoverySubmit(event) {
      if (event) event.preventDefault();
      state.fieldErrors = {};

      if (!state.recoveryIdentity.trim()) {
        state.fieldErrors.recoveryIdentity = 'Пожалуйста, укажите ваш email или имя пользователя.';
        render();
        return;
      }

      state.recoverySent = true;
      render();
    }

    function handleSetPasswordSubmit(event) {
      if (event) event.preventDefault();
      state.fieldErrors = {};

      if (!state.newPassword) {
        state.fieldErrors.newPassword = 'Введите новый пароль.';
      } else if (state.newPassword.length < 8) {
        state.fieldErrors.newPassword = 'Пароль должен содержать не менее 8 символов.';
      }

      if (!state.confirmPassword) {
        state.fieldErrors.confirmPassword = 'Подтвердите новый пароль.';
      } else if (state.newPassword && state.confirmPassword && state.newPassword !== state.confirmPassword) {
        state.fieldErrors.confirmPassword = 'Пароли не совпадают.';
      }

      if (Object.keys(state.fieldErrors).length > 0) {
        state.fieldErrors.summary = 'Пожалуйста, исправьте ошибки в форме установки нового пароля.';
        render();
        return;
      }

      state.mode = 'login';
      state.loginUsername = state.recoveryIdentity || 'user@epidemiology-inst.ru';
      state.loginPassword = state.newPassword;
      state.newPassword = '';
      state.confirmPassword = '';
      render();
    }

    function handleSearchSubmit(event) {
      if (event) event.preventDefault();
      fetchDocuments();
    }

    function handleResetSearch() {
      state.searchQuery = '';
      state.selectedAuthor = '';
      state.selectedYear = '';
      fetchDocuments();
    }

    function openUploadModal() {
      state.uploadError = '';
      state.uploadSuccess = '';
      state.isUploadModalOpen = true;
      render();
    }

    function closeUploadModal() {
      state.isUploadModalOpen = false;
      render();
    }

    function handleFileSelect(event) {
      const files = event.target.files;
      if (files && files.length > 0) {
        state.uploadFileName = files[0].name;
      }
    }

    function handleUploadSubmit(event) {
      if (event) event.preventDefault();
      state.uploadError = '';
      state.uploadSuccess = '';

      if (!state.uploadTitle.trim() || !state.uploadAuthor.trim() || !state.uploadYear) {
        state.uploadError = 'Заполните все обязательные поля формы.';
        render();
        return;
      }

      state.isUploading = true;
      render();

      setTimeout(() => {
        if (state.simulateNetworkError) {
          // KEY AC: On network failure, error is shown, but state metadata remains INTACT in the form!
          state.uploadError = 'Ошибка сети при загрузке документа. Попробуйте еще раз.';
          state.isUploading = false;
          render();
          return;
        }

        const titleSlug = state.uploadTitle.trim().toLowerCase().replace(/\s+/g, '-');
        const newDoc = {
          id: `doc-${titleSlug}-${state.uploadYear}`,
          title: state.uploadTitle.trim(),
          author: state.uploadAuthor.trim(),
          authorOrganization: state.uploadAuthor.trim(),
          year: parseInt(state.uploadYear, 10),
          publicationYear: parseInt(state.uploadYear, 10),
          docType: state.uploadDocType,
          fileName: state.uploadFileName || 'document.pdf',
          fileSize: '1.2 МБ',
          description: state.uploadDescription.trim() || 'Загруженный документ'
        };

        state.documents.unshift(newDoc);
        defaultSampleDocuments.unshift(newDoc);
        state.uploadSuccess = 'Документ успешно загружен в каталог.';

        // Reset metadata on success only
        state.uploadTitle = '';
        state.uploadAuthor = '';
        state.uploadYear = '2024';
        state.uploadDocType = 'Протокол расследования';
        state.uploadDescription = '';
        state.uploadFileName = '';
        state.isUploading = false;
        state.isUploadModalOpen = false;
        render();
      }, 300);
    }

    function handleDownloadDocument(id) {
      const doc = state.documents.find(d => String(d.id) === String(id)) || defaultSampleDocuments.find(d => String(d.id) === String(id));
      const downloadUrl = `/api/v1/documents/${id}/download`;
      const fileName = doc ? (doc.fileName || doc.filePath?.substring(doc.filePath.lastIndexOf('/') + 1) || 'document.pdf') : `document_${id}.pdf`;

      // Trigger file download via anchor element
      const a = document.createElement('a');
      a.href = downloadUrl;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function handleDeleteDocument(id) {
      state.documents = state.documents.filter(doc => String(doc.id) !== String(id));
      const idx = defaultSampleDocuments.findIndex(doc => String(doc.id) === String(id));
      if (idx !== -1) {
        defaultSampleDocuments.splice(idx, 1);
      }
      render();
    }

    function toggleRole() {
      if (state.currentUser.role === 'ADMIN') {
        state.currentUser.role = 'RESEARCHER';
        state.currentUser.full_name = 'Петров П.П. (Сотрудник)';
      } else {
        state.currentUser.role = 'ADMIN';
        state.currentUser.full_name = 'Иванов И.И. (Администратор)';
      }
      render();
    }

    // Initial fetch and render
    if (state.mode === 'catalog') {
      fetchDocuments();
    } else {
      render();
    }
  </script>
</body>
</html>
