<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>База знаний по эпидемиологии — Каталог документов</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#003f87",
            "on-primary": "#ffffff",
            "background": "#f7f9fb",
            "on-surface": "#191c1e",
            "on-surface-variant": "#424752",
            "outline": "#727784",
            "outline-variant": "#c2c6d4",
            "surface-container-lowest": "#ffffff",
            "surface-container": "#eceef0",
            "surface-variant": "#e0e3e5",
            "error": "#ba1a1a",
            "error-container": "#ffdad6",
            "on-error-container": "#93000a"
          },
          fontFamily: {
            "sans": ["Inter", "sans-serif"],
            "heading": ["Manrope", "sans-serif"]
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #f7f9fb;
    }
  </style>
</head>
<body class="bg-[#f7f9fb] min-h-screen text-[#191c1e] antialiased font-sans">
  <div id="app"></div>

  <script>
    // State matching CatalogSearch component
    let state = {
      mode: 'catalog',
      currentUser: {
        id: 101,
        username: 'admin_user',
        role: 'ADMIN', // 'ADMIN' | 'RESEARCHER'
        full_name: 'Иванов И.И. (Администратор)',
        email: 'ivanov@epidemiology-inst.ru'
      },

      // Catalog search states
      searchQuery: '',
      selectedAuthor: '',
      selectedYear: '',

      // Document catalog data initialized to empty (or dynamic fetched from server)
      documents: [],
      isLoading: false,
      fetchError: '',

      // Upload modal states
      isUploadModalOpen: false,
      uploadTitle: '',
      uploadAuthor: '',
      uploadYear: '2024',
      uploadDocType: 'Протокол расследования',
      uploadDescription: '',
      uploadFileName: '',
      simulateNetworkError: false,
      isUploading: false,
      uploadError: '',
      uploadSuccess: ''
    };

    function getFilteredDocuments() {
      return state.documents.filter(doc => {
        const q = state.searchQuery.trim().toLowerCase();
        const matchesQuery = !q ||
          doc.title.toLowerCase().includes(q) ||
          doc.description.toLowerCase().includes(q);

        const a = state.selectedAuthor.trim().toLowerCase();
        const matchesAuthor = !a ||
          doc.author.toLowerCase().includes(a);

        const y = state.selectedYear.toString().trim();
        const matchesYear = !y ||
          doc.year.toString() === y;

        return matchesQuery && matchesAuthor && matchesYear;
      });
    }

    function render() {
      const app = document.getElementById('app');
      const isAdmin = state.currentUser && state.currentUser.role === 'ADMIN';

      if (state.mode === 'catalog') {
        const filteredDocs = getFilteredDocuments();

        app.innerHTML = `
          <div class="catalog-container max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 py-6 font-sans text-[#191c1e] bg-[#f7f9fb] min-h-screen">
            <!-- Top Navigation & Header -->
            <header class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-[#c2c6d4] pb-5">
              <div>
                <div class="flex items-center gap-2 mb-1">
                  <span class="text-xs font-semibold uppercase text-[#424752] tracking-wider">Каталог материалов</span>
                </div>
                <h1 class="text-2xl md:text-3xl font-bold text-[#003f87]">
                  База знаний по эпидемиологии
                </h1>
                <p class="text-sm text-[#424752] mt-1">
                  Поиск и управление эпидемиологическими протоколами, отчётами и руководствами
                </p>
              </div>

              <!-- Admin / User Status Bar -->
              <div class="flex items-center gap-3 bg-white p-3 rounded-lg border border-[#e0e3e5] shadow-sm self-start md:self-auto">
                <div class="w-9 h-9 rounded-full bg-[#003f87] text-white flex items-center justify-center font-bold text-sm">
                  ${(state.currentUser?.full_name || state.currentUser?.username || 'С')[0]}
                </div>
                <div>
                  <div class="text-xs font-medium text-[#191c1e]">${state.currentUser?.full_name || state.currentUser?.username}</div>
                  <div class="text-[11px] text-[#424752]">
                    Роль: <span class="font-semibold text-[#003f87]">${isAdmin ? 'Администратор' : 'Сотрудник'}</span>
                  </div>
                </div>

                <div class="ml-2 flex items-center gap-2">
                  ${isAdmin ? `
                    <button
                      id="open-upload-modal-btn"
                      type="button"
                      onclick="openUploadModal()"
                      class="px-3 py-2 bg-[#003f87] hover:bg-[#002b5e] text-white rounded-md text-xs font-medium transition-colors flex items-center gap-1.5 shadow-sm focus:outline-none focus:ring-2 focus:ring-[#003f87]"
                    >
                      <span>+ Загрузить документ</span>
                    </button>
                  ` : ''}
                  <button
                    id="switch-role-btn"
                    type="button"
                    onclick="toggleRole()"
                    class="px-2.5 py-1.5 border border-[#c2c6d4] text-[#424752] hover:bg-[#eceef0] rounded-md text-[11px] font-medium"
                  >
                    ${isAdmin ? 'Сменить на Сотрудник' : 'Сменить на Админ'}
                  </button>
                </div>
              </div>
            </header>

            <!-- Search & Filter Controls -->
            <section class="bg-white p-5 rounded-xl border border-[#e0e3e5] shadow-sm mb-8">
              <h2 class="text-lg font-bold text-[#191c1e] mb-4 flex items-center gap-2">
                <span>🔍 Поиск документов</span>
              </h2>

              <form onsubmit="handleSearchSubmit(event)" class="grid grid-cols-1 md:grid-cols-12 gap-4">
                <!-- Query Input -->
                <div class="md:col-span-5">
                  <label for="search-query-input" class="block text-xs font-semibold text-[#191c1e] mb-1">
                    Название или ключевое слово
                  </label>
                  <input
                    id="search-query-input"
                    type="text"
                    value="${state.searchQuery}"
                    oninput="state.searchQuery = this.value"
                    placeholder="Например: грипп, протокол, генотипирование..."
                    class="w-full h-11 px-3.5 bg-[#f7f9fb] border border-[#c2c6d4] rounded-lg text-sm text-[#191c1e] focus:outline-none focus:ring-2 focus:ring-[#003f87]/40 focus:border-[#003f87]"
                  />
                </div>

                <!-- Author / Organization Filter -->
                <div class="md:col-span-3">
                  <label for="search-author-input" class="block text-xs font-semibold text-[#191c1e] mb-1">
                    Автор / Организация
                  </label>
                  <input
                    id="search-author-input"
                    type="text"
                    value="${state.selectedAuthor}"
                    oninput="state.selectedAuthor = this.value"
                    placeholder="НИИ Эпидемиологии"
                    class="w-full h-11 px-3.5 bg-[#f7f9fb] border border-[#c2c6d4] rounded-lg text-sm text-[#191c1e] focus:outline-none focus:ring-2 focus:ring-[#003f87]/40 focus:border-[#003f87]"
                  />
                </div>

                <!-- Year Filter -->
                <div class="md:col-span-2">
                  <label for="search-year-input" class="block text-xs font-semibold text-[#191c1e] mb-1">
                    Год публикации
                  </label>
                  <select
                    id="search-year-input"
                    onchange="state.selectedYear = this.value"
                    class="w-full h-11 px-3 bg-[#f7f9fb] border border-[#c2c6d4] rounded-lg text-sm text-[#191c1e] focus:outline-none focus:ring-2 focus:ring-[#003f87]/40 focus:border-[#003f87]"
                  >
                    <option value="" ${state.selectedYear === '' ? 'selected' : ''}>Все года</option>
                    <option value="2024" ${state.selectedYear === '2024' ? 'selected' : ''}>2024</option>
                    <option value="2023" ${state.selectedYear === '2023' ? 'selected' : ''}>2023</option>
                    <option value="2022" ${state.selectedYear === '2022' ? 'selected' : ''}>2022</option>
                    <option value="2021" ${state.selectedYear === '2021' ? 'selected' : ''}>2021</option>
                    <option value="2020" ${state.selectedYear === '2020' ? 'selected' : ''}>2020</option>
                  </select>
                </div>

                <!-- Action Buttons -->
                <div class="md:col-span-2 flex items-end gap-2">
                  <button
                    type="submit"
                    id="search-submit-btn"
                    class="flex-1 h-11 bg-[#003f87] hover:bg-[#002b5e] text-white font-medium text-sm rounded-lg transition-colors flex items-center justify-center shadow-sm focus:outline-none focus:ring-2 focus:ring-[#003f87]"
                  >
                    Найти
                  </button>
                  ${(state.searchQuery || state.selectedAuthor || state.selectedYear) ? `
                    <button
                      type="button"
                      id="search-reset-btn"
                      onclick="handleResetSearch()"
                      class="h-11 px-3 border border-[#c2c6d4] text-[#424752] hover:bg-[#eceef0] text-xs font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-[#003f87]"
                      title="Сбросить фильтры"
                    >
                      Сброс
                    </button>
                  ` : ''}
                </div>
              </form>
            </section>

            <!-- Document List Section -->
            <main>
              <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold text-[#191c1e]">
                  Результаты поиска <span class="text-sm font-normal text-[#424752]">(${filteredDocs.length})</span>
                </h2>
              </div>

              ${state.isLoading ? `
                <div id="catalog-loading-indicator" role="status" aria-live="polite" class="bg-white border border-[#e0e3e5] rounded-xl p-12 text-center space-y-4 shadow-sm my-6">
                  <div class="inline-block animate-spin rounded-full h-9 w-9 border-4 border-[#003f87] border-t-transparent mx-auto"></div>
                  <p class="text-sm font-medium text-[#424752]">Загрузка материалов каталога...</p>
                </div>
              ` : state.fetchError ? `
                <div id="catalog-error-message" role="alert" class="bg-white border border-[#ba1a1a] rounded-xl p-8 text-center space-y-3 shadow-sm my-6">
                  <div class="w-12 h-12 bg-[#ffdad6] text-[#ba1a1a] rounded-full flex items-center justify-center mx-auto text-xl font-bold">⚠</div>
                  <h3 class="text-lg font-bold text-[#93000a]">Ошибка загрузки данных</h3>
                  <p class="text-sm text-[#424752] max-w-md mx-auto">${state.fetchError}</p>
                </div>
              ` : filteredDocs.length === 0 ? `
                <!-- Explicit Empty State Message AC Required -->
                <div
                  id="empty-catalog-message"
                  role="status"
                  class="bg-white border border-[#e0e3e5] rounded-xl p-8 text-center space-y-3 shadow-sm my-6"
                >
                  <div class="w-12 h-12 bg-[#eceef0] rounded-full flex items-center justify-center mx-auto text-[#727784] text-xl font-bold">
                    📄
                  </div>
                  <h3 class="text-lg font-bold text-[#191c1e]">нет материалов</h3>
                  <p class="text-sm text-[#424752] max-w-md mx-auto">
                    По вашему запросу не найдено ни одного документа. Проверьте правильность фильтров или сбросьте параметры поиска.
                  </p>
                  <button
                    type="button"
                    onclick="handleResetSearch()"
                    class="px-4 py-2 border border-[#003f87] text-[#003f87] hover:bg-[#003f87]/5 rounded-lg text-xs font-semibold transition-colors mt-2"
                  >
                    Показать все материалы
                  </button>
                </div>
              ` : `
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                  ${filteredDocs.map(doc => `
                    <article class="bg-white border border-[#e0e3e5] rounded-xl p-5 shadow-sm hover:shadow-md transition-shadow flex flex-col justify-between">
                      <div>
                        <div class="flex items-start justify-between gap-2 mb-2">
                          <span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-[#d9e3f1] text-[#131c26]">
                            ${doc.docType}
                          </span>
                          <span class="text-xs text-[#727784] font-medium">${doc.year} г.</span>
                        </div>

                        <h3 class="text-base font-bold text-[#191c1e] mb-2 line-clamp-2 leading-snug">
                          ${doc.title}
                        </h3>

                        <p class="text-xs text-[#424752] mb-3 line-clamp-3 leading-relaxed">
                          ${doc.description}
                        </p>

                        <div class="text-xs text-[#727784] mb-4 space-y-1 border-t border-[#f2f4f6] pt-3">
                          <div class="flex items-center justify-between">
                            <span>Организация:</span>
                            <span class="font-medium text-[#191c1e]">${doc.author}</span>
                          </div>
                          <div class="flex items-center justify-between">
                            <span>Файл:</span>
                            <span class="font-medium text-[#191c1e]">${doc.fileName} (${doc.fileSize})</span>
                          </div>
                        </div>
                      </div>

                      <div class="flex items-center justify-between gap-2 pt-3 border-t border-[#e0e3e5]">
                        <button
                          type="button"
                          onclick="alert('Загрузка документа: ${doc.fileName}')"
                          class="flex-1 py-2 px-3 bg-[#003f87] hover:bg-[#002b5e] text-white text-xs font-medium rounded-md transition-colors flex items-center justify-center gap-1 shadow-sm"
                        >
                          <span>Скачать</span>
                        </button>

                        ${isAdmin ? `
                          <button
                            type="button"
                            onclick="handleDeleteDocument('${doc.id}')"
                            class="py-2 px-3 border border-[#ba1a1a] text-[#ba1a1a] hover:bg-[#ffdad6] text-xs font-medium rounded-md transition-colors"
                            title="Удалить документ"
                          >
                            Удалить
                          </button>
                        ` : ''}
                      </div>
                    </article>
                  `).join('')}
                </div>
              `}
            </main>

            <!-- Admin Upload Modal -->
            ${state.isUploadModalOpen ? `
              <div id="upload-modal" role="dialog" aria-modal="true" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
                <div class="bg-white rounded-xl border border-[#e0e3e5] max-w-lg w-full p-6 shadow-xl my-8">
                  <div class="flex items-center justify-between pb-3 border-b border-[#e0e3e5] mb-4">
                    <h3 class="text-lg font-bold text-[#191c1e]">Загрузка документа в каталог</h3>
                    <button
                      type="button"
                      onclick="closeUploadModal()"
                      class="text-[#727784] hover:text-[#191c1e] text-xl font-bold p-1 rounded-full"
                    >
                      ✕
                    </button>
                  </div>

                  ${state.uploadError ? `
                    <div id="upload-error-alert" role="alert" class="mb-4 p-3.5 rounded-lg bg-[#ffdad6] text-[#93000a] text-xs font-medium border border-[#ba1a1a]/30">
                      ⚠ ${state.uploadError}
                    </div>
                  ` : ''}

                  ${state.uploadSuccess ? `
                    <div id="upload-success-alert" role="status" class="mb-4 p-3.5 rounded-lg bg-[#d9e3f1] text-[#001a40] text-xs font-medium border border-[#003f87]/30">
                      ✓ ${state.uploadSuccess}
                    </div>
                  ` : ''}

                  <form id="upload-document-form" onsubmit="handleUploadSubmit(event)" class="space-y-4" novalidate>
                    <div>
                      <label for="upload-title-input" class="block text-xs font-semibold text-[#191c1e] mb-1">
                        Название документа *
                      </label>
                      <input
                        id="upload-title-input"
                        type="text"
                        value="${state.uploadTitle}"
                        oninput="state.uploadTitle = this.value"
                        placeholder="Введите полное название"
                        required
                        class="w-full h-10 px-3 bg-[#f7f9fb] border border-[#c2c6d4] rounded-md text-sm text-[#191c1e] focus:outline-none focus:border-[#003f87]"
                      />
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                      <div>
                        <label for="upload-author-input" class="block text-xs font-semibold text-[#191c1e] mb-1">
                          Автор / Организация *
                        </label>
                        <input
                          id="upload-author-input"
                          type="text"
                          value="${state.uploadAuthor}"
                          oninput="state.uploadAuthor = this.value"
                          placeholder="НИИ Эпидемиологии"
                          required
                          class="w-full h-10 px-3 bg-[#f7f9fb] border border-[#c2c6d4] rounded-md text-sm text-[#191c1e] focus:outline-none focus:border-[#003f87]"
                        />
                      </div>

                      <div>
                        <label for="upload-year-input" class="block text-xs font-semibold text-[#191c1e] mb-1">
                          Год публикации *
                        </label>
                        <input
                          id="upload-year-input"
                          type="number"
                          value="${state.uploadYear}"
                          oninput="state.uploadYear = this.value"
                          min="1990"
                          max="2030"
                          required
                          class="w-full h-10 px-3 bg-[#f7f9fb] border border-[#c2c6d4] rounded-md text-sm text-[#191c1e] focus:outline-none focus:border-[#003f87]"
                        />
                      </div>
                    </div>

                    <div>
                      <label for="upload-doctype-select" class="block text-xs font-semibold text-[#191c1e] mb-1">
                        Тип документа
                      </label>
                      <select
                        id="upload-doctype-select"
                        onchange="state.uploadDocType = this.value"
                        class="w-full h-10 px-3 bg-[#f7f9fb] border border-[#c2c6d4] rounded-md text-sm text-[#191c1e] focus:outline-none focus:border-[#003f87]"
                      >
                        <option value="Протокол расследования" ${state.uploadDocType === 'Протокол расследования' ? 'selected' : ''}>Протокол расследования</option>
                        <option value="Отчёт эпиднадзора" ${state.uploadDocType === 'Отчёт эпиднадзора' ? 'selected' : ''}>Отчёт эпиднадзора</option>
                        <option value="Набор данных" ${state.uploadDocType === 'Набор данных' ? 'selected' : ''}>Набор данных</option>
                        <option value="Методическое руководство" ${state.uploadDocType === 'Методическое руководство' ? 'selected' : ''}>Методическое руководство</option>
                      </select>
                    </div>

                    <div>
                      <label for="upload-description-input" class="block text-xs font-semibold text-[#191c1e] mb-1">
                        Описание
                      </label>
                      <textarea
                        id="upload-description-input"
                        oninput="state.uploadDescription = this.value"
                        rows="3"
                        placeholder="Краткая аннотация или описание документа"
                        class="w-full p-3 bg-[#f7f9fb] border border-[#c2c6d4] rounded-md text-sm text-[#191c1e] focus:outline-none focus:border-[#003f87]"
                      >${state.uploadDescription}</textarea>
                    </div>

                    <div>
                      <label for="upload-file-input" class="block text-xs font-semibold text-[#191c1e] mb-1">
                        Файл (PDF, DOCX)
                      </label>
                      <input
                        id="upload-file-input"
                        type="file"
                        onchange="handleFileSelect(event)"
                        accept=".pdf,.doc,.docx,.xlsx"
                        class="w-full text-xs text-[#424752] file:mr-3 file:py-2 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-[#d9e3f1] file:text-[#003f87] hover:file:bg-[#003f87]/10"
                      />
                    </div>

                    <!-- Switch for simulating network error -->
                    <div class="pt-2 border-t border-[#f2f4f6]">
                      <label class="flex items-center gap-2 text-xs text-[#424752] cursor-pointer">
                        <input
                          id="simulate-network-error-checkbox"
                          type="checkbox"
                          ${state.simulateNetworkError ? 'checked' : ''}
                          onchange="state.simulateNetworkError = this.checked"
                          class="rounded border-[#c2c6d4] text-[#003f87] focus:ring-[#003f87]"
                        />
                        <span>Симулировать сбой сети при отправке</span>
                      </label>
                    </div>

                    <div class="flex items-center justify-end gap-3 pt-4 border-t border-[#e0e3e5]">
                      <button
                        type="button"
                        onclick="closeUploadModal()"
                        class="px-4 py-2 border border-[#c2c6d4] text-[#424752] hover:bg-[#eceef0] text-xs font-medium rounded-md transition-colors"
                      >
                        Отмена
                      </button>
                      <button
                        type="submit"
                        id="upload-submit-btn"
                        ${state.isUploading ? 'disabled' : ''}
                        class="px-4 py-2 bg-[#003f87] hover:bg-[#002b5e] text-white text-xs font-medium rounded-md transition-colors disabled:opacity-60 shadow-sm"
                      >
                        ${state.isUploading ? 'Загрузка...' : 'Сохранить и загрузить'}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            ` : ''}

            <!-- Footer -->
            <footer class="w-full py-6 mt-12 text-center text-xs text-[#727784] border-t border-[#e0e3e5]">
              <p>Российский научно-исследовательский институт эпидемиологии</p>
            </footer>
          </div>
        `;
      }
    }

    function handleSearchSubmit(event) {
      if (event) event.preventDefault();
      render();
    }

    function handleResetSearch() {
      state.searchQuery = '';
      state.selectedAuthor = '';
      state.selectedYear = '';
      render();
    }

    function openUploadModal() {
      state.uploadError = '';
      state.uploadSuccess = '';
      state.isUploadModalOpen = true;
      render();
    }

    function closeUploadModal() {
      state.isUploadModalOpen = false;
      render();
    }

    function handleFileSelect(event) {
      const files = event.target.files;
      if (files && files.length > 0) {
        state.uploadFileName = files[0].name;
      }
    }

    function handleUploadSubmit(event) {
      if (event) event.preventDefault();
      state.uploadError = '';
      state.uploadSuccess = '';

      if (!state.uploadTitle.trim() || !state.uploadAuthor.trim() || !state.uploadYear) {
        state.uploadError = 'Заполните все обязательные поля формы.';
        render();
        return;
      }

      state.isUploading = true;
      render();

      setTimeout(() => {
        if (state.simulateNetworkError) {
          // KEY AC: On network failure, error is shown, but state metadata remains INTACT in the form!
          state.uploadError = 'Ошибка сети при загрузке документа. Попробуйте еще раз.';
          state.isUploading = false;
          render();
          return;
        }

        const newDoc = {
          id: 'doc-' + Date.now(),
          title: state.uploadTitle.trim(),
          author: state.uploadAuthor.trim(),
          year: parseInt(state.uploadYear, 10),
          docType: state.uploadDocType,
          fileName: state.uploadFileName || 'document.pdf',
          fileSize: '1.2 МБ',
          description: state.uploadDescription.trim() || 'Загруженный документ'
        };

        state.documents.unshift(newDoc);
        state.uploadSuccess = 'Документ успешно загружен в каталог.';

        // Reset metadata on success only
        state.uploadTitle = '';
        state.uploadAuthor = '';
        state.uploadYear = '2024';
        state.uploadDocType = 'Протокол расследования';
        state.uploadDescription = '';
        state.uploadFileName = '';
        state.isUploading = false;
        state.isUploadModalOpen = false;
        render();
      }, 300);
    }

    function handleDeleteDocument(id) {
      state.documents = state.documents.filter(doc => doc.id !== id);
      render();
    }

    function toggleRole() {
      if (state.currentUser.role === 'ADMIN') {
        state.currentUser.role = 'RESEARCHER';
        state.currentUser.full_name = 'Петров П.П. (Сотрудник)';
      } else {
        state.currentUser.role = 'ADMIN';
        state.currentUser.full_name = 'Иванов И.И. (Администратор)';
      }
      render();
    }

    // Initial render
    render();
  </script>
</body>
</html>
