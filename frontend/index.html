<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>База знаний по эпидемиологии — Единая консоль</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#003f87",
            "on-primary": "#ffffff",
            "background": "#f7f9fb",
            "on-surface": "#191c1e",
            "on-surface-variant": "#424752",
            "outline": "#727784",
            "outline-variant": "#c2c6d4",
            "surface-container-lowest": "#ffffff",
            "surface-container": "#eceef0",
            "surface-variant": "#e0e3e5",
            "error": "#ba1a1a",
            "error-container": "#ffdad6",
            "on-error-container": "#93000a"
          },
          fontFamily: {
            "sans": ["Inter", "sans-serif"],
            "heading": ["Manrope", "sans-serif"]
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #f7f9fb;
    }
  </style>
</head>
<body class="bg-[#f7f9fb] min-h-screen text-[#191c1e] antialiased font-sans">
  <div id="app"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const initialMode = urlParams.get('mode') || 'catalog';
    const initialTab = urlParams.get('tab') || 'catalog';

    const defaultSampleDocuments = [
      {
        id: '1',
        title: 'Протокол эпидемиологического расследования вспышки сальмонеллеза',
        author: 'НИИ Эпидемиологии',
        authorOrganization: 'НИИ Эпидемиологии',
        year: 2023,
        publicationYear: 2023,
        docType: 'Протокол расследования',
        fileName: 'salmonella_outbreak.pdf',
        filePath: '/data/docs/2023/salmonella_outbreak.pdf',
        fileSize: '2.4 МБ',
        description: 'Оперативный отчет и результаты бактериологического исследования.'
      },
      {
        id: '2',
        title: 'Отчет эпиднадзора по гриппу и ОРВИ за сезон 2022-2023',
        author: 'Центр мониторинга инфекций',
        authorOrganization: 'Центр мониторинга инфекций',
        year: 2023,
        publicationYear: 2023,
        docType: 'Отчёт эпиднадзора',
        fileName: 'flu_surveillance.pdf',
        filePath: '/data/docs/2023/flu_surveillance.pdf',
        fileSize: '4.1 МБ',
        description: 'Статистика заболеваемости и результаты лабораторного мониторинга.'
      },
      {
        id: '3',
        title: 'Методические рекомендации по профилактике кори',
        author: 'Министерство здравоохранения РФ',
        authorOrganization: 'Министерство здравоохранения РФ',
        year: 2021,
        publicationYear: 2021,
        docType: 'Методическое руководство',
        fileName: 'measles_prevention.docx',
        filePath: '/data/docs/2021/measles_prevention.docx',
        fileSize: '1.8 МБ',
        description: 'Инструкции для медицинского персонала по вакцинопрофилактике.'
      }
    ];

    let state = {
      mode: initialMode, // 'catalog' | 'login' | 'recovery'
      activeTab: initialTab, // 'catalog' | 'dossier' | 'foci' | 'telemetry'
      telemetry: {
        totalClicks: 9,
        tabNavigations: 5,
        successfulLoads: 5,
        failedLoads: 0,
        activities: [
          { id: 1, title: 'Инициализация приложения', module: 'Единая консоль', latencyMs: 18, timestamp: 'Только что', success: true }
        ],
        preConsolidationTaps: 3.2
      },
      currentUser: {
        id: 101,
        username: 'admin_user',
        role: 'ADMIN', // 'ADMIN' | 'RESEARCHER'
        full_name: 'Иванов И.И. (Администратор)',
        email: 'ivanov@epidemiology-inst.ru'
      },

      // Privacy state
      requestedFormat: 'ZIP',
      exportNotes: '',
      isExporting: false,
      exportError: '',
      exportSuccess: '',
      exportJob: null,

      isDeleteModalOpen: false,
      erasureReason: 'Отозвано согласие на обработку персональных данных (152-ФЗ)',
      erasureScope: 'ALL_PERSONAL_DATA',
      confirmationInput: '',
      isDeleting: false,
      deleteError: '',
      deleteSuccess: '',
      erasureJob: null,

      // Auth form state
      loginUsername: '',
      loginPassword: '',
      recoveryIdentity: '',
      recoverySent: false,

      // Search filter states
      searchQuery: '',
      selectedAuthor: '',
      selectedYear: '',

      // API Data View States
      documents: [...defaultSampleDocuments],
      isLoading: false,
      searchError: '',
      backendStopped: false,

      // Upload modal states
      isUploadModalOpen: false,
      uploadTitle: '',
      uploadAuthor: '',
      uploadYear: '2024',
      uploadDocType: 'Протокол расследования',
      uploadDescription: '',
      uploadFileName: '',
      simulateNetworkError: false,
      isUploading: false,
      uploadError: '',
      uploadSuccess: '',

      // Dossier module state
      dossierQuery: '',
      dossierResults: [],
      isReportGenerating: false,
      dossierReportNotice: '',

      // Root Cause / Foci state
      fociQuery: '',
      fociList: [
        { id: 'FOC-001', location: 'г. Москва, ВАО', hazardLevel: 'HIGH', category: 'Пищевой очаг (Сальмонеллез)', status: 'ACTIVE', cases: 14 },
        { id: 'FOC-002', location: 'Московская обл., г. Подольск', hazardLevel: 'MEDIUM', category: 'Респираторный очаг (ОРВИ/Грипп)', status: 'MONITORING', cases: 28 },
        { id: 'FOC-003', location: 'г. Санкт-Петербург, Невский р-н', hazardLevel: 'LOW', category: 'Контактно-бытовой очаг', status: 'CLOSED', cases: 3 }
      ],

    };

    document.addEventListener('click', () => {
      state.telemetry.totalClicks += 1;
      const elem = document.getElementById('metric-click-distance-value');
      if (elem && state.telemetry.tabNavigations > 0) {
        elem.childNodes[0].textContent = (state.telemetry.totalClicks / state.telemetry.tabNavigations).toFixed(1) + ' ';
      }
    });

    let activitySeq = 100;
    function switchTab(tabKey) {
      state.activeTab = tabKey;
      state.telemetry.tabNavigations += 1;
      state.telemetry.successfulLoads += 1;

      const tabTitles = {
        catalog: 'Каталог протоколов',
        dossier: 'Аналитика досье',
        foci: 'Категоризация очагов',
        privacy: 'Конфиденциальность',
        telemetry: 'Телеметрия навигации'
      };

      activitySeq += 1;
      const title = tabTitles[tabKey] || 'Переход по вкладке';
      state.telemetry.activities.unshift({
        id: activitySeq,
        title: `Переход: ${title}`,
        module: 'SPA Router',
        latencyMs: 15 + (activitySeq % 10) * 2,
        timestamp: 'Только что',
        success: true
      });

      render();
    }

    async function fetchDocuments() {
      state.isLoading = true;
      state.searchError = '';
      render();

      if (state.backendStopped) {
        setTimeout(() => {
          state.isLoading = false;
          state.documents = [];
          state.searchError = 'Ошибка подключения к серверу (Backend stopped). Каталог недоступен.';
          render();
        }, 150);
        return;
      }

      try {
        const params = new URLSearchParams();
        if (state.searchQuery.trim()) params.append('query', state.searchQuery.trim());
        if (state.selectedAuthor.trim()) params.append('author', state.selectedAuthor.trim());
        if (state.selectedYear.trim()) params.append('year', state.selectedYear.trim());

        const response = await fetch('/api/v1/documents/search?' + params.toString());
        if (!response.ok) {
          throw new Error('Ошибка сервера при поиске.');
        }
        const data = await response.json();
        if (Array.isArray(data)) {
          state.documents = data;
        } else if (data && Array.isArray(data.results)) {
          state.documents = data.results;
        } else {
          state.documents = [];
        }
      } catch (e) {
        let filtered = [...defaultSampleDocuments];
        if (state.searchQuery.trim()) {
          const q = state.searchQuery.trim().toLowerCase();
          filtered = filtered.filter(d =>
            (d.title && d.title.toLowerCase().includes(q)) ||
            (d.description && d.description.toLowerCase().includes(q))
          );
        }
        if (state.selectedAuthor.trim()) {
          const a = state.selectedAuthor.trim().toLowerCase();
          filtered = filtered.filter(d =>
            (d.author && d.author.toLowerCase().includes(a)) ||
            (d.authorOrganization && d.authorOrganization.toLowerCase().includes(a)) ||
            (d.author_organization && d.author_organization.toLowerCase().includes(a))
          );
        }
        if (state.selectedYear.trim()) {
          const y = parseInt(state.selectedYear.trim(), 10);
          filtered = filtered.filter(d => d.year === y || d.publicationYear === y || d.publication_year === y);
        }
        state.documents = filtered;
      } finally {
        state.isLoading = false;
        render();
      }
    }

    function handleDossierSearch() {
      if (!state.dossierQuery.trim()) return;
      state.dossierResults = [
        { id: 1, title: 'Приказ о назначении №42', type: 'order' },
        { id: 2, title: 'Выписка из учёного совета от 12.05.2023', type: 'extract' },
        { id: 3, title: 'Отчёт о командировке (Самара)', type: 'report' }
      ];
      render();
    }

    function handleGenerateDossierReport() {
      state.isReportGenerating = true;
      state.dossierReportNotice = '';
      render();

      setTimeout(() => {
        state.isReportGenerating = false;
        state.dossierReportNotice = '✓ Итоговая справка успешно сформирована.';
        render();
      }, 600);
    }

    function render() {
      const app = document.getElementById('app');
      const isAdmin = state.currentUser && state.currentUser.role === 'ADMIN';

      if (state.mode === 'login') {
        app.innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-4">
            <div class="bg-white p-8 rounded-xl border border-[#e0e3e5] shadow-lg max-w-md w-full">
              <h2 class="text-2xl font-bold text-[#003f87] mb-6">Вход в систему</h2>
              <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                <div>
                  <label class="block text-xs font-semibold text-[#191c1e] mb-1">Имя пользователя</label>
                  <input
                    id="username-input"
                    type="text"
                    value="${state.loginUsername}"
                    oninput="state.loginUsername = this.value"
                    required
                    class="w-full h-10 px-3 bg-[#f7f9fb] border border-[#c2c6d4] rounded-md text-sm text-[#191c1e]"
                  />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-[#191c1e] mb-1">Пароль</label>
                  <input
                    id="password-input"
                    type="password"
                    value="${state.loginPassword}"
                    oninput="state.loginPassword = this.value"
                    required
                    class="w-full h-10 px-3 bg-[#f7f9fb] border border-[#c2c6d4] rounded-md text-sm text-[#191c1e]"
                  />
                </div>
                <div class="flex items-center justify-between pt-2">
                  <a id="forgot-password-link" href="#" onclick="event.preventDefault(); state.mode = 'recovery'; render();" class="text-xs text-[#003f87] hover:underline">
                    Забыли пароль?
                  </a>
                </div>
                <button
                  type="submit"
                  class="w-full min-h-[44px] min-w-[44px] bg-[#003f87] text-white font-medium text-sm rounded-md transition-colors"
                >
                  Войти
                </button>
              </form>
            </div>
          </div>
        `;
        return;
      }

      if (state.mode === 'recovery') {
        app.innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-4">
            <div class="bg-white p-8 rounded-xl border border-[#e0e3e5] shadow-lg max-w-md w-full">
              ${!state.recoverySent ? `
                <h2 class="text-2xl font-bold text-[#003f87] mb-6">Забыли пароль?</h2>
                <form onsubmit="handleRecoverySubmit(event)" class="space-y-4">
                  <div>
                    <label class="block text-xs font-semibold text-[#191c1e] mb-1">Электронная почта / Логин</label>
                    <input
                      id="recovery-identity-input"
                      type="text"
                      value="${state.recoveryIdentity}"
                      oninput="state.recoveryIdentity = this.value"
                      required
                      class="w-full h-10 px-3 bg-[#f7f9fb] border border-[#c2c6d4] rounded-md text-sm text-[#191c1e]"
                    />
                  </div>
                  <button
                    type="submit"
                    class="w-full min-h-[44px] min-w-[44px] bg-[#003f87] text-white font-medium text-sm rounded-md transition-colors"
                  >
                    Восстановить
                  </button>
                </form>
              ` : `
                <main>
                  <h3 class="text-xl font-bold text-[#003f87] mb-4">Инструкции отправлены</h3>
                  <p class="text-sm text-[#424752] mb-6">Инструкции по восстановлению пароля отправлены на ваш электронный адрес.</p>
                </main>
                <button
                  type="button"
                  onclick="state.mode = 'login'; state.recoverySent = false; render();"
                  class="w-full min-h-[44px] min-w-[44px] bg-[#003f87] text-white font-medium text-sm rounded-md transition-colors"
                >
                  Вернуться ко входу
                </button>
              `}
            </div>
          </div>
        `;
        return;
      }

      // Unified Shell with Top Header and Nav Tabs
      app.innerHTML = `
        <div class="min-h-screen bg-[#f7f9fb] font-sans text-[#191c1e]">
          <!-- Unified Header Navigation Shell -->
          <header class="bg-[#003f87] text-white shadow-md sticky top-0 z-40">
            <div class="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8">
              <div class="flex items-center justify-between h-16 border-b border-[#002b5e]">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-lg bg-white/10 flex items-center justify-center text-xl font-bold">
                    ☣️
                  </div>
                  <div>
                    <h1 class="text-base font-bold leading-tight">База знаний по эпидемиологии</h1>
                    <p class="text-[11px] text-white/80">Единая автономная консоль навигации</p>
                  </div>
                </div>

                <!-- User Account Info & Role Toggle -->
                <div class="flex items-center gap-3">
                  <div class="hidden sm:flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-lg border border-white/20">
                    <div class="w-8 h-8 rounded-full bg-white text-[#003f87] flex items-center justify-center font-bold text-xs">
                      ${(state.currentUser?.full_name || state.currentUser?.username || 'С')[0]}
                    </div>
                    <div class="text-left">
                      <div class="text-xs font-semibold leading-tight">${state.currentUser?.full_name || state.currentUser?.username}</div>
                      <div class="text-[10px] text-white/80">
                        Роль: <span class="font-bold">${isAdmin ? 'Администратор' : 'Сотрудник'}</span>
                      </div>
                    </div>
                  </div>

                  <button
                    id="switch-role-btn"
                    type="button"
                    onclick="toggleRole()"
                    class="min-h-[44px] px-3 py-2 bg-white/10 hover:bg-white/20 focus:ring-2 focus:ring-white rounded-lg text-xs font-semibold text-white border border-white/30 transition-colors"
                  >
                    ${isAdmin ? 'Сменить на Сотрудник' : 'Сменить на Админ'}
                  </button>
                  <button
                    id="logout-btn"
                    type="button"
                    onclick="handleLogout()"
                    class="min-h-[44px] px-3 py-2 bg-white/10 hover:bg-white/20 focus:ring-2 focus:ring-white rounded-lg text-xs font-semibold text-white border border-white/30 transition-colors"
                  >
                    Выйти
                  </button>
                </div>
              </div>

              <!-- Module Navigation Tabs Bar (Miller's Law <= 9, Fitts's Law >= 44px) -->
              <nav class="flex space-x-2 overflow-x-auto py-2" aria-label="Навигация по модулям">
                <button
                  id="tab-catalog"
                  type="button"
                  role="tab"
                  aria-selected="${state.activeTab === 'catalog'}"
                  aria-controls="panel-catalog"
                  onclick="switchTab('catalog')"
                  class="min-h-[44px] min-w-[44px] px-4 py-2.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-2 whitespace-nowrap focus:outline-none focus:ring-2 focus:ring-white ${state.activeTab === 'catalog' ? 'bg-white text-[#003f87] shadow-sm font-bold' : 'text-white/90 hover:bg-white/10 hover:text-white'}"
                >
                  <span class="text-sm">📁</span>
                  <span>Каталог протоколов</span>
                </button>

                <button
                  id="tab-dossier"
                  type="button"
                  role="tab"
                  aria-selected="${state.activeTab === 'dossier'}"
                  aria-controls="panel-dossier"
                  onclick="switchTab('dossier')"
                  class="min-h-[44px] min-w-[44px] px-4 py-2.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-2 whitespace-nowrap focus:outline-none focus:ring-2 focus:ring-white ${state.activeTab === 'dossier' ? 'bg-white text-[#003f87] shadow-sm font-bold' : 'text-white/90 hover:bg-white/10 hover:text-white'}"
                >
                  <span class="text-sm">📊</span>
                  <span>Аналитика досье</span>
                </button>

                <button
                  id="tab-foci"
                  type="button"
                  role="tab"
                  aria-selected="${state.activeTab === 'foci'}"
                  aria-controls="panel-foci"
                  onclick="switchTab('foci')"
                  class="min-h-[44px] min-w-[44px] px-4 py-2.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-2 whitespace-nowrap focus:outline-none focus:ring-2 focus:ring-white ${state.activeTab === 'foci' ? 'bg-white text-[#003f87] shadow-sm font-bold' : 'text-white/90 hover:bg-white/10 hover:text-white'}"
                >
                  <span class="text-sm">🔍</span>
                  <span>Категоризация очагов</span>
                </button>

                <button
                  id="tab-privacy"
                  type="button"
                  role="tab"
                  aria-selected="${state.activeTab === 'privacy'}"
                  aria-controls="panel-privacy"
                  onclick="switchTab('privacy')"
                  class="min-h-[44px] min-w-[44px] px-4 py-2.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-2 whitespace-nowrap focus:outline-none focus:ring-2 focus:ring-white ${state.activeTab === 'privacy' ? 'bg-white text-[#003f87] shadow-sm font-bold' : 'text-white/90 hover:bg-white/10 hover:text-white'}"
                >
                  <span class="text-sm">🔒</span>
                  <span>Конфиденциальность</span>
                </button>

                <button
                  id="tab-telemetry"
                  type="button"
                  role="tab"
                  aria-selected="${state.activeTab === 'telemetry'}"
                  aria-controls="panel-telemetry"
                  onclick="switchTab('telemetry')"
                  class="min-h-[44px] min-w-[44px] px-4 py-2.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-2 whitespace-nowrap focus:outline-none focus:ring-2 focus:ring-white ${state.activeTab === 'telemetry' ? 'bg-white text-[#003f87] shadow-sm font-bold' : 'text-white/90 hover:bg-white/10 hover:text-white'}"
                >
                  <span class="text-sm">📈</span>
                  <span>Телеметрия</span>
                </button>

              </nav>
            </div>
          </header>

          <main class="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 py-6">
            ${state.activeTab === 'catalog' ? `
              <!-- TAB 1: CATALOG OF PROTOCOLS -->
              <section id="panel-catalog" role="tabpanel" aria-labelledby="tab-catalog" class="space-y-6">
                <!-- Search & Filter Controls -->
                <div class="bg-white p-5 rounded-xl border border-[#e0e3e5] shadow-sm">
                  <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-bold text-[#191c1e] flex items-center gap-2">
                      <span>🔍 Поиск документов в каталоге</span>
                    </h2>
                    ${isAdmin ? `
                      <button
                        id="open-upload-modal-btn"
                        type="button"
                        onclick="openUploadModal()"
                        class="min-h-[44px] min-w-[44px] px-4 py-2 bg-[#003f87] hover:bg-[#002b5e] focus:ring-2 focus:ring-[#003f87]/50 focus:outline-none text-white rounded-lg text-xs font-bold transition-colors flex items-center gap-1.5 shadow-sm"
                      >
                        <span>+ Загрузить документ</span>
                      </button>
                    ` : ''}
                  </div>

                  <form onsubmit="handleSearchSubmit(event)" class="grid grid-cols-1 md:grid-cols-12 gap-4">
                    <div class="md:col-span-5">
                      <label for="search-query-input" class="block text-xs font-semibold text-[#191c1e] mb-1">
                        Название или ключевое слово
                      </label>
                      <input
                        id="search-query-input"
                        type="text"
                        value="${state.searchQuery}"
                        oninput="state.searchQuery = this.value"
                        placeholder="Например: грипп, протокол, генотипирование..."
                        class="w-full h-11 px-3.5 bg-[#f7f9fb] border border-[#c2c6d4] rounded-lg text-sm text-[#191c1e] focus:outline-none focus:ring-2 focus:ring-[#003f87]/50 focus:border-[#003f87]"
                      />
                    </div>

                    <div class="md:col-span-3">
                      <label for="search-author-input" class="block text-xs font-semibold text-[#191c1e] mb-1">
                        Автор / Организация
                      </label>
                      <input
                        id="search-author-input"
                        type="text"
                        value="${state.selectedAuthor}"
                        oninput="state.selectedAuthor = this.value"
                        placeholder="НИИ Эпидемиологии"
                        class="w-full h-11 px-3.5 bg-[#f7f9fb] border border-[#c2c6d4] rounded-lg text-sm text-[#191c1e] focus:outline-none focus:ring-2 focus:ring-[#003f87]/50 focus:border-[#003f87]"
                      />
                    </div>

                    <div class="md:col-span-2">
                      <label for="search-year-input" class="block text-xs font-semibold text-[#191c1e] mb-1">
                        Год публикации
                      </label>
                      <select
                        id="search-year-input"
                        onchange="state.selectedYear = this.value"
                        class="w-full h-11 px-3 bg-[#f7f9fb] border border-[#c2c6d4] rounded-lg text-sm text-[#191c1e] focus:outline-none focus:ring-2 focus:ring-[#003f87]/50 focus:border-[#003f87]"
                      >
                        <option value="" ${state.selectedYear === '' ? 'selected' : ''}>Все года</option>

    function handleLoginSubmit(event) {
      if (event) event.preventDefault();
      if (state.loginUsername === 'employee_user') {
        state.currentUser.role = 'RESEARCHER';
        state.currentUser.full_name = 'Петров П.П. (Сотрудник)';
      } else {
        state.currentUser.role = 'ADMIN';
        state.currentUser.full_name = 'Иванов И.И. (Администратор)';
      }
      state.mode = 'catalog';
      fetchDocuments();
    }

    function handleLogout() {
      state.mode = "login";
      state.loginUsername = "";
      state.loginPassword = "";
      state.currentUser = { id: null, username: "", role: "", full_name: "", email: "" };
      render();
    }

    function handleRecoverySubmit(event) {
      if (event) event.preventDefault();
      state.recoverySent = true;
      render();
    }

    function handleSearchSubmit(event) {
      if (event) event.preventDefault();
      fetchDocuments();
    }

    function handleResetSearch() {
      state.searchQuery = '';
      state.selectedAuthor = '';
      state.selectedYear = '';
      fetchDocuments();
    }

    function openUploadModal() {
      state.uploadError = '';
      state.uploadSuccess = '';
      state.isUploadModalOpen = true;
      render();
    }

    function closeUploadModal() {
      state.isUploadModalOpen = false;
      render();
    }

    function handleUploadSubmit(event) {
      if (event) event.preventDefault();
      state.uploadError = '';
      state.uploadSuccess = '';

      if (!state.uploadTitle.trim() || !state.uploadAuthor.trim() || !state.uploadYear) {
        state.uploadError = 'Заполните все обязательные поля формы.';
        render();
        return;
      }

      state.isUploading = true;
      render();

      setTimeout(() => {
        if (state.simulateNetworkError) {
          state.uploadError = 'Ошибка сети при загрузке документа. Попробуйте еще раз.';
          state.isUploading = false;
          render();
          return;
        }

        const titleSlug = state.uploadTitle.trim().toLowerCase().replace(/\s+/g, '-');
        const newDoc = {
          id: `doc-${titleSlug}-${state.uploadYear}`,
          title: state.uploadTitle.trim(),
          author: state.uploadAuthor.trim(),
          authorOrganization: state.uploadAuthor.trim(),
          year: parseInt(state.uploadYear, 10),
          publicationYear: parseInt(state.uploadYear, 10),
          docType: state.uploadDocType,
          fileName: state.uploadFileName || 'document.pdf',
          fileSize: '1.2 МБ',
          description: state.uploadDescription.trim() || 'Загруженный документ'
        };

        state.documents.unshift(newDoc);
        defaultSampleDocuments.unshift(newDoc);
        state.uploadSuccess = 'Документ успешно загружен в каталог.';

        state.uploadTitle = '';
        state.uploadAuthor = '';
        state.uploadYear = '2024';
        state.uploadDocType = 'Протокол расследования';
        state.uploadDescription = '';
        state.uploadFileName = '';
        state.isUploading = false;
        state.isUploadModalOpen = false;
        render();
      }, 300);
    }

    function handleDownloadDocument(id) {
      const doc = state.documents.find(d => String(d.id) === String(id)) || defaultSampleDocuments.find(d => String(d.id) === String(id));
      const downloadUrl = `/api/v1/documents/${id}/download`;
      const fileName = doc ? (doc.fileName || doc.filePath?.substring(doc.filePath.lastIndexOf('/') + 1) || 'document.pdf') : `document_${id}.pdf`;

      const a = document.createElement('a');
      a.href = downloadUrl;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function handleDeleteDocument(id) {
      state.documents = state.documents.filter(doc => String(doc.id) !== String(id));
      const idx = defaultSampleDocuments.findIndex(doc => String(doc.id) === String(id));
      if (idx !== -1) {
        defaultSampleDocuments.splice(idx, 1);
      }
      render();
    }

    function getExpectedConfirmationToken() {
      return `УДАЛИТЬ ${state.currentUser?.username || 'АККАУНТ'}`;
    }

    async function handleExportData(event) {
      if (event) event.preventDefault();
      state.exportError = '';
      state.exportSuccess = '';
      state.isExporting = true;
      render();

      try {
        const response = await fetch('/api/v1/privacy/export-requests', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            subject_id: state.currentUser?.username || 'usr_101',
            requested_format: state.requestedFormat,
            notes: state.exportNotes.trim()
          })
        });

        if (!response.ok) {
          let errData = {};
          try { errData = await response.json(); } catch (e) {}
          throw new Error(errData.message || 'Ошибка при запросе экспорта данных. Попробуйте позже.');
        }

        state.exportJob = await response.json();
        state.exportSuccess = 'Запрос на экспорт данных успешно создан и обрабатывается.';
      } catch (err) {
        state.exportError = err.message || 'Произошла ошибка при формировании запроса экспорта.';
      } finally {
        state.isExporting = false;
        render();
      }
    }

    function openDeleteModal() {
      state.deleteError = '';
      state.deleteSuccess = '';
      state.confirmationInput = '';
      state.isDeleteModalOpen = true;
      render();
    }

    function closeDeleteModal() {
      state.isDeleteModalOpen = false;
      state.confirmationInput = '';
      state.deleteError = '';
      render();
    }

    async function handleConfirmDelete(event) {
      if (event) event.preventDefault();
      state.deleteError = '';
      state.deleteSuccess = '';

      const expectedToken = getExpectedConfirmationToken();
      if (state.confirmationInput.trim() !== expectedToken) {
        state.deleteError = 'Код подтверждения введен неверно.';
        render();
        return;
      }

      state.isDeleting = true;
      render();

      try {
        const subjectId = state.currentUser?.username || 'usr_101';
        const response = await fetch('/api/v1/privacy/erasure-requests', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            subject_id: subjectId,
            confirmation_token: `CONFIRM_ERASURE_${subjectId}`,
            reason: state.erasureReason,
            erasure_scope: state.erasureScope
          })
        });

        if (!response.ok) {
          let errData = {};
          try { errData = await response.json(); } catch (e) {}
          throw new Error(errData.message || 'Ошибка при обработке запроса на удаление данных.');
        }

        state.erasureJob = await response.json();
        state.deleteSuccess = 'Запрос на удаление данных принят. Аккаунт и персональные данные будут удалены.';
        state.isDeleteModalOpen = false;
      } catch (err) {
        state.deleteError = err.message || 'Не удалось выполнить запрос на удаление аккаунта.';
      } finally {
        state.isDeleting = false;
        render();
      }
    }

    function toggleRole() {
      if (state.currentUser.role === 'ADMIN') {
        state.currentUser.role = 'RESEARCHER';
        state.currentUser.full_name = 'Петров П.П. (Сотрудник)';
      } else {
        state.currentUser.role = 'ADMIN';
        state.currentUser.full_name = 'Иванов И.И. (Администратор)';
      }
      render();
    }

    // Initial fetch and render
    if (state.mode === 'catalog') {
      fetchDocuments();
    } else {
      render();
    }
  </script>
</body>
</html>
