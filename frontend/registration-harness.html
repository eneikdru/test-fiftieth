<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>База знаний по эпидемиологии — Регистрация и Онбординг</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script src="https://unpkg.com/svelte@3.59.2/compiler.js"></script>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import * as svelteInternal from 'https://unpkg.com/svelte@3.59.2/internal/index.mjs';

    async function loadComponent() {
      try {
        const response = await fetch('./src/components/RegistrationForm.svelte');
        const source = await response.text();

        // Compile using the unpkg compiler to ESM
        const { js } = window.svelte.compile(source, {
          format: 'esm',
          name: 'RegistrationForm',
          sveltePath: 'svelte' // Keep it basic, we will map it below
        });

        // Instead of data URI which might conflict, let's create a blob URL
        // We replace standard 'svelte/internal' imports with full unpkg URL
        const codeWithMjs = js.code.replace(/from "svelte\/internal"/g, `from "https://unpkg.com/svelte@3.59.2/internal/index.mjs"`);

        const blob = new Blob([codeWithMjs], { type: 'application/javascript' });
        const blobUrl = URL.createObjectURL(blob);

        const module = await import(blobUrl);
        const RegistrationForm = module.default;

        new RegistrationForm({
          target: document.getElementById('app'),
          props: { mode: 'landing' }
        });
      } catch (err) {
        console.error(err);
        document.getElementById('app').innerHTML = `<h1 class="error">Error loading component: ${err.message}</h1>`;
      }
    }
    loadComponent();
  </script>
</body>
</html>
