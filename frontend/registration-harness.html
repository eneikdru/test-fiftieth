<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>База знаний по эпидемиологии — Регистрация и Онбординг</title>
  <link rel="stylesheet" href="./tailwind.css" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script src="https://unpkg.com/svelte@3.59.2/compiler.js"></script>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import * as svelteInternal from 'https://unpkg.com/svelte@3.59.2/internal/index.mjs';

    async function compileSvelteComponent(path) {
      const response = await fetch(path);
      const source = await response.text();

      const name = path.split('/').pop().replace('.svelte', '');
      const { js } = window.svelte.compile(source, {
        format: 'esm',
        name,
        sveltePath: 'https://unpkg.com/svelte@3.59.2'
      });

      return js.code;
    }

    async function loadComponent() {
      try {
        // Compile ImprintModal first
        const imprintCode = await compileSvelteComponent('./src/components/ImprintModal.svelte');
        const imprintCodeMjs = imprintCode
          .replace(/from ['"]https:\/\/unpkg\.com\/svelte@3\.59\.2\/internal['"]/g, `from "https://unpkg.com/svelte@3.59.2/internal/index.mjs"`)
          .replace(/from ['"]https:\/\/unpkg\.com\/svelte@3\.59\.2['"]/g, `from "https://unpkg.com/svelte@3.59.2/index.mjs"`);
        const imprintBlob = new Blob([imprintCodeMjs], { type: 'application/javascript' });
        const imprintBlobUrl = URL.createObjectURL(imprintBlob);

        // Compile RegistrationForm
        const regCode = await compileSvelteComponent('./src/components/RegistrationForm.svelte');
        const regCodeMjs = regCode
          .replace(/from ['"]https:\/\/unpkg\.com\/svelte@3\.59\.2\/internal['"]/g, `from "https://unpkg.com/svelte@3.59.2/internal/index.mjs"`)
          .replace(/from ['"]https:\/\/unpkg\.com\/svelte@3\.59\.2['"]/g, `from "https://unpkg.com/svelte@3.59.2/index.mjs"`)
          .replace(/from ['"]\.\/ImprintModal\.svelte['"]/g, `from "${imprintBlobUrl}"`);

        const regBlob = new Blob([regCodeMjs], { type: 'application/javascript' });
        const regBlobUrl = URL.createObjectURL(regBlob);

        const module = await import(regBlobUrl);
        const RegistrationForm = module.default;

        new RegistrationForm({
          target: document.getElementById('app'),
          props: { mode: 'landing' }
        });
      } catch (err) {
        console.error(err);
        document.getElementById('app').innerHTML = `<h1 class="error">Error loading component: ${err.message}</h1>`;
      }
    }
    loadComponent();
  </script>
</body>
</html>
