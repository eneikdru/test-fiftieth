<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>База знаний по эпидемиологии — Регистрация и Онбординг</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="bg-[#f7f9fb] min-h-screen text-[#1a1c1e] antialiased font-sans">
  <div id="app"></div>

  <script>
    let state = {
      mode: 'landing', // 'landing' | 'registration' | 'onboarding_1' | 'onboarding_2'
      username: '',
      email: '',
      password: '',
      confirmPassword: '',
      firstName: '',
      lastName: '',
      organization: '',
      errorMessage: ''
    };

    function setMode(newMode) {
      state.mode = newMode;
      state.errorMessage = '';
      render();
    }

    function handleRegistrationSubmit(e) {
      if (e) e.preventDefault();
      state.errorMessage = '';

      if (!state.username || !state.email || !state.password || !state.confirmPassword) {
        state.errorMessage = 'Пожалуйста, заполните все обязательные поля.';
        render();
        return;
      }

      if (state.password !== state.confirmPassword) {
        state.errorMessage = 'Пароли не совпадают';
        render();
        return;
      }

      setMode('onboarding_1');
    }

    function handleOnboarding1Submit(e) {
      if (e) e.preventDefault();
      state.errorMessage = '';

      if (!state.firstName || !state.lastName) {
        state.errorMessage = 'Имя и фамилия обязательны для заполнения.';
        render();
        return;
      }

      setMode('onboarding_2');
    }

    function render() {
      const app = document.getElementById('app');

      if (state.mode === 'landing') {
        app.innerHTML = `
          <div class="min-h-screen bg-[#f7f9fb] flex flex-col justify-between">
            <header class="w-full flex items-center justify-between h-16 px-6 bg-white border-b border-[#e2e2e5]">
              <div class="flex items-center space-x-2">
                <span class="text-[#00328a] font-bold text-xl tracking-tight">ЭпидБаза</span>
                <span class="text-xs text-[#434653] font-medium bg-[#eeeef0] px-2.5 py-1 rounded-full hidden sm:inline-block">НИИ Эпидемиологии</span>
              </div>
              <button type="button" onclick="setMode('registration')" class="text-sm font-semibold text-[#00328a] hover:underline px-3 py-1.5">
                Регистрация
              </button>
            </header>

            <main class="flex-1 flex flex-col justify-center items-center px-4 py-8 text-center">
              <div class="max-w-3xl w-full space-y-8">
                <h1 class="text-4xl sm:text-5xl font-extrabold text-[#1a1c1e] tracking-tight">
                  База знаний по эпидемиологии
                </h1>
                <p class="text-lg text-[#434653] max-w-xl mx-auto">
                  Единая система для каталогизации, поиска и управления эпидемиологическими материалами, протоколами и данными института.
                </p>
                <div class="pt-4 flex flex-col sm:flex-row items-center justify-center space-y-4 sm:space-y-0 sm:space-x-4">
                  <button type="button" onclick="setMode('registration')" class="w-full sm:w-auto px-8 py-3.5 bg-[#00328a] text-white rounded-lg font-medium text-base hover:bg-[#002566] shadow-sm">
                    Создать аккаунт
                  </button>
                  <button type="button" class="w-full sm:w-auto px-8 py-3.5 bg-white border border-[#c3c6d6] text-[#1a1c1e] rounded-lg font-medium text-base hover:bg-[#f3f3f6]">
                    Войти в систему
                  </button>
                </div>
              </div>
            </main>

            <footer class="w-full py-4 px-6 text-center text-xs text-[#737685] border-t border-[#e2e2e5] bg-white">
              <p>Российский научно-исследовательский институт эпидемиологии</p>
            </footer>
          </div>
        `;
        return;
      }

      if (state.mode === 'registration') {
        app.innerHTML = `
          <div class="min-h-screen bg-[#f7f9fb] flex flex-col justify-between">
            <header class="w-full flex items-center justify-between h-16 px-6 bg-white border-b border-[#e2e2e5]">
              <div class="flex items-center space-x-2">
                <span class="text-[#00328a] font-bold text-xl tracking-tight">ЭпидБаза</span>
              </div>
              <button type="button" onclick="setMode('landing')" class="text-sm font-medium text-[#434653] hover:text-[#00328a]">
                К входу
              </button>
            </header>

            <main class="flex-1 flex flex-col justify-center items-center px-4 py-8">
              <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-sm border border-[#e2e2e5]">
                <h2 class="text-2xl font-bold text-[#1a1c1e] mb-6 tracking-tight text-center">Создать аккаунт</h2>

                ${state.errorMessage ? `
                  <div role="alert" class="mb-6 p-4 rounded-lg bg-[#ffdad6] text-[#93000a] text-sm border border-[#ba1a1a]/20 flex items-start space-x-2">
                    <span>⚠</span>
                    <span>${state.errorMessage}</span>
                  </div>
                ` : ''}

                <form onsubmit="handleRegistrationSubmit(event)" class="space-y-5" novalidate>
                  <div>
                    <label for="username" class="block text-sm font-semibold text-[#1a1c1e] mb-1.5">Имя пользователя</label>
                    <input
                      id="username"
                      type="text"
                      value="${state.username}"
                      oninput="state.username = this.value"
                      required
                      class="w-full h-12 px-4 rounded-md border border-[#c3c6d6] focus:border-[#00328a] outline-none text-[#1a1c1e] text-base"
                    />
                  </div>

                  <div>
                    <label for="email" class="block text-sm font-semibold text-[#1a1c1e] mb-1.5">Электронная почта</label>
                    <input
                      id="email"
                      type="email"
                      value="${state.email}"
                      oninput="state.email = this.value"
                      required
                      class="w-full h-12 px-4 rounded-md border border-[#c3c6d6] focus:border-[#00328a] outline-none text-[#1a1c1e] text-base"
                    />
                  </div>

                  <div>
                    <label for="password" class="block text-sm font-semibold text-[#1a1c1e] mb-1.5">Пароль</label>
                    <input
                      id="password"
                      type="password"
                      value="${state.password}"
                      oninput="state.password = this.value"
                      required
                      class="w-full h-12 px-4 rounded-md border border-[#c3c6d6] focus:border-[#00328a] outline-none text-[#1a1c1e] text-base"
                    />
                  </div>

                  <div>
                    <label for="confirm-password" class="block text-sm font-semibold text-[#1a1c1e] mb-1.5">Подтвердите пароль</label>
                    <input
                      id="confirm-password"
                      type="password"
                      value="${state.confirmPassword}"
                      oninput="state.confirmPassword = this.value"
                      required
                      class="w-full h-12 px-4 rounded-md border border-[#c3c6d6] focus:border-[#00328a] outline-none text-[#1a1c1e] text-base"
                    />
                  </div>

                  <div class="pt-2">
                    <button type="submit" class="w-full h-12 bg-[#00328a] text-white rounded-lg font-medium text-base hover:bg-[#002566]">
                      Продолжить
                    </button>
                  </div>
                </form>
              </div>
            </main>

            <footer class="w-full py-4 px-6 text-center text-xs text-[#737685] border-t border-[#e2e2e5] bg-white">
              <p>Российский научно-исследовательский институт эпидемиологии</p>
            </footer>
          </div>
        `;
        return;
      }

      if (state.mode === 'onboarding_1') {
        app.innerHTML = `
          <div class="min-h-screen bg-[#f7f9fb] flex flex-col justify-between">
            <main class="flex-1 flex flex-col justify-center items-center px-4 py-8">
              <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-sm border border-[#e2e2e5]">
                <h2 class="text-2xl font-bold text-[#1a1c1e] mb-2 tracking-tight text-center">Ваш профиль</h2>
                <p class="text-sm text-[#434653] text-center mb-6">Расскажите немного о себе.</p>

                ${state.errorMessage ? `
                  <div role="alert" class="mb-6 p-4 rounded-lg bg-[#ffdad6] text-[#93000a] text-sm border border-[#ba1a1a]/20 flex items-start space-x-2">
                    <span>⚠</span>
                    <span>${state.errorMessage}</span>
                  </div>
                ` : ''}

                <form onsubmit="handleOnboarding1Submit(event)" class="space-y-5" novalidate>
                  <div>
                    <label for="firstName" class="block text-sm font-semibold text-[#1a1c1e] mb-1.5">Имя</label>
                    <input
                      id="firstName"
                      type="text"
                      value="${state.firstName}"
                      oninput="state.firstName = this.value"
                      required
                      class="w-full h-12 px-4 rounded-md border border-[#c3c6d6] outline-none text-[#1a1c1e] text-base"
                    />
                  </div>

                  <div>
                    <label for="lastName" class="block text-sm font-semibold text-[#1a1c1e] mb-1.5">Фамилия</label>
                    <input
                      id="lastName"
                      type="text"
                      value="${state.lastName}"
                      oninput="state.lastName = this.value"
                      required
                      class="w-full h-12 px-4 rounded-md border border-[#c3c6d6] outline-none text-[#1a1c1e] text-base"
                    />
                  </div>

                  <div>
                    <label for="organization" class="block text-sm font-semibold text-[#1a1c1e] mb-1.5">Организация</label>
                    <input
                      id="organization"
                      type="text"
                      value="${state.organization}"
                      oninput="state.organization = this.value"
                      class="w-full h-12 px-4 rounded-md border border-[#c3c6d6] outline-none text-[#1a1c1e] text-base"
                    />
                  </div>

                  <div class="pt-4 flex items-center justify-between">
                    <button type="button" onclick="setMode('onboarding_2')" class="text-sm font-medium text-[#434653]">
                      Пропустить
                    </button>
                    <button type="submit" class="px-6 h-11 bg-[#00328a] text-white rounded-lg font-medium text-sm">
                      Далее
                    </button>
                  </div>
                </form>
              </div>
            </main>
          </div>
        `;
        return;
      }

      if (state.mode === 'onboarding_2') {
        app.innerHTML = `
          <div class="min-h-screen bg-[#f7f9fb] flex flex-col justify-between">
            <main class="flex-1 flex flex-col justify-center items-center px-4 py-8">
              <div class="w-full max-w-2xl bg-white p-8 rounded-xl shadow-sm border border-[#e2e2e5]">
                <h2 class="text-2xl font-bold text-[#1a1c1e] mb-2 tracking-tight text-center">Настройка рабочего пространства</h2>
                <div class="flex justify-center mt-6">
                  <button type="button" onclick="alert('Настройка завершена!'); setMode('landing');" class="px-8 h-12 bg-[#00328a] text-white rounded-lg font-medium text-base">
                    Завершить настройку
                  </button>
                </div>
              </div>
            </main>
          </div>
        `;
        return;
      }
    }

    render();
  </script>
</body>
</html>
