<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>База знаний по эпидемиологии — Регистрация и Онбординг</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script type="importmap">
    {
      "imports": {
        "svelte": "https://unpkg.com/svelte@3.59.2/index.mjs",
        "svelte/internal": "https://unpkg.com/svelte@3.59.2/internal/index.mjs"
      }
    }
  </script>
  <script src="https://unpkg.com/svelte@3.59.2/compiler.js"></script>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    async function loadComponent() {
      try {
        const formResp = await fetch('./src/components/RegistrationForm.svelte');
        const formSource = await formResp.text();

        // Custom fetch/compile resolver for component imports
        async function compileAndGetBlobUrl(componentPath) {
          const resp = await fetch(componentPath);
          const source = await resp.text();
          const { js } = window.svelte.compile(source, {
            format: 'esm',
            name: componentPath.split('/').pop().replace('.svelte', ''),
            sveltePath: 'svelte'
          });

          let code = js.code;
          // Replace relative .svelte imports with blob URLs
          const importMatches = [...code.matchAll(/import\s+(\w+)\s+from\s+['"](\.\/[^'"]+\.svelte)['"]/g)];
          for (const match of importMatches) {
            const [fullMatch, importName, relativePath] = match;
            const subPath = './src/components/' + relativePath.replace('./', '');
            const subBlobUrl = await compileAndGetBlobUrl(subPath);
            code = code.replace(fullMatch, `import ${importName} from '${subBlobUrl}'`);
          }

          const blob = new Blob([code], { type: 'application/javascript' });
          return URL.createObjectURL(blob);
        }

        const mainBlobUrl = await compileAndGetBlobUrl('./src/components/RegistrationForm.svelte');
        const module = await import(mainBlobUrl);
        const RegistrationForm = module.default;

        new RegistrationForm({
          target: document.getElementById('app'),
          props: { mode: 'landing' }
        });
      } catch (err) {
        console.error(err);
        document.getElementById('app').innerHTML = `<h1 class="error">Error loading component: ${err.message}</h1>`;
      }
    }
    loadComponent();
  </script>
</body>
</html>
