                        "secondary-container": "#2170e4",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-container": "#7c839b",
                        "primary-container": "#131b2e",
                        "surface-container": "#e5eeff",
                        "surface-container-high": "#dce9ff",
                        "on-tertiary": "#ffffff",
                        "surface-bright": "#f8f9ff",
                        "inverse-primary": "#bec6e0",
                        "on-secondary-fixed": "#001a42",
                        "on-secondary-container": "#fefcff",
                        "background": "#f8f9ff",

                        "on-tertiary-fixed": "#191c1e",

                        "on-secondary": "#ffffff",
                        "outline-variant": "#c6c6cd",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "container-margin": "16px",
                        "stack-md": "16px",
                        "unit": "4px",
                        "gutter": "12px",
                        "stack-lg": "24px",
                        "stack-sm": "8px"
                    },
                    "fontFamily": {
                        "display-lg": ["Hanken Grotesk"],
                        "data-point": ["Hanken Grotesk"],

    <style>
      .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
      }
    </style>
  <!-- Use svelte directly from unpkg and importmap for module resolution -->
  <script type="importmap">
    {
      "imports": {
        "svelte": "https://unpkg.com/svelte@3.59.2/index.mjs",
        "svelte/internal": "https://unpkg.com/svelte@3.59.2/internal/index.mjs",
        "svelte/transition": "https://unpkg.com/svelte@3.59.2/transition/index.mjs"
      }
    }
  </script>
  <script src="https://unpkg.com/svelte@3.59.2/compiler.js"></script>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import * as svelteInternal from 'svelte/internal';

    async function loadComponent() {
      try {
        const response = await fetch('./src/components/DossierBuilder.svelte');
        const source = await response.text();

        const { js } = window.svelte.compile(source, {
          format: 'esm',
          name: 'DossierBuilder',
          sveltePath: 'svelte'
        });

        // Use importmap for resolution instead of replacing paths
        const blob = new Blob([js.code], { type: 'application/javascript' });
        const blobUrl = URL.createObjectURL(blob);

        const module = await import(blobUrl);
        const DossierBuilder = module.default;

        new DossierBuilder({
          target: document.getElementById('app')
        });
      } catch (err) {
        console.error(err);
        document.getElementById('app').innerHTML = `<h1 class="error">Error loading component: ${err.message}</h1>`;
      }
    }
    loadComponent();
  </script>
</body>
</html>
