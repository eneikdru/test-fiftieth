# We disable testcontainers ryuk explicitly here as well, although memory explicitly stated TESTCONTAINERS_RYUK_DISABLED=true exported in env works.
# To bypass the sandbox overlay mount error, we simply remove the testcontainers jdbc url entirely and allow zonky to take over.

zonky.test.database.type=POSTGRES
zonky.test.database.provider=zonky
zonky.test.database.replace=any
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
spring.flyway.enabled=true
spring.flyway.out-of-order=true
spring.flyway.baseline-on-migrate=true
server.address=${SERVER_ADDRESS:0.0.0.0}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Spring test properties
spring.test.database.replace=ANY
