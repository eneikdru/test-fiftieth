version: '3.8'

services:
  backend:
    # Backend service definition with Dockerfile build context and actuator health check
    build:
      context: .
      dockerfile: Dockerfile
    container_name: epidemiology_backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "18080:18080"
    environment:
      SERVER_PORT: "18080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-epidemiology_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:18080/health || wget --no-verbose --tries=1 --spider http://localhost:18080/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - app_uploads:/app/data/docs/uploads

  backup:
    environment:
      UPLOADS_DIR: /app/data/docs/uploads
    volumes:
      - app_uploads:/app/data/docs/uploads:ro
