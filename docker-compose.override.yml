version: '3.8'

services:
  db:
    container_name: "${COMPOSE_PROJECT_NAME:-epidemiology}_db"

  backend:
    # Backend service definition with Dockerfile build context and actuator health check
    container_name: "${COMPOSE_PROJECT_NAME:-epidemiology}_backend"
    build:
      context: .
      dockerfile: Dockerfile
    image: "${COMPOSE_PROJECT_NAME:-epidemiology}_backend:latest"
    command: ["java", "-jar", "/app/app.jar"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "18080:18080"
    environment:
      SERVER_PORT: "18080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:18080/health || wget --no-verbose --tries=1 --spider http://localhost:18080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - app_uploads:/app/data/docs/uploads

  backup:
    container_name: "${COMPOSE_PROJECT_NAME:-epidemiology}_backup"
    environment:
      UPLOADS_DIR: /app/data/docs/uploads
    volumes:
      - ./scripts:/scripts:ro
      - app_uploads:/app/data/docs/uploads:ro
      - backup_data:/backups
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache bash tar gzip findutils;
      BACKUP_SCRIPT='/scripts/backup.sh';
      if [ -d \"$$BACKUP_SCRIPT\" ] && [ -f \"$$BACKUP_SCRIPT/backup.sh\" ]; then BACKUP_SCRIPT=\"$$BACKUP_SCRIPT/backup.sh\"; fi;
      echo \"$${BACKUP_SCHEDULE} /bin/bash $$BACKUP_SCRIPT >> /var/log/backup.log 2>&1\" > /etc/crontabs/root;
      echo 'Running initial startup backup check...';
      if [ -f \"$$BACKUP_SCRIPT\" ]; then /bin/bash \"$$BACKUP_SCRIPT\"; else echo 'Backup script not found or is directory'; fi;
      echo 'Starting cron daemon with schedule: $${BACKUP_SCHEDULE}';
      crond -f -l 2
      "

networks:
  default:
    name: "${COMPOSE_PROJECT_NAME:-epidemiology}_default"
