version: '3.8'

services:
  db:
    container_name: "${COMPOSE_PROJECT_NAME:-epidemiology}_db"

  backend:
    # Backend service definition with Dockerfile build context and actuator health check
    container_name: "${COMPOSE_PROJECT_NAME:-epidemiology}_backend"
    build:
      context: .
      dockerfile: Dockerfile
    image: "${COMPOSE_PROJECT_NAME:-epidemiology}_backend:latest"
    command: ["java", "-jar", "/app/app.jar"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "18080:18080"
    environment:
      SERVER_PORT: "18080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:18080/health || wget --no-verbose --tries=1 --spider http://localhost:18080/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - app_uploads:/app/data/docs/uploads

  backup:
    container_name: "${COMPOSE_PROJECT_NAME:-epidemiology}_backup"
    environment:
      UPLOADS_DIR: /app/data/docs/uploads
    volumes:
      - ./scripts:/scripts:ro
      - app_uploads:/app/data/docs/uploads:ro
      - backup_data:/backups
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache bash tar gzip findutils;
      SCRIPT_PATH=\"$$(find /scripts /usr/local/bin -type f -name backup.sh 2>/dev/null | head -n 1)\";
      if [ -n \"$$SCRIPT_PATH\" ] && [ -f \"$$SCRIPT_PATH\" ]; then
        cp \"$$SCRIPT_PATH\" /usr/local/bin/run_backup.sh 2>/dev/null || true;
        chmod +x /usr/local/bin/run_backup.sh 2>/dev/null || true;
      fi;
      echo \"$${BACKUP_SCHEDULE} /bin/bash /usr/local/bin/run_backup.sh >> /var/log/backup.log 2>&1\" > /etc/crontabs/root;
      echo 'Running initial startup backup check...';
      if [ -f /usr/local/bin/run_backup.sh ]; then
        /bin/bash /usr/local/bin/run_backup.sh;
      elif [ -f /scripts/backup.sh ]; then
        /bin/bash /scripts/backup.sh;
      elif [ -f /usr/local/bin/backup.sh ]; then
        /bin/bash /usr/local/bin/backup.sh;
      fi;
      echo 'Starting cron daemon with schedule: $${BACKUP_SCHEDULE}';
      crond -f -l 2
      "

networks:
  default:
    name: "${COMPOSE_PROJECT_NAME:-epidemiology}_default"
