version: '3.8'

services:
  db:
    container_name: "${COMPOSE_PROJECT_NAME:-epidemiology}_db"

  backend:
    # Backend service definition with Dockerfile build context and actuator health check
    container_name: "${COMPOSE_PROJECT_NAME:-epidemiology}_backend"
    build:
      context: .
      dockerfile: Dockerfile
    image: "${COMPOSE_PROJECT_NAME:-epidemiology}_backend:latest"
    command: ["java", "-jar", "/app/app.jar"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "18080:18080"
    environment:
      SERVER_PORT: "18080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-epidemiology_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_FLYWAY_IGNORE_MISSING_MIGRATIONS: "true"
      SPRING_FLYWAY_IGNORE_MIGRATION_PATTERNS: "*:missing"
    healthcheck:
      # updated to actuator/health
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:18080/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - app_uploads:/app/data/docs/uploads

  backup:
    container_name: "${COMPOSE_PROJECT_NAME:-epidemiology}_backup"
    environment:
      UPLOADS_DIR: /app/data/docs/uploads
      ALLOW_MOCK_BACKUP: "1"
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - app_uploads:/app/data/docs/uploads:ro
      - backup_data:/backups
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache bash tar gzip findutils;
      echo \"$${BACKUP_SCHEDULE:-0 2 * * *} bash /usr/local/bin/backup.sh >> /var/log/backup.log 2>&1\" > /etc/crontabs/root;
      echo 'Running initial startup backup check...';
      if [ -f /usr/local/bin/backup.sh ] && [ ! -d /usr/local/bin/backup.sh ]; then bash /usr/local/bin/backup.sh; fi;
      echo 'Starting cron daemon with schedule: $${BACKUP_SCHEDULE:-0 2 * * *}';
      crond -f -l 2
      "

networks:
  default:
    name: "${COMPOSE_PROJECT_NAME:-epidemiology}_default"
