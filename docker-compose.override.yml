version: '3.8'

services:
  db:
    container_name: "${COMPOSE_PROJECT_NAME:-epidemiology}_db"

  backend:
    # Backend service definition with Dockerfile build context and actuator health check
    image: eclipse-temurin:21-jre-alpine
    networks:
      default:
        aliases:
          - host.docker.internal
    command: ["java", "-jar", "/app/target/epidemiology-knowledge-base-0.0.1-SNAPSHOT.jar"]
    container_name: "${COMPOSE_PROJECT_NAME:-epidemiology}_backend"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "18080:18080"
    environment:
      SERVER_PORT: "18080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-epidemiology_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:18080/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./target:/app/target
      - app_uploads:/app/data/docs/uploads

  backup:
    container_name: "${COMPOSE_PROJECT_NAME:-epidemiology}_backup"
    environment:
      UPLOADS_DIR: /app/data/docs/uploads
    volumes:
      - app_uploads:/app/data/docs/uploads:ro
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache bash tar gzip findutils;
      echo \"$${BACKUP_SCHEDULE} bash /usr/local/bin/backup.sh >> /var/log/backup.log 2>&1\" > /etc/crontabs/root;
      echo 'Running initial startup backup check...';
      bash /usr/local/bin/backup.sh;
      echo 'Starting cron daemon with schedule: $${BACKUP_SCHEDULE}';
      crond -f -l 2
      "

networks:
  default:
    name: "${COMPOSE_PROJECT_NAME:-epidemiology}_default"
