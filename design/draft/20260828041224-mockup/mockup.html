<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Loading State - Data Feed</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#7c839b",
                        "on-tertiary-fixed": "#0b1c30",
                        "secondary-container": "#d5e3fd",
                        "surface-container-high": "#e6e8ea",
                        "on-surface": "#191c1e",
                        "tertiary": "#000000",
                        "surface-container-highest": "#e0e3e5",
                        "on-surface-variant": "#45464d",
                        "error": "#ba1a1a",
                        "inverse-primary": "#bec6e0",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#515f74",
                        "outline": "#76777d",
                        "primary-fixed": "#dae2fd",
                        "on-secondary-fixed": "#0d1c2f",
                        "surface-container": "#eceef0",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#bec6e0",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "on-tertiary-container": "#75859d",
                        "on-tertiary": "#ffffff",
                        "surface-tint": "#565e74",
                        "on-error-container": "#93000a",
                        "background": "#f7f9fb",
                        "surface-container-low": "#f2f4f6",
                        "secondary-fixed-dim": "#b9c7e0",
                        "on-background": "#191c1e",
                        "inverse-surface": "#2d3133",
                        "tertiary-container": "#0b1c30",
                        "on-primary-fixed-variant": "#3f465c",
                        "primary-container": "#131b2e",
                        "on-primary-fixed": "#131b2e",
                        "surface-bright": "#f7f9fb",
                        "on-secondary-container": "#57657b",
                        "primary": "#000000",
                        "outline-variant": "#c6c6cd",
                        "surface-variant": "#e0e3e5",
                        "on-tertiary-fixed-variant": "#38485d",
                        "surface": "#f7f9fb",
                        "on-secondary-fixed-variant": "#3a485c",
                        "surface-dim": "#d8dadc",
                        "secondary-fixed": "#d5e3fd",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed-dim": "#b7c8e1",
                        "tertiary-fixed": "#d3e4fe",
                        "inverse-on-surface": "#eff1f3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "base": "4px",
                        "container-margin": "20px",
                        "gutter": "12px",
                        "stack-lg": "24px"
                    },
                    "fontFamily": {
                        "body-lg": ["Hanken Grotesk"],
                        "label-caps": ["JetBrains Mono"],
                        "headline-md": ["Hanken Grotesk"],
                        "headline-sm": ["Hanken Grotesk"],
                        "data-point": ["JetBrains Mono"],
                        "display-lg": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "data-point": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    },
                    "animation": {
                        "shimmer": "shimmer 1.5s infinite linear"
                    },
                    "keyframes": {
                        "shimmer": {
                            "0%": { "transform": "translateX(-100%)" },
                            "100%": { "transform": "translateX(100%)" }
                        }
                    }
                }
            }
        }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .skeleton-shimmer {
            position: relative;
            overflow: hidden;
            background-color: theme('colors.surface-container-high');
        }
        .skeleton-shimmer::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            transform: translateX(-100%);
            background-image: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0,
                rgba(255, 255, 255, 0.2) 20%,
                rgba(255, 255, 255, 0.5) 60%,
                rgba(255, 255, 255, 0)
            );
            animation: shimmer 1.5s infinite linear;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col pt-16 pb-16 md:hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface border-b border-outline-variant dark:border-outline flat no shadows flex items-center justify-between px-container-margin h-16 max-w-full">
<button class="text-primary dark:text-inverse-primary hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors duration-200 active:bg-surface-variant p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm font-semibold text-on-surface dark:text-inverse-on-surface">Data Feed</h1>
<button class="text-primary dark:text-inverse-primary hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors duration-200 active:bg-surface-variant p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</header>
<!-- Main Content (Loading Skeletons) -->
<main class="flex-1 p-container-margin flex flex-col gap-gutter overflow-y-auto">
<!-- Skeleton Card 1 -->
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant/30 p-stack-md flex flex-col gap-stack-sm">
<div class="flex items-center gap-stack-md mb-base">
<div class="w-10 h-10 rounded-full skeleton-shimmer"></div>
<div class="flex-1">
<div class="h-4 w-1/3 skeleton-shimmer rounded mb-2"></div>
<div class="h-3 w-1/4 skeleton-shimmer rounded"></div>
</div>
</div>
<div class="h-3 w-full skeleton-shimmer rounded"></div>
<div class="h-3 w-5/6 skeleton-shimmer rounded"></div>
<div class="h-3 w-4/6 skeleton-shimmer rounded"></div>
<div class="h-32 w-full skeleton-shimmer rounded-lg mt-stack-sm"></div>
</div>
<!-- Skeleton Card 2 -->
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant/30 p-stack-md flex flex-col gap-stack-sm">
<div class="flex items-center gap-stack-md mb-base">
<div class="w-10 h-10 rounded-full skeleton-shimmer"></div>
<div class="flex-1">
<div class="h-4 w-2/5 skeleton-shimmer rounded mb-2"></div>
<div class="h-3 w-1/5 skeleton-shimmer rounded"></div>
</div>
</div>
<div class="h-3 w-full skeleton-shimmer rounded"></div>
<div class="h-3 w-3/4 skeleton-shimmer rounded"></div>
</div>
<!-- Skeleton Card 3 (Metric style) -->
<div class="grid grid-cols-2 gap-gutter">
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant/30 p-stack-md flex flex-col gap-stack-sm">
<div class="h-3 w-1/2 skeleton-shimmer rounded"></div>
<div class="h-8 w-3/4 skeleton-shimmer rounded mt-base"></div>
</div>
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant/30 p-stack-md flex flex-col gap-stack-sm">
<div class="h-3 w-1/2 skeleton-shimmer rounded"></div>
<div class="h-8 w-3/4 skeleton-shimmer rounded mt-base"></div>
</div>
</div>
<!-- Skeleton Card 4 -->
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant/30 p-stack-md flex flex-col gap-stack-sm">
<div class="flex items-center gap-stack-md mb-base">
<div class="w-10 h-10 rounded-full skeleton-shimmer"></div>
<div class="flex-1">
<div class="h-4 w-1/3 skeleton-shimmer rounded mb-2"></div>
<div class="h-3 w-1/4 skeleton-shimmer rounded"></div>
</div>
</div>
<div class="h-3 w-full skeleton-shimmer rounded"></div>
<div class="h-3 w-5/6 skeleton-shimmer rounded"></div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center h-16 pb-safe bg-surface dark:bg-surface border-t border-outline-variant dark:border-outline flat no shadows z-50">
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-primary-container text-on-secondary-container dark:text-on-primary-container rounded-full px-4 py-1 active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="dashboard" style="font-variation-settings: 'FILL' 1;">dashboard</span>
<span class="font-label-caps text-label-caps mt-1">Dashboard</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:text-primary dark:hover:text-inverse-primary active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="bar_chart">bar_chart</span>
<span class="font-label-caps text-label-caps mt-1">Analytics</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:text-primary dark:hover:text-inverse-primary active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="assignment">assignment</span>
<span class="font-label-caps text-label-caps mt-1">Reports</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:text-primary dark:hover:text-inverse-primary active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-caps text-label-caps mt-1">Settings</span>
</button>
</nav>
</body></html>
