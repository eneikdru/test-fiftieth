<!DOCTYPE html>

<html lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Восстановление пароля</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#94b2fe",
                        "on-error": "#ffffff",
                        "on-surface-variant": "#434653",
                        "primary-fixed": "#dbe1ff",
                        "surface-tint": "#2156ca",
                        "on-secondary-container": "#204287",
                        "background": "#f9f9fc",
                        "secondary-fixed": "#dae2ff",
                        "on-tertiary-container": "#b9c3d2",
                        "on-surface": "#1a1c1e",
                        "outline": "#737685",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#3e4853",
                        "tertiary-container": "#47515d",
                        "error": "#ba1a1a",
                        "tertiary-fixed": "#d9e3f2",
                        "surface-container": "#eeeef0",
                        "tertiary": "#303a45",
                        "primary": "#00328a",
                        "secondary": "#3d5ca2",
                        "surface-variant": "#e2e2e5",
                        "error-container": "#ffdad6",
                        "on-tertiary": "#ffffff",
                        "surface-bright": "#f9f9fc",
                        "primary-fixed-dim": "#b3c5ff",
                        "on-tertiary-fixed": "#131c27",
                        "secondary-fixed-dim": "#b1c5ff",
                        "surface-container-high": "#e8e8ea",
                        "primary-container": "#0047bb",
                        "on-secondary": "#ffffff",
                        "surface-container-low": "#f3f3f6",
                        "on-primary-fixed": "#00174a",
                        "inverse-surface": "#2f3133",
                        "surface-dim": "#dadadc",
                        "on-primary": "#ffffff",
                        "inverse-on-surface": "#f0f0f3",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed": "#001946",
                        "on-secondary-fixed-variant": "#224489",
                        "on-primary-container": "#afc1ff",
                        "tertiary-fixed-dim": "#bdc7d6",
                        "surface-container-highest": "#e2e2e5",
                        "outline-variant": "#c3c6d6",
                        "surface": "#f9f9fc",
                        "on-background": "#1a1c1e",
                        "inverse-primary": "#b3c5ff",
                        "on-primary-fixed-variant": "#003ea6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "8px",
                        "input-height": "56px",
                        "button-height": "52px",
                        "container-padding": "24px",
                        "stack-gap": "16px"
                    },
                    "fontFamily": {
                        "headline-sm": ["Manrope"],
                        "body-lg": ["Inter"],
                        "display-lg": ["Manrope"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Manrope"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],

                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],

            }
        }

<style>
        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom, 16px);
        }
        
        .input-ring-transition {
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }
        
        .input-focus-ring:focus-within {
            border-color: #00328a; /* primary */
            box-shadow: 0 0 0 4px rgba(0, 50, 138, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex flex-col text-on-surface antialiased">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-background flex items-center h-16 px-container-padding max-w-md mx-auto z-10">
<button aria-label="Назад" class="mr-4 text-primary active:scale-95 transition-transform duration-200 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-primary flex-1">Восстановление</h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-container-padding max-w-md mx-auto w-full pt-8 pb-8 safe-area-bottom">
<!-- Headers -->
<div class="mb-[32px]">
<h2 class="font-display-lg text-display-lg text-on-surface mb-unit">Забыли пароль?</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Введите ваш email, чтобы получить инструкции по сбросу пароля.</p>
</div>
<!-- Form Section -->
<form class="flex flex-col flex-1" novalidate="" onsubmit="event.preventDefault(); document.getElementById('loading-btn').classList.remove('hidden'); document.getElementById('btn-text').classList.add('hidden'); setTimeout(() =&gt; { document.getElementById('loading-btn').classList.add('hidden'); document.getElementById('btn-text').classList.remove('hidden'); }, 2000);">
<div class="mb-stack-gap">
<label class="block font-label-md text-label-md text-on-surface mb-unit" for="email">Email</label>
<div class="relative input-focus-ring rounded border border-outline-variant bg-surface-container-lowest input-ring-transition">
<input class="w-full h-input-height px-4 bg-transparent border-none focus:ring-0 font-body-lg text-body-lg text-on-surface placeholder:text-outline" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<!-- Spacer to push button to bottom on mobile if needed, though instructions say 32px between sections -->
<div class="mt-auto pt-[32px]">
<button class="w-full h-button-height bg-primary text-on-primary rounded-lg font-label-md text-label-md flex items-center justify-center active:scale-95 transition-transform duration-200 hover:opacity-90" type="submit">
<span id="btn-text">Отправить</span>
<!-- Loading Spinner (Hidden by default) -->
<svg class="hidden animate-spin h-6 w-6 text-on-primary" fill="none" id="loading-btn" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
<path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
</button>
</div>
</form>
</main>
</body></html>
