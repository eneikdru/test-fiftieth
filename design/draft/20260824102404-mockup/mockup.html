<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .input-focus-ring:focus-within {
            box-shadow: 0 0 0 4px rgba(0, 82, 255, 0.2);
            border-color: #003ec7;
        }
        .btn-active:active {
            filter: brightness(0.9);
        }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background min-h-screen flex flex-col font-body-md text-on-background">
<!-- Progress Indicator -->
<div class="w-full h-1 bg-surface-variant fixed top-0 z-50">
<div class="h-full bg-primary w-1/3 transition-all duration-300"></div>
</div>
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-container-lowest text-primary dark:text-primary-fixed font-headline-md text-headline-md dark:text-on-surface docked full-width top-0 bg-surface dark:bg-surface-container-lowest flat no shadows flex items-center justify-between px-6 py-4 w-full sticky z-40 transition-opacity pt-[calc(1rem+4px)]">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">SecureAccess</h1>
<div class="w-10 h-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col justify-center px-container-margin py-section-gap w-full max-w-md mx-auto relative z-10">
<div class="mb-section-gap text-center md:text-left">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-base">Create Account</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your details to register securely.</p>
</div>
<form class="flex flex-col gap-element-gap">
<!-- Full Name Input -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="fullName">Full Name</label>
<div class="relative input-focus-ring bg-surface-container-lowest border border-[#EAECF0] rounded-DEFAULT transition-all duration-200">
<input class="w-full bg-transparent border-none p-input-padding font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:ring-0 focus:outline-none" id="fullName" placeholder="John Doe" type="text"/>
</div>
</div>
<!-- Email Input -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative input-focus-ring bg-surface-container-lowest border border-[#EAECF0] rounded-DEFAULT transition-all duration-200">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline-variant text-[20px]">mail</span>
<input class="w-full bg-transparent border-none py-[12px] pr-[16px] pl-[44px] font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:ring-0 focus:outline-none" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative input-focus-ring bg-surface-container-lowest border border-[#EAECF0] rounded-DEFAULT transition-all duration-200">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline-variant text-[20px]">lock</span>
<input class="w-full bg-transparent border-none py-[12px] pr-[44px] pl-[44px] font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:ring-0 focus:outline-none" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Confirm Password Input -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="confirmPassword">Confirm Password</label>
<div class="relative input-focus-ring bg-surface-container-lowest border border-[#EAECF0] rounded-DEFAULT transition-all duration-200">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline-variant text-[20px]">lock</span>
<input class="w-full bg-transparent border-none py-[12px] pr-[44px] pl-[44px] font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:ring-0 focus:outline-none" id="confirmPassword" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-3 mt-2">
<div class="relative flex items-center justify-center mt-1">
<input class="peer appearance-none w-[20px] h-[20px] border border-[#EAECF0] rounded-[4px] bg-surface-container-lowest checked:bg-primary checked:border-primary transition-colors cursor-pointer focus:ring-2 focus:ring-primary-container focus:ring-offset-2 focus:ring-offset-background" id="terms" type="checkbox"/>
<span class="material-symbols-outlined text-on-primary text-[16px] absolute pointer-events-none opacity-0 peer-checked:opacity-100 transition-opacity" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer select-none" for="terms">
                    I agree to the <a class="text-primary font-semibold hover:underline" href="#">Terms of Service</a> and <a class="text-primary font-semibold hover:underline" href="#">Privacy Policy</a>.
                </label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-body-md text-body-md font-bold py-[14px] rounded-lg mt-4 btn-active transition-all shadow-[0px_4px_20px_rgba(0,0,0,0.05)] hover:bg-on-primary-fixed-variant" type="submit">
                Create Account
            </button>
</form>
<!-- Log In Link -->
<div class="mt-section-gap text-center pb-24 md:pb-0">
<p class="font-body-md text-body-md text-on-surface-variant">
                Already have an account? 
                <a class="text-primary font-bold hover:underline" href="#">Log In</a>
</p>
</div>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 w-full z-50 flex justify-around items-center py-3 px-6 bg-surface dark:bg-surface-container-lowest border-t-0 shadow-[0_-4px_20px_rgba(0,0,0,0.02)]">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container-high p-2 rounded-lg transition-colors w-20" href="#">
<span class="material-symbols-outlined mb-1">login</span>
<span class="font-label-sm text-label-sm">Login</span>
</a>
<a class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed font-bold hover:bg-surface-container-low dark:hover:bg-surface-container-high p-2 rounded-lg transition-colors w-20 active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">person_add</span>
<span class="font-label-sm text-label-sm">Register</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-low dark:hover:bg-surface-container-high p-2 rounded-lg transition-colors w-20" href="#">
<span class="material-symbols-outlined mb-1">help_outline</span>
<span class="font-label-sm text-label-sm">Help</span>
</a>
</nav>
</body></html>
