    body {

<body class="bg-background text-on-background min-h-screen flex flex-col items-center antialiased md:bg-surface-container-low md:justify-center md:py-12">
<!-- Linear/Transactional page intent: No TopAppBar or BottomNavBar shell elements per Semantic Shell Mandate -->
<!-- On mobile: full width, no outer card styling. On desktop: card style constraint -->
<main class="w-full h-full flex flex-col px-margin-main pt-stack-lg pb-stack-lg max-w-[480px] bg-background md:shadow-[0_8px_16px_rgba(9,30,66,0.08)] md:rounded-xl md:h-auto">
<!-- Header Section -->
<header class="flex flex-col items-center justify-center text-center mb-stack-lg pt-8 md:pt-0">
<div aria-hidden="true" class="h-touch-target w-touch-target bg-primary-container text-on-primary-container rounded-full flex items-center justify-center mb-stack-md">
<span class="material-symbols-outlined" data-icon="shield_lock" data-weight="fill" style="font-size: 28px;">shield_lock</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-stack-sm md:font-headline-lg md:text-headline-lg">SecureAccess</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to your enterprise account</p>
</header>
<!-- Login Form -->
<form action="#" class="w-full flex flex-col gap-stack-md mb-stack-lg" method="POST">
<!-- Email Input -->
<div class="flex flex-col gap-stack-sm w-full">
<label class="font-label-lg text-label-lg text-on-surface" for="email">Corporate Email</label>
<div class="relative w-full">
<span aria-hidden="true" class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">mail</span>
<input autocomplete="email" class="w-full h-touch-target bg-surface border border-outline-variant rounded-lg pl-12 pr-4 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:border-2 transition-colors placeholder:text-outline-variant" id="email" name="email" placeholder="name@enterprise.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-stack-sm w-full">
<div class="flex justify-between items-center w-full">
<label class="font-label-lg text-label-lg text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative w-full">
<span aria-hidden="true" class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">key</span>
<input autocomplete="current-password" class="w-full h-touch-target bg-surface border border-outline-variant rounded-lg pl-12 pr-12 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:border-2 transition-colors placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-2 top-1/2 -translate-y-1/2 w-[40px] h-[40px] flex items-center justify-center text-outline-variant hover:text-on-surface focus:outline-none focus:ring-2 focus:ring-primary rounded-full transition-colors" type="button">
<span aria-hidden="true" class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-touch-target mt-stack-md bg-primary text-on-primary font-button text-button rounded-lg flex items-center justify-center hover:bg-on-primary-fixed-variant transition-colors active:scale-[0.98]" type="submit">
                Sign In
            </button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-stack-md w-full mb-stack-lg">
<div aria-hidden="true" class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-4 font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Or continue with</span>
<div aria-hidden="true" class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- SSO Section -->
<div class="flex flex-col gap-stack-md w-full mb-stack-lg">
<button class="w-full h-touch-target bg-transparent border border-outline-variant text-on-surface font-button text-button rounded-lg flex items-center justify-center gap-2 hover:bg-surface-container-low hover:border-primary transition-colors active:scale-[0.98]" type="button">
<span aria-hidden="true" class="material-symbols-outlined text-primary">domain</span>
                Sign in with SSO
            </button>
<div class="flex justify-center gap-gutter w-full">
<!-- Google SSO Mock -->
<button aria-label="Sign in with Google" class="w-touch-target h-touch-target bg-surface border border-outline-variant rounded-lg flex items-center justify-center hover:bg-surface-container-low transition-colors focus:outline-none focus:ring-2 focus:ring-primary" type="button">
<svg aria-hidden="true" class="w-6 h-6" viewbox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path><path d="M1 1h22v22H1z" fill="none"></path></svg>
</button>
<!-- Microsoft SSO Mock -->
<button aria-label="Sign in with Microsoft" class="w-touch-target h-touch-target bg-surface border border-outline-variant rounded-lg flex items-center justify-center hover:bg-surface-container-low transition-colors focus:outline-none focus:ring-2 focus:ring-primary" type="button">
<svg aria-hidden="true" class="w-5 h-5" viewbox="0 0 21 21"><path d="M1 1h9v9H1z" fill="#f25022"></path><path d="M1 11h9v9H1z" fill="#00a4ef"></path><path d="M11 1h9v9h-9z" fill="#7fba00"></path><path d="M11 11h9v9h-9z" fill="#ffb900"></path></svg>
</button>
</div>
</div>
<!-- Administrative Access -->
<div class="mt-auto w-full flex justify-center pb-8 md:pb-0">
<a class="inline-flex items-center gap-2 font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 rounded-sm p-1" href="#">
<span aria-hidden="true" class="material-symbols-outlined" style="font-size: 16px;">admin_panel_settings</span>
                Administrative Override
            </a>
</div>
</main>
<script>
        // Simple password toggle logic
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtns = document.querySelectorAll('button[aria-label="Toggle password visibility"]');
            toggleBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const input = this.previousElementSibling;
                    const icon = this.querySelector('.material-symbols-outlined');
                    if (input.type === 'password') {
                        input.type = 'text';
                        icon.textContent = 'visibility';
                    } else {
                        input.type = 'password';
                        icon.textContent = 'visibility_off';
                    }
                });
            });
        });
    </script>
</body></html>
