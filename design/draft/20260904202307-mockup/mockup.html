<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Account Recovery - Password Reset</title>

                        "on-secondary-fixed-variant": "#43474b",
                        "surface-container": "#eeeef0",
                        "surface-bright": "#f9f9fc",

                        "tertiary-fixed": "#6ffbbe",
                        "on-tertiary-fixed-variant": "#005236",
                        "on-secondary-container": "#5e6367",
                        "surface-container-high": "#e8e8ea",
                        "secondary-container": "#dce0e4",

                        "surface-variant": "#e2e2e5",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-container": "#a5bdff",
                        "on-secondary-fixed": "#171c1f",
                        "secondary": "#5a5f62",

                        "on-tertiary": "#ffffff",
                        "secondary-fixed": "#dfe3e7",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "on-primary-fixed": "#001946",
                        "on-error-container": "#93000a",
                        "on-primary-fixed-variant": "#00419e",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#e2e2e5",
                        "on-background": "#1a1c1e",

                        "on-surface": "#1a1c1e",
                        "on-tertiary-fixed": "#002113",
                        "on-tertiary-container": "#44d69b",
                        "inverse-primary": "#b1c5ff",
                        "tertiary": "#003f29",
                        "surface-dim": "#dadadc",
                        "primary-container": "#0047ab",
                        "secondary-fixed-dim": "#c3c7cb",
                        "background": "#f9f9fc",
                        "inverse-on-surface": "#f0f0f3",
                        "surface-container-low": "#f3f3f6",
                        "surface-tint": "#2559bd",
                        "tertiary-container": "#00593c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-page": "24px",
                        "field-spacing": "20px",
                        "touch-target-min": "48px",
                        "gutter-stack": "16px"
                    },
                    "fontFamily": {
                        "helper-text": ["Inter"],
                        "body-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"]
                    },
                    "fontSize": {
                        "helper-text": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],

                    }
                }
            }
        }

<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .input-focus-ring:focus-within {
            box-shadow: 0 0 0 4px theme('colors.primary-fixed-dim');
            border-color: theme('colors.primary');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface border-b border-outline-variant flex items-center px-margin-page h-touch-target-min z-50">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors active:scale-95 transition-transform text-on-surface-variant mr-4">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">Account Recovery</h1>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center justify-start px-margin-page py-12 w-full max-w-md mx-auto">
<!-- Progress Indicator -->
<div aria-label="Progress: Step 1 of 3" class="w-full h-1 bg-surface-variant rounded-full mb-10 overflow-hidden">
<div class="h-full bg-primary w-1/3 rounded-full transition-all duration-500 ease-out"></div>
</div>
<div class="w-full text-center mb-8">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-4">Forgot Password?</h2>
<p class="font-body-md text-body-md text-on-surface-variant">
                Enter your email address and we'll send you a link to reset your password.
            </p>
</div>
<!-- Form Card -->
<div class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl p-6 shadow-sm">
<form action="#" class="flex flex-col gap-field-spacing" method="POST">
<!-- Email Input -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface" for="email">Email Address</label>
<div class="relative flex items-center bg-surface border border-outline-variant rounded-lg input-focus-ring transition-all duration-200">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant pointer-events-none" data-icon="mail">mail</span>
<input aria-required="true" class="w-full h-12 pl-10 pr-4 bg-transparent border-none rounded-lg focus:ring-0 font-body-md text-body-md text-on-surface placeholder-on-surface-variant/50" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
<!-- Helper Text Placeholder (Hidden by default) -->
<p class="font-helper-text text-helper-text text-error hidden" id="email-error">Please enter a valid email address.</p>
</div>
<!-- Submit Button -->
<button class="w-full h-touch-target-min bg-primary text-on-primary rounded-lg font-label-sm text-label-sm font-semibold flex items-center justify-center gap-2 hover:bg-primary/90 active:scale-95 transition-all duration-200 shadow-[0_4px_12px_rgba(0,50,125,0.15)] mt-4" type="submit">
<span>Send Reset Link</span>
<span class="material-symbols-outlined text-sm" data-icon="send">send</span>
</button>
<!-- Back to Login Link -->
<div class="text-center mt-4">
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors underline-offset-4 hover:underline" href="#">
                        Return to Login
                    </a>
</div>
</form>
</div>
</main>
<!-- Footer -->
<footer class="w-full mt-auto bg-surface border-t border-outline-variant flex flex-col items-center gap-gutter-stack py-8 px-margin-page">
<div class="flex gap-6 font-helper-text text-helper-text text-on-secondary-container">
<a class="hover:text-primary transition-colors cursor-pointer" href="#">Privacy Policy</a>
<a class="hover:text-primary transition-colors cursor-pointer" href="#">Terms of Service</a>
<a class="hover:text-primary transition-colors cursor-pointer" href="#">Help Center</a>
</div>
<p class="font-label-sm text-label-sm font-semibold text-primary">
            © 2024 Security Systems Inc.
        </p>
</footer>
<script>
        // Simple client-side validation logic for demonstration
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            const emailInput = document.getElementById('email');
            const errorText = document.getElementById('email-error');
            const inputContainer = emailInput.parentElement;
            
            if(!emailInput.value || !emailInput.value.includes('@')) {
                // Show Error State
                inputContainer.classList.replace('border-outline-variant', 'border-error');
                inputContainer.classList.add('shadow-[0_0_0_4px_theme(colors.error-container)]');
                errorText.classList.remove('hidden');
                
                // Add error icon
                if(!inputContainer.querySelector('.error-icon')) {
                    const errorIcon = document.createElement('span');
                    errorIcon.className = 'material-symbols-outlined absolute right-3 text-error error-icon pointer-events-none';
                    errorIcon.textContent = 'error';
                    inputContainer.appendChild(errorIcon);
                }
            } else {
                // Success State (simulated submission)
                const btn = this.querySelector('button[type="submit"]');
                btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span><span>Sending...</span>';
                btn.disabled = true;
                btn.classList.add('opacity-80', 'cursor-not-allowed');
                
                setTimeout(() => {
                    // Reset or move to next step
                    btn.innerHTML = '<span>Link Sent!</span><span class="material-symbols-outlined">check_circle</span>';
                    btn.classList.replace('bg-primary', 'bg-[theme(colors.tertiary-container)]');
                }, 1500);
            }
        });

        // Reset error state on input
        document.getElementById('email').addEventListener('input', function() {
            const inputContainer = this.parentElement;
            const errorText = document.getElementById('email-error');
            
            inputContainer.classList.replace('border-error', 'border-outline-variant');
            inputContainer.classList.remove('shadow-[0_0_0_4px_theme(colors.error-container)]');
            errorText.classList.add('hidden');
            
            const errorIcon = inputContainer.querySelector('.error-icon');
            if(errorIcon) {
                errorIcon.remove();
            }
        });
    </script>
</body></html>
