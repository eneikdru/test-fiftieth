<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Delivery Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                "inverse-primary": "#4ae176",
                "secondary-container": "#dae2fd",
                "error": "#ba1a1a",
                "on-surface-variant": "#3d4a3d",
                "on-secondary": "#ffffff",
                "primary-fixed-dim": "#4ae176",
                "on-primary-fixed-variant": "#005321",
                "surface": "#f8f9ff",
                "surface-variant": "#d3e4fe",
                "on-primary-fixed": "#002109",
                "surface-dim": "#cbdbf5",
                "on-secondary-container": "#5c647a",
                "tertiary-fixed-dim": "#c0c1ff",
                "on-error": "#ffffff",
                "on-tertiary-container": "#2623b8",
                "primary-fixed": "#6bff8f",
                "outline-variant": "#bccbb9",
                "on-secondary-fixed": "#131b2e",
                "surface-container-high": "#dce9ff",
                "on-surface": "#0b1c30",
                "tertiary": "#494bd6",
                "error-container": "#ffdad6",
                "surface-tint": "#006e2f",
                "on-tertiary-fixed-variant": "#2f2ebe",
                "secondary-fixed": "#dae2fd",
                "surface-bright": "#f8f9ff",
                "tertiary-container": "#a1a3ff",
                "on-secondary-fixed-variant": "#3f465c",
                "surface-container-highest": "#d3e4fe",
                "surface-container-low": "#eff4ff",
                "inverse-surface": "#213145",
                "inverse-on-surface": "#eaf1ff",
                "tertiary-fixed": "#e1e0ff",
                "background": "#f8f9ff",
                "on-tertiary-fixed": "#07006c",
                "primary-container": "#22c55e",
                "on-background": "#0b1c30",
                "surface-container-lowest": "#ffffff",
                "secondary-fixed-dim": "#bec6e0",
                "on-primary-container": "#004b1e",
                "surface-container": "#e5eeff",
                "on-error-container": "#93000a",
                "on-tertiary": "#ffffff",
                "on-primary": "#ffffff",
                "outline": "#6d7b6c",
                "primary": "#006e2f",
                "secondary": "#565e74"
              },
              "borderRadius": {
                "DEFAULT": "0.125rem",
                "lg": "0.25rem",
                "xl": "0.5rem",
                "full": "0.75rem"
              },
              "spacing": {
                "gutter": "16px",
                "xl": "40px",
                "base": "4px",
                "margin-desktop": "32px",
                "sm": "8px",
                "margin-mobile": "16px",
                "xs": "4px",
                "lg": "24px",
                "md": "16px"
              },
              "fontFamily": {
                "display": ["Inter"],
                "body-md": ["Inter"],
                "title-md": ["Inter"],
                "headline-lg-mobile": ["Inter"],
                "label-caps": ["Inter"],
                "code-sm": ["JetBrains Mono"],
                "headline-lg": ["Inter"]
              },
              "fontSize": {
                "display": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                "title-md": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                "label-caps": ["11px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                "code-sm": ["13px", {"lineHeight": "18px", "fontWeight": "400"}],
                "headline-lg": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600"}]
              }
            }
          }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased md:hidden pb-[80px]">
<!-- TopAppBar (From JSON Anchor) -->
<header class="flex items-center justify-between px-margin-mobile h-16 w-full fixed top-0 z-50 bg-surface border-b border-outline-variant">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">account_tree</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">Delivery Pipeline</h1>
</div>
<span class="material-symbols-outlined text-on-surface-variant">notifications</span>
</header>
<!-- Main Content Canvas -->
<main class="pt-[80px] px-margin-mobile flex flex-col gap-lg">
<!-- Header Section -->
<section class="flex flex-col gap-xs">
<h2 class="font-display text-[28px] leading-[36px] font-bold tracking-tight text-on-surface">Feature Delivery: R1</h2>
<div class="flex items-center gap-sm bg-primary/10 w-fit px-3 py-1.5 rounded-full border border-primary/20">
<span class="material-symbols-outlined text-primary text-[18px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-body-md text-body-md text-on-surface font-medium">R1 Implementation: Complete</span>
</div>
</section>
<!-- Main Branch Delivery Card -->
<section class="bg-surface-container-lowest rounded-xl border border-outline-variant shadow-[0_4px_12px_rgba(0,0,0,0.03)] p-md flex flex-col gap-md transition-all duration-200 hover:border-outline hover:shadow-[0_4px_16px_rgba(0,0,0,0.06)]">
<div class="flex justify-between items-center border-b border-outline-variant/50 pb-sm">
<h3 class="font-title-md text-title-md text-on-surface">Main Branch Delivery</h3>
<span class="font-label-caps text-label-caps bg-primary-container text-on-primary-container px-2 py-0.5 rounded flex items-center gap-1">
<span class="w-1.5 h-1.5 rounded-full bg-primary block"></span>
                    DELIVERED
                </span>
</div>
<div class="flex items-center justify-center py-lg relative">
<!-- Visual Merge Representation -->
<div class="flex flex-col gap-xl w-full max-w-[240px]">
<!-- Source Branch -->
<div class="flex items-center justify-between relative z-10">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-full border-2 border-secondary bg-surface flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-secondary text-[16px]">commit</span>
</div>
<span class="font-code-sm text-code-sm text-secondary px-2 py-1 bg-surface-container-low rounded border border-outline-variant/30">feature/r1</span>
</div>
</div>
<!-- Merge Path (SVG) -->
<svg class="absolute top-[32%] left-[16px] w-[24px] h-[40px] text-primary" fill="none" viewbox="0 0 24 40" xmlns="http://www.w3.org/2000/svg">
<path d="M12 0 V20 C12 30, 24 30, 24 40" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M20 36 L24 40 L28 36" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" transform="translate(-4, 0)"></path>
</svg>
<!-- Target Branch -->
<div class="flex items-center justify-between relative z-10 pl-6">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-full border-2 border-primary bg-primary/10 flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-primary text-[16px]" style="font-variation-settings: 'FILL' 1;">merge</span>
</div>
<span class="font-code-sm text-code-sm text-primary font-bold px-2 py-1 bg-primary/5 rounded border border-primary/20">main</span>
</div>
</div>
<!-- Decorative Line -->
<div class="absolute left-[30px] top-[16px] bottom-[16px] w-[2px] bg-outline-variant/30 z-0"></div>
</div>
</div>
</section>
<!-- Delivered Components Section -->
<section class="flex flex-col gap-md">
<h3 class="font-title-md text-title-md text-on-surface">Delivered Components</h3>
<div class="flex flex-col gap-sm">
<!-- Component Item -->
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant p-sm flex justify-between items-center hover:bg-surface-container-low transition-colors cursor-pointer">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded bg-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant">widgets</span>
</div>
<div class="flex flex-col">
<span class="font-body-md text-body-md font-semibold text-on-surface">UI Component Library</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">v2.4.0</span>
</div>
</div>
<div class="flex flex-col items-end gap-1">
<span class="font-label-caps text-label-caps bg-surface-container text-on-surface-variant px-2 py-0.5 rounded border border-outline-variant/50">On Main Branch</span>
<span class="material-symbols-outlined text-primary text-[16px]">check</span>
</div>
</div>
</div>
</section>
</main>
<!-- BottomNavBar (From JSON Anchor) -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-4 py-2 bg-surface border-t border-outline-variant">
<!-- Pipeline (Active) -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">format_list_bulleted</span>
<span class="font-label-caps text-label-caps mt-1">Pipeline</span>
</button>
<!-- Branches (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-lowest active:scale-90 transition-all duration-200 px-4 py-1 rounded-full">
<span class="material-symbols-outlined">merge_type</span>
<span class="font-label-caps text-label-caps mt-1">Branches</span>
</button>
<!-- Components (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-lowest active:scale-90 transition-all duration-200 px-4 py-1 rounded-full">
<span class="material-symbols-outlined">inventory_2</span>
<span class="font-label-caps text-label-caps mt-1">Components</span>
</button>
<!-- Settings (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-lowest active:scale-90 transition-all duration-200 px-4 py-1 rounded-full">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-caps text-label-caps mt-1">Settings</span>
</button>
</nav>
</body></html>
