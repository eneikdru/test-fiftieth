<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Forgot Password</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Manrope:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#e6e8ea",
                        "surface-container-highest": "#e0e3e5",
                        "on-secondary-fixed": "#00174b",
                        "surface-bright": "#f7f9fb",
                        "on-tertiary-fixed-variant": "#38485d",
                        "tertiary-fixed-dim": "#b7c8e1",
                        "on-primary": "#ffffff",
                        "on-surface-variant": "#45464d",
                        "outline": "#76777d",
                        "on-tertiary-fixed": "#0b1c30",
                        "on-background": "#191c1e",
                        "on-primary-container": "#7c839b",
                        "secondary": "#0051d5",
                        "secondary-container": "#316bf3",
                        "on-tertiary-container": "#75859d",
                        "inverse-on-surface": "#eff1f3",
                        "secondary-fixed-dim": "#b4c5ff",
                        "surface-dim": "#d8dadc",
                        "background": "#f7f9fb",
                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a",
                        "surface-container": "#eceef0",
                        "inverse-surface": "#2d3133",
                        "tertiary": "#000000",
                        "primary-fixed": "#dae2fd",
                        "surface-variant": "#e0e3e5",
                        "surface-tint": "#565e74",
                        "on-tertiary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-container": "#0b1c30",
                        "surface": "#f7f9fb",
                        "secondary-fixed": "#dbe1ff",
                        "inverse-primary": "#bec6e0",
                        "on-primary-fixed": "#131b2e",
                        "primary-container": "#131b2e",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f2f4f6",
                        "on-surface": "#191c1e",
                        "on-secondary-container": "#fefcff",
                        "outline-variant": "#c6c6cd",
                        "primary": "#000000",
                        "on-secondary-fixed-variant": "#003ea8",
                        "on-error-container": "#93000a",
                        "on-primary-fixed-variant": "#3f465c",
                        "error-container": "#ffdad6",
                        "primary-fixed-dim": "#bec6e0",
                        "tertiary-fixed": "#d3e4fe"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "base-unit": "4px",
                        "gutter-mobile": "16px",
                        "section-gap": "48px",
                        "stack-lg": "32px",
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "margin-mobile": "24px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Manrope", "sans-serif"],
                        "body-sm": ["Inter", "sans-serif"],
                        "button-text": ["Inter", "sans-serif"],
                        "label-caps": ["Inter", "sans-serif"],
                        "headline-md": ["Manrope", "sans-serif"],
                        "headline-lg-mobile": ["Manrope", "sans-serif"],
                        "body-lg": ["Inter", "sans-serif"]
                    },
                    "fontSize": {
                        "headline-lg": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "button-text": ["16px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        [data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-sm antialiased md:max-w-md md:mx-auto md:border-x md:border-outline-variant md:shadow-xl md:min-h-[850px] relative">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface border-b border-outline-variant z-10">
<div class="flex items-center justify-between px-margin-mobile py-stack-md w-full h-16">
<button aria-label="Go back" class="flex items-center justify-center text-primary active:scale-95 duration-100 transition-transform p-2 -ml-2 rounded-full hover:bg-surface-container">
<span class="material-symbols-outlined text-2xl" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary flex-1 text-center pr-8">Security Center</h1>
</div>
</header>
<!-- Progress Indicator -->
<div class="w-full h-1 bg-surface-container-highest">
<div class="h-full bg-secondary w-1/3 rounded-r-full transition-all duration-500 ease-out"></div>
</div>
<!-- Main Content -->
<main class="flex-1 px-margin-mobile pt-section-gap pb-8 flex flex-col">
<div class="flex-1">
<!-- Header Section -->
<div class="mb-section-gap text-center">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-surface-container-high mb-stack-md text-primary">
<span class="material-symbols-outlined text-3xl" data-icon="lock_reset" data-weight="fill">lock_reset</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-stack-sm md:font-headline-lg md:text-headline-lg">Reset Your Password</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px] mx-auto leading-relaxed">
                    Enter your registered email address and we will send you a secure link to reset your password.
                </p>
</div>
<!-- Form Section -->
<form class="space-y-stack-lg" onsubmit="event.preventDefault(); document.getElementById('success-state').classList.remove('hidden'); this.classList.add('hidden');">
<!-- Email Input Group -->
<div class="space-y-stack-sm relative">
<label class="block font-body-sm text-body-sm text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative group">
<span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-secondary transition-colors">
<span class="material-symbols-outlined" data-icon="mail">mail</span>
</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-lg text-body-lg rounded-lg pl-12 pr-4 py-4 focus:outline-none focus:ring-0 focus:border-secondary focus:border-2 transition-all shadow-sm placeholder:text-outline" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<!-- Spacer to push button to bottom on mobile, keep inline on desktop if needed, but strict layout prefers bottom -->
<div class="mt-section-gap h-4"></div>
<!-- Submit Button -->
<button class="w-full h-[52px] bg-secondary text-on-secondary font-button-text text-button-text rounded-xl flex items-center justify-center active:scale-[0.98] transition-transform shadow-sm hover:bg-secondary-container mt-auto" type="submit">
                    Send Reset Link
                </button>
</form>
<!-- Success State (Hidden by default) -->
<div class="hidden flex-col items-center text-center mt-8 space-y-stack-lg animate-[fadeIn_0.3s_ease-out]" id="success-state">
<div class="w-20 h-20 bg-primary-fixed rounded-full flex items-center justify-center text-secondary relative overflow-hidden">
<span class="material-symbols-outlined text-4xl relative z-10" data-icon="mark_email_read" data-weight="fill">mark_email_read</span>
<div class="absolute inset-0 bg-secondary/10 animate-pulse"></div>
</div>
<div>
<h3 class="font-headline-md text-headline-md text-primary mb-stack-sm">Check your inbox</h3>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[280px] mx-auto">
                        We've sent a secure recovery link to your email. It will expire in 15 minutes.
                    </p>
</div>
<div class="w-full pt-8 space-y-stack-md">
<button class="w-full h-[52px] bg-surface-container border border-outline-variant text-primary font-button-text text-button-text rounded-xl flex items-center justify-center active:scale-[0.98] transition-transform">
                        Open Email App
                    </button>
<button class="w-full py-3 text-secondary font-button-text text-button-text text-center hover:underline" onclick="document.getElementById('success-state').classList.add('hidden'); document.querySelector('form').classList.remove('hidden');">
                        Try another email
                    </button>
</div>
</div>
</div>
</main>
<style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body></html>
